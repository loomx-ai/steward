<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="title description" lang="en">
<title id="title">Why a selected vSwitch is blocked</title><desc id="description">The cleanup selection contains api-01, public-gateway, and the application vSwitch. api-02 is outside the selection and still uses the vSwitch, blocking its deletion. Preserve the vSwitch if api-02 must remain, or review api-02 before expanding the selection.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#202637}.label{font-size:26px;font-weight:600}.body{font-size:22px;fill:#556078}.small{font-size:21px;fill:#556078}.accent{fill:#4c60d5}.warn{fill:#99430d}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#6f7aa0" stroke-width="1.6"/></marker><marker id="blocked" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#b45c23" stroke-width="1.6"/></marker></defs>
<rect width="640" height="700" rx="14" fill="#fff"/>
<rect x="32" y="28" width="576" height="374" rx="14" fill="#f6f7fd" stroke="#8d9ae1" stroke-width="2"/>
<text x="56" y="68" class="label accent">Selected for cleanup</text>
<rect x="56" y="96" width="248" height="70" rx="10" fill="#fff" stroke="#d5dbea"/>
<rect x="336" y="96" width="248" height="70" rx="10" fill="#fff" stroke="#d5dbea"/>
<text x="180" y="139" text-anchor="middle" class="label">api-01</text>
<text x="460" y="138" text-anchor="middle" font-size="24" font-weight="600">public-gateway</text>
<path d="M180 168V203H320M460 168V203H320V249" fill="none" stroke="#6f7aa0" stroke-width="2" marker-end="url(#arrow)"/>
<text x="345" y="233" class="small">Use the vSwitch</text>
<rect x="112" y="262" width="416" height="112" rx="12" fill="#fff6ed" stroke="#d9945a" stroke-width="2"/>
<text x="320" y="303" text-anchor="middle" class="label">application</text>
<text x="320" y="343" text-anchor="middle" class="body warn">vSwitch · deletion blocked</text>
<path d="M320 516V386" stroke="#b45c23" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#blocked)"/>
<rect x="341" y="432" width="235" height="40" rx="6" fill="#fff"/>
<text x="353" y="460" class="small warn">Still uses the vSwitch</text>
<rect x="112" y="520" width="416" height="112" rx="12" fill="#fff" stroke="#8c95a9" stroke-width="2" stroke-dasharray="7 5"/>
<text x="320" y="562" text-anchor="middle" class="label">api-02</text>
<text x="320" y="600" text-anchor="middle" class="body">Outside the selection</text>
<text x="320" y="676" text-anchor="middle" class="small">Arrows mean “uses”; they are not execution order.</text>
</svg>
