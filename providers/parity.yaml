schema: steward.io/provider-parity/v1
purpose: >-
  Engineering and lifecycle acceptance matrix. Resources reference existing explicit specifications;
  unimplemented_resources preserve candidates with missing specifications. Neither list proves
  equivalent product features. A pending row is unfinished even if some resource kinds exist.
  verification names the tests that exercise a mapping against an independent mock server or
  emulator; it records where evidence exists and never closes a row.
baseline_provider: alicloud
resources:
