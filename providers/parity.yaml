    - Microsoft.Security/pricings
  aws:
    resources:
    - AWS::GuardDuty::Detector
    - AWS::SecurityHub::Hub
  status: pending_verification
  notes: >-
    Azure reads native Defender protection tiers, sub-plans, trial and enablement times,
    extension status, coverage and resource-level inheritance, matching the read-only
    DescribeVersionConfig baseline. GCP now reads project Security Center Management service and module enablement through native
    locations/list/detail APIs, including intended versus effective state and update time.
    Service scans use non-authoritative visibility semantics: empty location or service lists
    preserve previous observations, while later detail reads update state. Native organization subscriptions additionally expose current tier, latest subscription type
    (including trial and pay-as-you-go), and start/end times through verified selected-project
    ancestry. Project and ancestor-organization billingMetadata now preserve the tier explicitly configured at each native
    location without inferring inherited entitlement or trial history. Project trial history,
    automatic cluster inventory, verified GKE identity mapping and independent behavior verification remain pending.
    Known native cluster service GET is supported, with response identity and settings validation. Ancestor folder
    and organization service settings are separately inventoried through a verified project parent
    chain at project-visible locations; arbitrary organization location/project enumeration is not claimed.
