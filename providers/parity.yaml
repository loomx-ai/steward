- alicloud: ACS::CEN::CenRouteMap
  spec: providers/alicloud/specs/cen-route-map.yaml
  class: network.route_policy
  baseline:
    inventory_source: cen-topology
    scope: region
    actions:
    - delete
  gcp:
    resources:
    - compute.googleapis.com/Router
    - compute.googleapis.com/RoutePolicy
    - compute.googleapis.com/NamedSet
  azure:
    resources:
    - Microsoft.Network/virtualHubs/routeMaps
  status: pending_verification
  notes: GCP route policies are independently inventoried per router through native
    paginated list and wrapped detail GET, including type, CEL terms and fingerprint.
    Failed details preserve prior observations; successful empty native lists prove absence.
    Independent native deletion now binds the scanned policy fingerprint and router ID,
    persists regional operation receipts and verifies policy absence after restart.
    Reviewed BGP import/export references are detached with native Router PATCH,
    preserving other peer settings and ordered policy lists. Persisted phases wait for
    detachment before deletion; permission failures, drift and native conflicts fail.
    Native mutations lack a fingerprint precondition. Named sets now have independent
    native inventory with prefix/community types, CEL elements and fingerprint.
    CEL literal prefix/community set references now create policy-to-set dependency
    edges; malformed or computed references fail the scan without closing history.
    Native named-set deletion now checks every live policy, preserves request identity,
    persists regional operations and verifies absence. Known policy references block
    set-only plans; selecting both orders policy deletion before set deletion.
    Computed-name resolution, parent cascade and independent/live acceptance remain
    unfinished. Router deletion is not
    policy deletion parity.
