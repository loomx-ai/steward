  spec: providers/alicloud/specs/ack-cluster.yaml
  class: container.cluster
  baseline:
    inventory_source: product-api
    scope: region
    actions:
    - delete
    hook: alicloud.ack.cluster
  gcp:
    resources:
    - container.googleapis.com/Cluster
  azure:
    resources:
    - Microsoft.ContainerService/managedClusters
  aws:
    resources:
    - AWS::EKS::Cluster
    - AWS::EKS::Nodegroup
    - AWS::EKS::FargateProfile
    - AWS::EKS::Addon
  status: pending_verification
