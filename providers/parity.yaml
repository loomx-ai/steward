    - Microsoft.Insights/dataCollectionRuleAssociations
    - Microsoft.Monitor/accounts
  aws:
    resources:
    - AWS::Oam::Sink
    - AWS::Oam::Link
  status: pending_verification
  notes: Native scope/member inventory and reviewed project-link removal are implemented.
    The scope and its self link remain project-owned; native APIs expose no independent scope delete.
    Incoming scopes are references outside the connection boundary. Broader monitoring configuration
    and real-cloud acceptance remain unverified. Azure data collection rules, endpoints and extension
    associations now use native product inventory and reviewed shared unlink prerequisites.
    Azure Monitor workspace deletion now reviews its native default managed resource group,
    preserves shared external unlink prerequisites and verifies group/known-child absence.
    Independent environment and real-cloud acceptance remain open.
