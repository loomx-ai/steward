- alicloud: ACS::ThreatDetection::Instance
  spec: providers/alicloud/specs/threat-detection-instance.yaml
  class: security.security_center
  baseline:
    inventory_source: product-api
    scope: global
    actions: []
  gcp:
    resources:
    - securitycenter.googleapis.com/Subscription
    - securitycentermanagement.googleapis.com/SecurityCenterService
    - securitycentermanagement.googleapis.com/BillingMetadata
    - securitycenter.googleapis.com/NotificationConfig
  azure:
