schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/dnsZones
  class: dns.zone
presentation:
  displayNames:
    en-US: DNS zone
    zh-CN: DNS 区域
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Network.Zones_ListByResourceGroup
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Network.Zones_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Resources/resourceGroups
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  zoneType:
    path: zoneType
    type: string
  numberOfRecordSets:
    path: numberOfRecordSets
    type: number
  maxNumberOfRecordSets:
    path: maxNumberOfRecordSets
    type: number
  nameServers:
    path: nameServers
    type: array
extensions:
  hook: azure.resource
relationships: []
actions:
  delete:
    operation: Azure.Microsoft.Network.Zones_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.Zones_Get
      itemsPath: $
      identityPath: id
