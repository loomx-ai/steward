schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Compute/virtualMachines
  class: compute.instance
presentation:
  displayNames:
    en-US: Azure virtual machine
    zh-CN: Azure 虚拟机
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: Azure.Microsoft.Compute.VirtualMachines_Get
    itemsPath: $
    identityPath: id
  list:
    operation: Azure.Microsoft.Compute.VirtualMachines_ListAll
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  vmSize:
    path: hardwareProfile.vmSize
    type: string
  osType:
    path: storageProfile.osDisk.osType
    type: string
extensions:
  hook: azure.resource
relationships:
- type: attached_to
  targetType: Microsoft.Compute/disks
  targetIdPath: refs_microsoft_compute_disks
- type: uses
  targetType: Microsoft.Compute/availabilitySets
  targetIdPath: refs_microsoft_compute_availabilitysets
- type: uses
  targetType: Microsoft.Network/networkInterfaces
  targetIdPath: refs_microsoft_network_networkinterfaces
- type: member_of
  targetType: Microsoft.Network/virtualNetworks
  targetIdPath: refs_microsoft_network_virtualnetworks
- type: member_of
  targetType: Microsoft.Network/virtualNetworks/subnets
  targetIdPath: refs_microsoft_network_virtualnetworks_subnets
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
actions:
  delete:
    operation: Azure.Microsoft.Compute.VirtualMachines_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Compute.VirtualMachines_Get
      itemsPath: $
      identityPath: id
