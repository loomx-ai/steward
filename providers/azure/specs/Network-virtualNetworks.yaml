schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/virtualNetworks
  class: network.vpc
presentation:
  displayNames:
    en-US: Virtual network
    zh-CN: 虚拟网络
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: Azure.Microsoft.Network.VirtualNetworks_Get
    itemsPath: $
    identityPath: id
  list:
    operation: Azure.Microsoft.Network.VirtualNetworks_ListAll
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  addressSpace:
    path: addressSpace
    type: object
extensions:
  hook: azure.resource
actions:
  delete:
    operation: Azure.Microsoft.Network.VirtualNetworks_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.VirtualNetworks_Get
      itemsPath: $
      identityPath: id
