schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DesktopVirtualization/applicationGroups
  class: compute.virtual_desktop_policy
presentation:
  displayNames:
    en-US: Azure Virtual Desktop application group
    zh-CN: Azure 虚拟桌面应用程序组
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.DesktopVirtualization.ApplicationGroups_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.DesktopVirtualization.ApplicationGroups_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  applicationGroupType:
    path: applicationGroupType
    type: string
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.DesktopVirtualization/hostPools
  targetIdPath: refs_microsoft_desktopvirtualization_hostpools
actions:
  delete:
    operation: Azure.Microsoft.DesktopVirtualization.ApplicationGroups_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.DesktopVirtualization.ApplicationGroups_Get
      itemsPath: $
      identityPath: id
