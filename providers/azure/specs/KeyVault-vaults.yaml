schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.KeyVault/vaults
  class: security.vault
presentation:
  displayNames:
    en-US: Key Vault
    zh-CN: Key Vault 保管库
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: azure-resource-manager
  detail:
    operation: Azure.Microsoft.KeyVault.Vaults_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  softDeleteEnabled:
    path: enableSoftDelete
    type: boolean
  purgeProtectionEnabled:
    path: enablePurgeProtection
    type: boolean
extensions:
  hook: azure.resource
