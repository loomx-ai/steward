schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.AzureStackHCI/marketplaceGalleryImages
  class: compute.image
presentation:
  displayNames:
    en-US: Azure Local marketplace image
    zh-CN: Azure Local 市场镜像
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: azure-local
  list:
    operation: Azure.Microsoft.AzureStackHCI.MarketplaceGalleryImages_ListAll
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.AzureStackHCI.MarketplaceGalleryImages_Get
    itemsPath: $
    identityPath: id
fields:
  state: state
  osType: osType
  hyperVGeneration: hyperVGeneration
  publisher: identifier.publisher
  offer: identifier.offer
  sku: identifier.sku
extensions:
  hook: azure.resource
actions:
  delete:
    operation: Azure.Microsoft.AzureStackHCI.MarketplaceGalleryImages_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.AzureStackHCI.MarketplaceGalleryImages_Get
      itemsPath: $
      identityPath: id
