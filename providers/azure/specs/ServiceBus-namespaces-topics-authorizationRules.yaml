schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.ServiceBus/namespaces/topics/authorizationRules
  class: messaging.authorization_rule
presentation:
  displayNames:
    en-US: Service Bus topic authorization rule
    zh-CN: Service Bus 主题授权规则
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.ServiceBus.Topics_ListAuthorizationRules
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      namespaceName: parent.normalized.arm_parameters.namespaceName
      topicName: parent.normalized.arm_parameters.topicName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.ServiceBus.Topics_GetAuthorizationRule
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.ServiceBus/namespaces/topics
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  rights:
    path: rights
    type: array
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.ServiceBus/namespaces/topics
  targetIdPath: refs_microsoft_servicebus_namespaces_topics
actions:
  delete:
    operation: Azure.Microsoft.ServiceBus.Topics_DeleteAuthorizationRule
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.ServiceBus.Topics_GetAuthorizationRule
      itemsPath: $
      identityPath: id
