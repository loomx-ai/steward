  nativeType: Microsoft.Compute/sshPublicKeys
  class: security.key_pair
presentation:
  displayNames:
    en-US: SSH public key
    zh-CN: SSH 公钥
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Compute.SshPublicKeys_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Compute.SshPublicKeys_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  publicKey:
    path: publicKey
    type: string
extensions:
  hook: azure.resource
relationships: []
actions:
  delete:
    operation: Azure.Microsoft.Compute.SshPublicKeys_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Compute.SshPublicKeys_Get
      itemsPath: $
      identityPath: id
