schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Insights/components
  class: observability.monitoring_environment
presentation:
  displayNames:
    en-US: Application Insights component
    zh-CN: Application Insights 组件
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Insights.Components_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Insights.Components_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  applicationId:
    path: AppId
    type: string
  workspaceResourceId:
    path: WorkspaceResourceId
    type: string
  ingestionMode:
    path: IngestionMode
    type: string
  retentionInDays:
    path: RetentionInDays
    type: number
  billingFeatures:
    path: billing_features.CurrentBillingFeatures
    type: array
  dailyCapGb:
    path: billing_features.DataVolumeCap.Cap
    type: number
  pricingPlan:
    path: pricing_plan.properties.planType
    type: string
  quotaThrottled:
    path: quota_status.ShouldBeThrottled
    type: boolean
  proactiveDetection:
    path: proactive_detection
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.OperationalInsights/workspaces
  targetIdPath: refs_microsoft_operationalinsights_workspaces
actions:
  delete:
    operation: Azure.Microsoft.Insights.Components_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Insights.Components_Get
      itemsPath: $
      identityPath: id
