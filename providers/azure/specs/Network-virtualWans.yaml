schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/virtualWans
  class: network.cloud_enterprise_network
presentation:
  displayNames:
    en-US: Virtual WAN
    zh-CN: 虚拟 WAN
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Network.VirtualWans_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Network.VirtualWans_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  type:
    path: type
    type: string
  allowBranchToBranchTraffic:
    path: allowBranchToBranchTraffic
    type: boolean
  disableVpnEncryption:
    path: disableVpnEncryption
    type: boolean
extensions:
  hook: azure.resource
relationships: []
actions:
  delete:
    operation: Azure.Microsoft.Network.VirtualWans_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.VirtualWans_Get
      itemsPath: $
      identityPath: id
