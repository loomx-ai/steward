schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Search/searchServices
  class: data.search_service
presentation:
  displayNames:
    en-US: Azure AI Search service
    zh-CN: Azure AI Search 服务
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Search.Services_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Search.Services_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  sku:
    path: sku
    type: object
  endpoint:
    path: endpoint
    type: string
  publicNetworkAccess:
    path: publicNetworkAccess
    type: string
  replicaCount:
    path: replicaCount
    type: number
  partitionCount:
    path: partitionCount
    type: number
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
actions:
  delete:
    operation: Azure.Microsoft.Search.Services_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Search.Services_Get
      itemsPath: $
      identityPath: id
