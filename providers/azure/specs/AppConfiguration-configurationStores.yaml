schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.AppConfiguration/configurationStores
  class: config.store
presentation:
  displayNames:
    en-US: App Configuration store
    zh-CN: 应用配置存储
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.AppConfiguration.ConfigurationStores_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.AppConfiguration.ConfigurationStores_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  softDeleteRetentionInDays:
    path: softDeleteRetentionInDays
    type: number
  enablePurgeProtection:
    path: enablePurgeProtection
    type: boolean
extensions:
  hook: azure.resource
relationships: []
actions:
  delete:
    operation: Azure.Microsoft.AppConfiguration.ConfigurationStores_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.AppConfiguration.ConfigurationStores_Get
      itemsPath: $
      identityPath: id
