schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/virtualHubs
  class: network.transit_router
presentation:
  displayNames:
    en-US: Virtual hub
    zh-CN: 虚拟中心
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Network.VirtualHubs_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Network.VirtualHubs_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  addressPrefix:
    path: addressPrefix
    type: string
  virtualRouterAsn:
    path: virtualRouterAsn
    type: number
  virtualRouterIps:
    path: virtualRouterIps
    type: array
  routingState:
    path: routingState
    type: string
  sku:
    path: sku
    type: string
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Network/virtualWans
  targetIdPath: refs_microsoft_network_virtualwans
actions:
  delete:
    operation: Azure.Microsoft.Network.VirtualHubs_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.VirtualHubs_Get
      itemsPath: $
      identityPath: id
