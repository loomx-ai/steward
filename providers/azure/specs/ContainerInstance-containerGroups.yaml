schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.ContainerInstance/containerGroups
  class: compute.container_group
presentation:
  displayNames:
    en-US: Container instance group
    zh-CN: 容器实例组
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: Azure.Microsoft.ContainerInstance.ContainerGroups_Get
    itemsPath: $
    identityPath: id
  list:
    operation: Azure.Microsoft.ContainerInstance.ContainerGroups_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  osType:
    path: osType
    type: string
  restartPolicy:
    path: restartPolicy
    type: string
  sku:
    path: sku
    type: string
  priority:
    path: priority
    type: string
extensions:
  hook: azure.resource
relationships:
- type: member_of
  targetType: Microsoft.Network/virtualNetworks
  targetIdPath: refs_microsoft_network_virtualnetworks
- type: uses
  targetType: Microsoft.Network/virtualNetworks/subnets
  targetIdPath: refs_microsoft_network_virtualnetworks_subnets
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
- type: uses
  targetType: Microsoft.OperationalInsights/workspaces
  targetIdPath: refs_microsoft_operationalinsights_workspaces
actions:
  delete:
    operation: Azure.Microsoft.ContainerInstance.ContainerGroups_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.ContainerInstance.ContainerGroups_Get
      itemsPath: $
      identityPath: id
