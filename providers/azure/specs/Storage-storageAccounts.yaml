schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Storage/storageAccounts
  class: storage.account
presentation:
  displayNames:
    en-US: Storage account
    zh-CN: 存储账户
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: azure-resource-manager
  detail:
    operation: Azure.Microsoft.Storage.StorageAccounts_GetProperties
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  accessTier:
    path: accessTier
    type: string
  httpsOnly:
    path: supportsHttpsTrafficOnly
    type: boolean
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
actions:
  delete:
    operation: Azure.Microsoft.Storage.StorageAccounts_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Storage.StorageAccounts_GetProperties
      itemsPath: $
      identityPath: id
