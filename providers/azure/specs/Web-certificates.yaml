schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Web/certificates
  class: security.certificate
presentation:
  displayNames:
    en-US: App Service certificate
    zh-CN: App Service 证书
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Web.Certificates_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Web.Certificates_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  thumbprint:
    path: thumbprint
    type: string
  expirationDate:
    path: expirationDate
    type: string
  subjectName:
    path: subjectName
    type: string
  hostNames:
    path: hostNames
    type: array
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.KeyVault/vaults
  targetIdPath: refs_microsoft_keyvault_vaults
- type: uses
  targetType: Microsoft.Web/serverfarms
  targetIdPath: refs_microsoft_web_serverfarms
actions:
  delete:
    operation: Azure.Microsoft.Web.Certificates_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Web.Certificates_Get
      itemsPath: $
      identityPath: id
