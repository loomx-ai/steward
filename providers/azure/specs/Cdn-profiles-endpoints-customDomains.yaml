schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Cdn/profiles/endpoints/customDomains
  class: network.cdn_domain
presentation:
  displayNames:
    en-US: CDN custom domain
    zh-CN: CDN 自定义域名
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Cdn.CustomDomains_ListByEndpoint
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      profileName: parent.normalized.arm_parameters.profileName
      endpointName: parent.normalized.arm_parameters.endpointName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Cdn.CustomDomains_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Cdn/profiles/endpoints
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  hostName:
    path: hostName
    type: string
  customHttpsProvisioningState:
    path: customHttpsProvisioningState
    type: string
  customHttpsParameters:
    path: customHttpsParameters
    type: object
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Cdn/profiles/endpoints
  targetIdPath: refs_microsoft_cdn_profiles_endpoints
- type: depends_on
  targetType: Microsoft.KeyVault/vaults
  targetIdPath: refs_microsoft_keyvault_vaults
actions:
  delete:
    operation: Azure.Microsoft.Cdn.CustomDomains_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Cdn.CustomDomains_Get
      itemsPath: $
      identityPath: id
