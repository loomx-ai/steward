  nativeType: Microsoft.Synapse/workspaces/restorableDroppedSqlPools
  class: storage.snapshot
presentation:
  displayNames:
    en-US: Restorable dropped SQL pool
    zh-CN: 可恢复的已删除 SQL 池
scope:
