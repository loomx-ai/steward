      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      workspaceName: parent.normalized.arm_parameters.workspaceName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Synapse.RestorableDroppedSqlPools_Get
    itemsPath: $
