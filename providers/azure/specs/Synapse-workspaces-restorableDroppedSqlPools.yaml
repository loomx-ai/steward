    source: synapse
    nativeType: Microsoft.Synapse/workspaces
fields:
  name:
    path: name
    type: string
  state:
    path: state
    type: string
  databaseName:
    path: databaseName
    type: string
  creationDate:
    path: creationDate
    type: string
  deletionDate:
    path: deletionDate
    type: string
  earliestRestoreDate:
    path: earliestRestoreDate
    type: string
  restorePointType:
    path: restorePointType
    type: string
  restorePointCreationDate:
    path: restorePointCreationDate
    type: string
  restorePointLabel:
    path: restorePointLabel
    type: string
  edition:
    path: edition
    type: string
  serviceLevelObjective:
    path: serviceLevelObjective
    type: string
  maxSizeBytes:
    path: maxSizeBytes
    type: string
extensions:
