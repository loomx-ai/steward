schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.ApiManagement/service/privateEndpointConnections
  class: network.private_endpoint_connection
presentation:
  displayNames:
    en-US: API Management private endpoint connection
    zh-CN: API 管理专用终结点连接
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
