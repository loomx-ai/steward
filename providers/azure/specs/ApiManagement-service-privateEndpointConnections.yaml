relationships:
- type: uses
  targetType: Microsoft.ApiManagement/service
  targetIdPath: refs_microsoft_apimanagement_service
- type: uses
  targetType: Microsoft.Network/privateEndpoints
  targetIdPath: refs_microsoft_network_privateendpoints
actions:
  delete:
    operation: Azure.Microsoft.ApiManagement.PrivateEndpointConnection_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.ApiManagement.PrivateEndpointConnection_GetByName
      itemsPath: $
      identityPath: id
