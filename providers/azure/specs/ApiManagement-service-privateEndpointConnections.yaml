    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  privateLinkServiceConnectionState:
    path: privateLinkServiceConnectionState
    type: object
extensions:
