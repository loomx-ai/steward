schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Batch/batchAccounts/jobs/tasks
  class: compute.batch_task
presentation:
  displayNames:
    en-US: Batch task
    zh-CN: 批处理任务
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Batch.DataPlane.Tasks_ListTasks
