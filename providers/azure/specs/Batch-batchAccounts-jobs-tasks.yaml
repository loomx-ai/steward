      endpoint: parent.normalized._batch_endpoint
      jobId: parent.normalized._batch_parameters.jobId
    itemsPath: value
    identityPath: url
  detail:
    operation: Azure.Microsoft.Batch.DataPlane.Tasks_GetTask
    itemsPath: $
    identityPath: url
  parent:
    source: product-api
    nativeType: Microsoft.Batch/batchAccounts/jobs
fields:
  name:
    path: name
    type: string
  state:
    path: state
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  poolInfo:
    path: poolInfo
    type: object
  jobSchedule:
    path: jobSchedule
    type: object
  dependsOn:
    path: dependsOn
    type: object
extensions:
