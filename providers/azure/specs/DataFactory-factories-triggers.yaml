schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DataFactory/factories/triggers
  class: data.trigger
presentation:
  displayNames:
    en-US: Data Factory trigger
    zh-CN: 数据工厂触发器
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: data-factory
  list:
    operation: Azure.Microsoft.DataFactory.Triggers_ListByFactory
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.DataFactory.Triggers_Get
    itemsPath: $
    identityPath: id
  parent:
    source: data-factory
    nativeType: Microsoft.DataFactory/factories
fields:
  name:
    path: name
    type: string
  state:
    path: state
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.DataFactory/factories
  targetIdPath: _datafactory_parent
actions:
  delete:
    operation: Azure.Microsoft.DataFactory.Triggers_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.DataFactory.Triggers_Get
      itemsPath: $
      identityPath: id
