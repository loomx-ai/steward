schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Web/sites/slots
  class: compute.service_slot
presentation:
  displayNames:
    en-US: App Service deployment slot
    zh-CN: App Service 部署槽
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Web.WebApps_ListSlots
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      name: parent.normalized.arm_parameters.name
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Web.WebApps_GetSlot
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Web/sites
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Web/sites
  targetIdPath: refs_microsoft_web_sites
- type: uses
  targetType: Microsoft.Web/serverfarms
  targetIdPath: refs_microsoft_web_serverfarms
- type: uses
  targetType: Microsoft.Network/virtualNetworks
  targetIdPath: refs_microsoft_network_virtualnetworks
- type: uses
  targetType: Microsoft.Network/virtualNetworks/subnets
  targetIdPath: refs_microsoft_network_virtualnetworks_subnets
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
- type: uses
  targetType: Microsoft.Web/certificates
  targetIdPath: refs_microsoft_web_certificates
- type: uses
  targetType: Microsoft.Web/sites/certificates
  targetIdPath: refs_microsoft_web_sites_certificates
- type: uses
  targetType: Microsoft.Web/sites/slots/certificates
  targetIdPath: refs_microsoft_web_sites_slots_certificates
actions:
  delete:
    operation: Azure.Microsoft.Web.WebApps_DeleteSlot
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Web.WebApps_GetSlot
      itemsPath: $
      identityPath: id
    parameters:
      deleteEmptyServerFarm: false
