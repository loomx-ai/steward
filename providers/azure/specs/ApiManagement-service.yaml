schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.ApiManagement/service
  class: network.api_gateway
presentation:
  displayNames:
    en-US: API Management service
    zh-CN: API 管理服务
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.ApiManagement.ApiManagementService_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.ApiManagement.ApiManagementService_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  publisherName:
    path: publisherName
    type: string
  createdAtUtc:
    path: createdAtUtc
    type: string
  virtualNetworkType:
    path: virtualNetworkType
    type: string
  publicNetworkAccess:
    path: publicNetworkAccess
    type: string
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Network/virtualNetworks/subnets
  targetIdPath: refs_microsoft_network_virtualnetworks_subnets
- type: uses
  targetType: Microsoft.Network/virtualNetworks
  targetIdPath: refs_microsoft_network_virtualnetworks
- type: uses
  targetType: Microsoft.Network/publicIPAddresses
  targetIdPath: refs_microsoft_network_publicipaddresses
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
- type: uses
  targetType: Microsoft.KeyVault/vaults
  targetIdPath: refs_microsoft_keyvault_vaults
actions:
  delete:
    operation: Azure.Microsoft.ApiManagement.ApiManagementService_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.ApiManagement.ApiManagementService_Get
      itemsPath: $
      identityPath: id
