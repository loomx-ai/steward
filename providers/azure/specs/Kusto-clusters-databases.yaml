schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Kusto/clusters/databases
  class: data.database
presentation:
  displayNames:
    en-US: Kusto database
    zh-CN: Kusto 数据库
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Kusto.Databases_ListByCluster
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      clusterName: parent.normalized.arm_parameters.clusterName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Kusto.Databases_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Kusto/clusters
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  kind:
    path: kind
    type: string
  softDeletePeriod:
    path: softDeletePeriod
    type: string
  hotCachePeriod:
    path: hotCachePeriod
    type: string
  isFollowed:
    path: isFollowed
    type: boolean
  leaderClusterResourceId:
    path: leaderClusterResourceId
    type: string
  attachedDatabaseConfigurationName:
    path: attachedDatabaseConfigurationName
    type: string
  originalDatabaseName:
    path: originalDatabaseName
    type: string
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Kusto/clusters
  targetIdPath: refs_microsoft_kusto_clusters
- type: uses
  targetType: Microsoft.Kusto/clusters/attachedDatabaseConfigurations
  targetIdPath: refs_microsoft_kusto_clusters_attacheddatabaseconfigurations
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
actions:
  delete:
    operation: Azure.Microsoft.Kusto.Databases_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Kusto.Databases_Get
      itemsPath: $
      identityPath: id
