schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Insights/privateLinkScopes
  class: observability.private_link_scope
presentation:
  displayNames:
    en-US: Azure Monitor private link scope
    zh-CN: Azure Monitor 专用链接范围
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Insights.PrivateLinkScopes_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Insights.PrivateLinkScopes_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  accessModeSettings:
    path: accessModeSettings
    type: object
  privateLinkCapabilities:
    path: privateLinkCapabilities
    type: array
extensions:
  hook: azure.resource
actions:
  delete:
    operation: Azure.Microsoft.Insights.PrivateLinkScopes_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Insights.PrivateLinkScopes_Get
      itemsPath: $
      identityPath: id
