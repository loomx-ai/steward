schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Cdn/profiles/endpoints
  class: network.cdn_domain
presentation:
  displayNames:
    en-US: CDN endpoint
    zh-CN: CDN 终结点
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Cdn.Endpoints_ListByProfile
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      profileName: parent.normalized.arm_parameters.profileName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Cdn.Endpoints_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Cdn/profiles
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  hostName:
    path: hostName
    type: string
  originPath:
    path: originPath
    type: string
  originHostHeader:
    path: originHostHeader
    type: string
  isHttpAllowed:
    path: isHttpAllowed
    type: boolean
  isHttpsAllowed:
    path: isHttpsAllowed
    type: boolean
  isCompressionEnabled:
    path: isCompressionEnabled
    type: boolean
  defaultOriginGroup:
    path: defaultOriginGroup
    type: object
  deliveryPolicy:
    path: deliveryPolicy
    type: object
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Cdn/cdnWebApplicationFirewallPolicies
  targetIdPath: refs_microsoft_cdn_cdnwebapplicationfirewallpolicies
- type: depends_on
  targetType: Microsoft.Cdn/profiles
  targetIdPath: refs_microsoft_cdn_profiles
actions:
  delete:
    operation: Azure.Microsoft.Cdn.Endpoints_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Cdn.Endpoints_Get
      itemsPath: $
      identityPath: id
