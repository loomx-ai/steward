schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/dnsZones/CNAME
  class: dns.record_set
presentation:
  displayNames:
    en-US: DNS CNAME record set
    zh-CN: DNS CNAME 记录集
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Network.DnsManagementClient.RecordSets_ListByType
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      zoneName: parent.normalized.arm_parameters.zoneName
      recordType: CNAME
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Network.DnsManagementClient.RecordSets_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Network/dnsZones
fields:
  name:
    path: name
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  ttl:
    path: TTL
    type: number
  fqdn:
    path: fqdn
    type: string
  metadata:
    path: metadata
    type: object
  records:
    path: CNAMERecord
    type: object
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Network/dnsZones
  targetIdPath: refs_microsoft_network_dnszones
- type: depends_on
  targetType: Microsoft.Network/publicIPAddresses
  targetIdPath: refs_microsoft_network_publicipaddresses
- type: depends_on
  targetType: Microsoft.Network/trafficManagerProfiles
  targetIdPath: refs_microsoft_network_trafficmanagerprofiles
actions:
  delete:
    operation: Azure.Microsoft.Network.DnsManagementClient.RecordSets_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.DnsManagementClient.RecordSets_Get
      itemsPath: $
      identityPath: id
    parameters:
      If-Match: resource.normalized.arm_etag
