schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Cache/redis
  class: database.cache
presentation:
  displayNames:
    en-US: Azure Cache for Redis
    zh-CN: Azure Redis 缓存
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Cache.Redis_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Cache.Redis_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  sku:
    path: sku
    type: object
  redisVersion:
    path: redisVersion
    type: string
  hostName:
    path: hostName
    type: string
  publicNetworkAccess:
    path: publicNetworkAccess
    type: string
  redisConfiguration:
    path: redisConfiguration
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Network/virtualNetworks/subnets
  targetIdPath: refs_microsoft_network_virtualnetworks_subnets
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
actions:
  delete:
    operation: Azure.Microsoft.Cache.Redis_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Cache.Redis_Get
      itemsPath: $
      identityPath: id
