schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/vpnGateways
  class: network.vpn_gateway
presentation:
  displayNames:
    en-US: Virtual WAN VPN gateway
    zh-CN: 虚拟 WAN VPN 网关
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Network.VpnGateways_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Network.VpnGateways_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  vpnGatewayScaleUnit:
    path: vpnGatewayScaleUnit
    type: number
  bgpSettings:
    path: bgpSettings
    type: object
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Network/virtualHubs
  targetIdPath: refs_microsoft_network_virtualhubs
actions:
  delete:
    operation: Azure.Microsoft.Network.VpnGateways_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.VpnGateways_Get
      itemsPath: $
      identityPath: id
