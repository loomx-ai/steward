schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Sql/servers/elasticPools
  class: database.pool
presentation:
  displayNames:
    en-US: SQL elastic pool
    zh-CN: SQL 弹性池
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: azure-resource-manager
  detail:
    operation: Azure.Microsoft.Sql.ElasticPools_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Sql/servers
  targetIdPath: refs_microsoft_sql_servers
actions:
  delete:
    operation: Azure.Microsoft.Sql.ElasticPools_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Sql.ElasticPools_Get
      itemsPath: $
      identityPath: id
