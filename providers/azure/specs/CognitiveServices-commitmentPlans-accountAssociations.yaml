schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.CognitiveServices/commitmentPlans/accountAssociations
  class: billing.commitment_association
presentation:
  displayNames:
    en-US: AI commitment plan account association
    zh-CN: AI 承诺计划账号关联
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.CognitiveServices.CommitmentPlans_ListAssociations
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      commitmentPlanName: parent.normalized.arm_parameters.commitmentPlanName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.CognitiveServices.CommitmentPlans_GetAssociation
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.CognitiveServices/commitmentPlans
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  accountId:
    path: accountId
    type: string
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.CognitiveServices/commitmentPlans
  targetIdPath: refs_microsoft_cognitiveservices_commitmentplans
- type: uses
  targetType: Microsoft.CognitiveServices/accounts
  targetIdPath: refs_microsoft_cognitiveservices_accounts
actions:
  delete:
    operation: Azure.Microsoft.CognitiveServices.CommitmentPlans_DeleteAssociation
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.CognitiveServices.CommitmentPlans_GetAssociation
      itemsPath: $
      identityPath: id
