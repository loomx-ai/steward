schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/publicIPAddresses
  class: network.public_ip
presentation:
  displayNames:
    en-US: Public IP address
    zh-CN: 公网 IP 地址
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: Azure.Microsoft.Network.PublicIPAddresses_Get
    itemsPath: $
    identityPath: id
  list:
    operation: Azure.Microsoft.Network.PublicIPAddresses_ListAll
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  ipAddress:
    path: ipAddress
    type: string
  allocationMethod:
    path: publicIPAllocationMethod
    type: string
extensions:
  hook: azure.resource
actions:
  delete:
    operation: Azure.Microsoft.Network.PublicIPAddresses_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.PublicIPAddresses_Get
      itemsPath: $
      identityPath: id
