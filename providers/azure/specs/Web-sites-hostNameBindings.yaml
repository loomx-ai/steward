schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Web/sites/hostNameBindings
  class: network.domain_binding
presentation:
  displayNames:
    en-US: App hostname binding
    zh-CN: 应用主机名绑定
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Web.WebApps_ListHostNameBindings
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      name: parent.normalized.arm_parameters.name
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Web.WebApps_GetHostNameBinding
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Web/sites
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  sslState:
    path: sslState
    type: string
  thumbprint:
    path: thumbprint
    type: string
  hostNameType:
    path: hostNameType
    type: string
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Web/sites
  targetIdPath: refs_microsoft_web_sites
- type: uses
  targetType: Microsoft.Network/privateEndpoints
  targetIdPath: refs_microsoft_network_privateendpoints
actions:
  delete:
    operation: Azure.Microsoft.Web.WebApps_DeleteHostNameBinding
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Web.WebApps_GetHostNameBinding
      itemsPath: $
      identityPath: id
