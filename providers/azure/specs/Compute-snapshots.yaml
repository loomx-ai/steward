schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Compute/snapshots
  class: storage.snapshot
presentation:
  displayNames:
    en-US: Disk snapshot
    zh-CN: 磁盘快照
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: azure-resource-manager
  detail:
    operation: Azure.Microsoft.Compute.Snapshots_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
actions:
  delete:
    operation: Azure.Microsoft.Compute.Snapshots_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Compute.Snapshots_Get
      itemsPath: $
      identityPath: id
