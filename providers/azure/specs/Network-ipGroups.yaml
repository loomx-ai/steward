schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/ipGroups
  class: network.prefix_list
presentation:
  displayNames:
    en-US: IP group
    zh-CN: IP 组
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: Azure.Microsoft.Network.IpGroups_Get
    itemsPath: $
    identityPath: id
  list:
    operation: Azure.Microsoft.Network.IpGroups_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  firewalls:
    path: firewalls
    type: array
  firewallPolicies:
    path: firewallPolicies
    type: array
extensions:
  hook: azure.resource
actions:
  delete:
    operation: Azure.Microsoft.Network.IpGroups_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.IpGroups_Get
      itemsPath: $
      identityPath: id
