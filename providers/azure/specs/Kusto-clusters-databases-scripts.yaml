schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Kusto/clusters/databases/scripts
  class: data.database_script
presentation:
  displayNames:
    en-US: Kusto database script
    zh-CN: Kusto 数据库脚本
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Kusto.Scripts_ListByDatabase
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      clusterName: parent.normalized.arm_parameters.clusterName
      databaseName: parent.normalized.arm_parameters.databaseName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Kusto.Scripts_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Kusto/clusters/databases
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  scriptLevel:
    path: scriptLevel
    type: string
  continueOnErrors:
    path: continueOnErrors
    type: boolean
  principalPermissionsAction:
    path: principalPermissionsAction
    type: string
  managedIdentityResourceId:
    path: managedIdentityResourceId
    type: string
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Kusto/clusters/databases
  targetIdPath: refs_microsoft_kusto_clusters_databases
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
- type: uses
  targetType: Microsoft.Storage/storageAccounts
  targetIdPath: refs_microsoft_storage_storageaccounts
- type: uses
  targetType: Microsoft.DocumentDB/databaseAccounts
  targetIdPath: refs_microsoft_documentdb_databaseaccounts
- type: uses
  targetType: Microsoft.EventHub/namespaces
  targetIdPath: refs_microsoft_eventhub_namespaces
actions:
  delete:
    operation: Azure.Microsoft.Kusto.Scripts_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Kusto.Scripts_Get
      itemsPath: $
      identityPath: id
