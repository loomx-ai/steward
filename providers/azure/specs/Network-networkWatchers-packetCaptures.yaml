- type: depends_on
  targetType: Microsoft.Compute/virtualMachines
  targetIdPath: refs_microsoft_compute_virtualmachines
- type: depends_on
  targetType: Microsoft.Compute/virtualMachineScaleSets
  targetIdPath: refs_microsoft_compute_virtualmachinescalesets
- type: depends_on
  targetType: Microsoft.Storage/storageAccounts
  targetIdPath: refs_microsoft_storage_storageaccounts
actions:
  delete:
    operation: Azure.Microsoft.Network.PacketCaptures_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.PacketCaptures_Get
      itemsPath: $
      identityPath: id
