schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/expressRouteGateways
  class: network.express_connect_router
presentation:
  displayNames:
    en-US: ExpressRoute gateway
    zh-CN: ExpressRoute 网关
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Network.ExpressRouteGateways_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Network.ExpressRouteGateways_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  autoScaleConfiguration:
    path: autoScaleConfiguration
    type: object
  allowNonVirtualWanTraffic:
    path: allowNonVirtualWanTraffic
    type: boolean
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Network/virtualHubs
  targetIdPath: refs_microsoft_network_virtualhubs
actions:
  delete:
    operation: Azure.Microsoft.Network.ExpressRouteGateways_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.ExpressRouteGateways_Get
      itemsPath: $
      identityPath: id
