    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  connectionStatus:
    path: connectionStatus
    type: string
  enableBgp:
    path: enableBgp
    type: boolean
  routingConfiguration:
    path: routingConfiguration
    type: object
extensions:
