schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Web/staticSites
  class: web.static_site
presentation:
  displayNames:
    en-US: Static web app
    zh-CN: 静态 Web 应用
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Web.StaticSites_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Web.StaticSites_GetStaticSite
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships: []
actions:
  delete:
    operation: Azure.Microsoft.Web.StaticSites_DeleteStaticSite
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Web.StaticSites_GetStaticSite
      itemsPath: $
      identityPath: id
