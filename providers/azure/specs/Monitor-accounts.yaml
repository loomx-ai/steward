schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Monitor/accounts
  class: observability.monitoring_environment
presentation:
  displayNames:
    en-US: Azure Monitor workspace
    zh-CN: Azure Monitor 工作区
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Monitor.AzureMonitorWorkspaces_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Monitor.AzureMonitorWorkspaces_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  accountId:
    path: accountId
    type: string
  defaultIngestionSettings:
    path: defaultIngestionSettings
    type: object
  metrics:
    path: metrics
    type: object
  publicNetworkAccess:
    path: publicNetworkAccess
    type: string
  identity:
    path: identity
    type: object
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
- type: depends_on
  targetType: Microsoft.Network/privateEndpoints
  targetIdPath: refs_microsoft_network_privateendpoints
actions:
  delete:
    operation: Azure.Microsoft.Monitor.AzureMonitorWorkspaces_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Monitor.AzureMonitorWorkspaces_Get
      itemsPath: $
      identityPath: id
