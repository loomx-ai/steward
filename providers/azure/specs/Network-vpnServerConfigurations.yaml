schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/vpnServerConfigurations
  class: network.vpn_server
presentation:
  displayNames:
    en-US: Virtual WAN VPN server configuration
    zh-CN: 虚拟 WAN VPN 服务器配置
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Network.VpnServerConfigurations_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Network.VpnServerConfigurations_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  vpnProtocols:
    path: vpnProtocols
    type: array
  vpnAuthenticationTypes:
    path: vpnAuthenticationTypes
    type: array
extensions:
  hook: azure.resource
actions:
  delete:
    operation: Azure.Microsoft.Network.VpnServerConfigurations_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.VpnServerConfigurations_Get
      itemsPath: $
      identityPath: id
