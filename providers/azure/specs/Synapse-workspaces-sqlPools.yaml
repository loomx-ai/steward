    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      workspaceName: parent.normalized.arm_parameters.workspaceName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Synapse.SqlPools_Get
    itemsPath: $
    identityPath: id
  parent:
    source: synapse
    nativeType: Microsoft.Synapse/workspaces
fields:
  name:
    path: name
    type: string
  state:
    path: state
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  status:
    path: status
    type: string
  creationDate:
    path: creationDate
    type: string
  collation:
    path: collation
    type: string
  maxSizeBytes:
    path: maxSizeBytes
    type: number
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Synapse/workspaces
  targetIdPath: refs_microsoft_synapse_workspaces

actions:
  delete:
    operation: Azure.Microsoft.Synapse.SqlPools_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Synapse.SqlPools_Get
      itemsPath: $
      identityPath: id
