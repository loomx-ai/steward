schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Synapse/workspaces/sqlPools
  class: data.database
presentation:
  displayNames:
    en-US: Synapse SQL pool
    zh-CN: Synapse SQL 池
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: synapse
  list:
