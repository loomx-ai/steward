schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Insights/actionGroups
  class: observability.notification_group
presentation:
  displayNames:
    en-US: Action group
    zh-CN: 动作组
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Insights.ActionGroups_ListBySubscriptionId
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Insights.ActionGroups_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  groupShortName:
    path: groupShortName
    type: string
  enabled:
    path: enabled
    type: boolean
  logicAppResourceIds:
    path: refs_microsoft_logic_workflows
    type: array
  automationAccountIds:
    path: refs_microsoft_automation_automationaccounts
    type: array
  automationWebhookIds:
    path: refs_microsoft_automation_automationaccounts_webhooks
    type: array
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Web/sites
  targetIdPath: refs_microsoft_web_sites
actions:
  delete:
    operation: Azure.Microsoft.Insights.ActionGroups_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Insights.ActionGroups_Get
      itemsPath: $
      identityPath: id
