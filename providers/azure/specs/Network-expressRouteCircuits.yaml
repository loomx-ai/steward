schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/expressRouteCircuits
  class: network.physical_connection
presentation:
  displayNames:
    en-US: ExpressRoute circuit
    zh-CN: ExpressRoute 线路
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Network.ExpressRouteCircuits_ListAll
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Network.ExpressRouteCircuits_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  circuitProvisioningState:
    path: circuitProvisioningState
    type: string
  serviceProviderProvisioningState:
    path: serviceProviderProvisioningState
    type: string
  serviceProviderProperties:
    path: serviceProviderProperties
    type: object
  allowClassicOperations:
    path: allowClassicOperations
    type: boolean
extensions:
  hook: azure.resource
relationships: []
actions:
  delete:
    operation: Azure.Microsoft.Network.ExpressRouteCircuits_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.ExpressRouteCircuits_Get
      itemsPath: $
      identityPath: id
