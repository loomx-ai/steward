    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  privateLinkServiceConnectionState:
    path: privateLinkServiceConnectionState
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.DocumentDB/mongoClusters
  targetIdPath: refs_microsoft_documentdb_mongoclusters
- type: uses
  targetType: Microsoft.Network/privateEndpoints
  targetIdPath: refs_microsoft_network_privateendpoints
actions:
  delete:
    operation: Azure.Microsoft.DocumentDB.MongoClusterManagementClient.PrivateEndpointConnections_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.DocumentDB.MongoClusterManagementClient.PrivateEndpointConnections_Get
      itemsPath: $
      identityPath: id
