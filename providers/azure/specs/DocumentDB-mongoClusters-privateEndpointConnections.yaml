schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DocumentDB/mongoClusters/privateEndpointConnections
  class: network.private_endpoint_connection
presentation:
  displayNames:
    en-US: DocumentDB private endpoint connection
    zh-CN: DocumentDB 专用终结点连接
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.DocumentDB.PrivateEndpointConnections_ListByMongoCluster
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      mongoClusterName: parent.normalized.arm_parameters.mongoClusterName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.DocumentDB.MongoClusterManagementClient.PrivateEndpointConnections_Get
    itemsPath: $
    identityPath: id
