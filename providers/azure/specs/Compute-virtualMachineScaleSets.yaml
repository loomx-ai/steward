schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Compute/virtualMachineScaleSets
  class: compute.scale_group
presentation:
  displayNames:
    en-US: Virtual machine scale set
    zh-CN: 虚拟机规模集
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: Azure.Microsoft.Compute.VirtualMachineScaleSets_Get
    itemsPath: $
    identityPath: id
  list:
    operation: Azure.Microsoft.Compute.VirtualMachineScaleSets_ListAll
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  orchestrationMode:
    path: orchestrationMode
    type: string
  uniqueId:
    path: uniqueId
    type: string
  sku:
    path: sku
    type: object
  overprovision:
    path: overprovision
    type: boolean
  upgradePolicy:
    path: upgradePolicy
    type: object
  scaleInPolicy:
    path: scaleInPolicy
    type: object
  automaticRepairsPolicy:
    path: automaticRepairsPolicy
    type: object
  singlePlacementGroup:
    path: singlePlacementGroup
    type: boolean
  virtualMachineProfile:
    path: virtualMachineProfile
    type: object
extensions:
  hook: azure.resource
relationships:
- type: member_of
  targetType: Microsoft.Network/virtualNetworks
  targetIdPath: refs_microsoft_network_virtualnetworks
- type: member_of
  targetType: Microsoft.Network/virtualNetworks/subnets
  targetIdPath: refs_microsoft_network_virtualnetworks_subnets
- type: uses
  targetType: Microsoft.Network/networkSecurityGroups
  targetIdPath: refs_microsoft_network_networksecuritygroups
- type: uses
  targetType: Microsoft.Network/loadBalancers
  targetIdPath: refs_microsoft_network_loadbalancers
- type: uses
  targetType: Microsoft.Network/applicationGateways
  targetIdPath: refs_microsoft_network_applicationgateways
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
- type: depends_on
  targetType: Microsoft.Compute/hostGroups
  targetIdPath: refs_microsoft_compute_hostgroups
- type: depends_on
  targetType: Microsoft.Compute/capacityReservationGroups
  targetIdPath: refs_microsoft_compute_capacityreservationgroups
actions:
  delete:
    operation: Azure.Microsoft.Compute.VirtualMachineScaleSets_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Compute.VirtualMachineScaleSets_Get
      itemsPath: $
      identityPath: id
