schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Sql/servers/databases
  class: database.instance
presentation:
  displayNames:
    en-US: SQL database
    zh-CN: SQL 数据库
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: azure-resource-manager
  detail:
    operation: Azure.Microsoft.Sql.Databases_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  status:
    path: status
    type: string
  maxSizeBytes:
    path: maxSizeBytes
    type: number
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Sql/servers
  targetIdPath: refs_microsoft_sql_servers
- type: uses
  targetType: Microsoft.Sql/servers/elasticPools
  targetIdPath: refs_microsoft_sql_servers_elasticpools
actions:
  delete:
    operation: Azure.Microsoft.Sql.Databases_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Sql.Databases_Get
      itemsPath: $
      identityPath: id
