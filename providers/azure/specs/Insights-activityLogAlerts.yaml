schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Insights/activityLogAlerts
  class: observability.alert_rule
presentation:
  displayNames:
    en-US: Activity log alert
    zh-CN: 活动日志告警
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Insights.ActivityLogAlerts_ListBySubscriptionId
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Insights.ActivityLogAlerts_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  enabled:
    path: enabled
    type: boolean
  scopes:
    path: scopes
    type: array
  description:
    path: description
    type: string
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Insights/actionGroups
  targetIdPath: refs_microsoft_insights_actiongroups
actions:
  delete:
    operation: Azure.Microsoft.Insights.ActivityLogAlerts_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Insights.ActivityLogAlerts_Get
      itemsPath: $
      identityPath: id
