schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DataMigration/services
  class: data.migration_service
presentation:
  displayNames:
    en-US: Database migration service (classic)
    zh-CN: 数据库迁移服务（经典）
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: data-migration
  list:
    operation: Azure.Microsoft.DataMigration.Services_List
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.DataMigration.Services_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: state
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
actions:
  delete:
    operation: Azure.Microsoft.DataMigration.Services_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.DataMigration.Services_Get
      itemsPath: $
      identityPath: id
