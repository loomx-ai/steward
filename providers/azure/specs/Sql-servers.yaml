schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Sql/servers
  class: database.server
presentation:
  displayNames:
    en-US: SQL logical server
    zh-CN: SQL 逻辑服务器
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: Azure.Microsoft.Sql.Servers_Get
    itemsPath: $
    identityPath: id
  list:
    operation: Azure.Microsoft.Sql.Servers_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
