schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Databricks/workspaces
  class: analytics.databricks_workspace
presentation:
  displayNames:
    en-US: Azure Databricks workspace
    zh-CN: Azure Databricks 工作区
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Databricks.Workspaces_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Databricks.Workspaces_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  managedResourceGroupId:
    path: managedResourceGroupId
    type: string
extensions:
  hook: azure.resource
relationships: []
