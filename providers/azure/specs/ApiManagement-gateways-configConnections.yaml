schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.ApiManagement/gateways/configConnections
  class: network.gateway_binding
presentation:
  displayNames:
    en-US: API Management gateway configuration connection
    zh-CN: API 管理网关配置连接
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.ApiManagement.ApiGatewayConfigConnection_ListByGateway
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      gatewayName: parent.normalized.arm_parameters.gatewayName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.ApiManagement.ApiGatewayConfigConnection_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.ApiManagement/gateways
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.ApiManagement/gateways
  targetIdPath: refs_microsoft_apimanagement_gateways
- type: uses
  targetType: Microsoft.ApiManagement/service/workspaces
  targetIdPath: refs_microsoft_apimanagement_service_workspaces
- type: uses
  targetType: Microsoft.ApiManagement/service
  targetIdPath: refs_microsoft_apimanagement_service
actions:
  delete:
    operation: Azure.Microsoft.ApiManagement.ApiGatewayConfigConnection_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.ApiManagement.ApiGatewayConfigConnection_Get
      itemsPath: $
      identityPath: id
    parameters:
      If-Match: resource.normalized.arm_etag
