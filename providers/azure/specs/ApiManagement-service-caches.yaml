schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.ApiManagement/service/caches
  class: data.cache
presentation:
  displayNames:
    en-US: API Management external cache
    zh-CN: API 管理外部缓存
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.ApiManagement.Cache_ListByService
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      serviceName: parent.normalized.arm_parameters.serviceName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.ApiManagement.Cache_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.ApiManagement/service
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Cache/redis
  targetIdPath: refs_microsoft_cache_redis
- type: uses
  targetType: Microsoft.ApiManagement/service
  targetIdPath: refs_microsoft_apimanagement_service
- type: uses
  targetType: Microsoft.Cache/redisEnterprise/databases
  targetIdPath: refs_microsoft_cache_redisenterprise_databases
actions:
  delete:
    operation: Azure.Microsoft.ApiManagement.Cache_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.ApiManagement.Cache_Get
      itemsPath: $
      identityPath: id
    parameters:
      If-Match: resource.normalized.arm_etag
