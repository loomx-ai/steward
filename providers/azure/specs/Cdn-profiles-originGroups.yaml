schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Cdn/profiles/originGroups
  class: network.cdn_origin_group
presentation:
  displayNames:
    en-US: Front Door origin group
    zh-CN: Front Door 源站组
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Cdn.AFDOriginGroups_ListByProfile
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      profileName: parent.normalized.arm_parameters.profileName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Cdn.AFDOriginGroups_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Cdn/profiles
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  healthProbeSettings:
    path: healthProbeSettings
    type: object
  loadBalancingSettings:
    path: loadBalancingSettings
    type: object
  sessionAffinityState:
    path: sessionAffinityState
    type: string
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Cdn/profiles
  targetIdPath: refs_microsoft_cdn_profiles
actions:
  delete:
    operation: Azure.Microsoft.Cdn.AFDOriginGroups_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Cdn.AFDOriginGroups_Get
      itemsPath: $
      identityPath: id
