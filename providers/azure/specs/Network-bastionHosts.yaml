schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/bastionHosts
  class: security.bastion_host
presentation:
  displayNames:
    en-US: Bastion host
    zh-CN: 堡垒主机
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Network.BastionHosts_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Network.BastionHosts_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  dnsName:
    path: dnsName
    type: string
  scaleUnits:
    path: scaleUnits
    type: number
  enableTunneling:
    path: enableTunneling
    type: boolean
  enableIpConnect:
    path: enableIpConnect
    type: boolean
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Network/publicIPAddresses
  targetIdPath: refs_microsoft_network_publicipaddresses
- type: depends_on
  targetType: Microsoft.Network/virtualNetworks/subnets
  targetIdPath: refs_microsoft_network_virtualnetworks_subnets
- type: depends_on
  targetType: Microsoft.Network/virtualNetworks
  targetIdPath: refs_microsoft_network_virtualnetworks
actions:
  delete:
    operation: Azure.Microsoft.Network.BastionHosts_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.BastionHosts_Get
      itemsPath: $
      identityPath: id
