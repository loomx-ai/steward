schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DataFactory/factories/integrationRuntimes/nodes
  class: compute.integration_runtime_node
presentation:
  displayNames:
    en-US: Integration runtime node
    zh-CN: 集成运行时节点
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: data-factory
  list:
    operation: Azure.Microsoft.DataFactory.IntegrationRuntimes_GetStatus
    itemsPath: properties.typeProperties.nodes
    identityPath: nodeName
  detail:
    operation: Azure.Microsoft.DataFactory.IntegrationRuntimeNodes_Get
    itemsPath: $
    identityPath: nodeName
  parent:
    source: data-factory
    nativeType: Microsoft.DataFactory/factories/integrationRuntimes
fields:
  name:
    path: name
    type: string
  state:
    path: state
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.DataFactory/factories/integrationRuntimes
  targetIdPath: _datafactory_parent
actions:
  delete:
    operation: Azure.Microsoft.DataFactory.IntegrationRuntimeNodes_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.DataFactory.IntegrationRuntimeNodes_Get
      itemsPath: $
      identityPath: nodeName
