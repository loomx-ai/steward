schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Dashboard/grafana
  class: observability.visualization
presentation:
  displayNames:
    en-US: Azure Managed Grafana
    zh-CN: Azure 托管 Grafana
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Dashboard.Grafana_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Dashboard.Grafana_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  grafanaVersion:
    path: grafanaVersion
    type: string
  endpoint:
    path: endpoint
    type: string
  publicNetworkAccess:
    path: publicNetworkAccess
    type: string
  zoneRedundancy:
    path: zoneRedundancy
    type: string
  deterministicOutboundIP:
    path: deterministicOutboundIP
    type: string
  outboundIPs:
    path: outboundIPs
    type: array
  grafanaIntegrations:
    path: grafanaIntegrations
    type: object
  grafanaConfigurations:
    path: grafanaConfigurations
    type: object
  grafanaPlugins:
    path: grafanaPlugins
    type: object
  grafanaMajorVersion:
    path: grafanaMajorVersion
    type: string
  sku:
    path: sku
    type: object
  identity:
    path: identity
    type: object
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.OperationalInsights/workspaces
  targetIdPath: refs_microsoft_operationalinsights_workspaces
- type: depends_on
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
- type: depends_on
  targetType: Microsoft.Monitor/accounts
  targetIdPath: refs_microsoft_monitor_accounts
actions:
  delete:
    operation: Azure.Microsoft.Dashboard.Grafana_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Dashboard.Grafana_Get
      itemsPath: $
      identityPath: id
