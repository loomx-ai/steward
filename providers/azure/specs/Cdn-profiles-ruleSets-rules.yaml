schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Cdn/profiles/ruleSets/rules
  class: network.cdn_rule
presentation:
  displayNames:
    en-US: Front Door rule
    zh-CN: Front Door 规则
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Cdn.Rules_ListByRuleSet
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      profileName: parent.normalized.arm_parameters.profileName
      ruleSetName: parent.normalized.arm_parameters.ruleSetName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Cdn.Rules_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Cdn/profiles/ruleSets
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  order:
    path: order
    type: integer
  conditions:
    path: conditions
    type: array
  actions:
    path: actions
    type: array
  matchProcessingBehavior:
    path: matchProcessingBehavior
    type: string
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Cdn/profiles/ruleSets
  targetIdPath: refs_microsoft_cdn_profiles_rulesets
- type: depends_on
  targetType: Microsoft.Cdn/profiles/originGroups
  targetIdPath: refs_microsoft_cdn_profiles_origingroups
actions:
  delete:
    operation: Azure.Microsoft.Cdn.Rules_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Cdn.Rules_Get
      itemsPath: $
      identityPath: id
