schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.ServiceBus/namespaces/topics
  class: messaging.topic
presentation:
  displayNames:
    en-US: Service Bus topic
    zh-CN: Service Bus 主题
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.ServiceBus.Topics_ListByNamespace
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      namespaceName: parent.normalized.arm_parameters.namespaceName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.ServiceBus.Topics_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.ServiceBus/namespaces
fields:
  name:
    path: name
    type: string
  state:
    path: status
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  status:
    path: status
    type: string
  createdAt:
    path: createdAt
    type: string
  subscriptionCount:
    path: subscriptionCount
    type: number
  maxSizeInMegabytes:
    path: maxSizeInMegabytes
    type: number
  defaultMessageTimeToLive:
    path: defaultMessageTimeToLive
    type: string
  enablePartitioning:
    path: enablePartitioning
    type: boolean
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.ServiceBus/namespaces
  targetIdPath: refs_microsoft_servicebus_namespaces
actions:
  delete:
    operation: Azure.Microsoft.ServiceBus.Topics_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.ServiceBus.Topics_Get
      itemsPath: $
      identityPath: id
