schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/privateDnsZones/SRV
  class: dns.record_set
presentation:
  displayNames:
    en-US: Private DNS SRV record set
    zh-CN: 专用 DNS SRV 记录集
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Network.PrivateDnsManagementClient.RecordSets_ListByType
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      privateZoneName: parent.normalized.arm_parameters.privateZoneName
      recordType: SRV
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Network.PrivateDnsManagementClient.RecordSets_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Network/privateDnsZones
fields:
  name:
    path: name
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  ttl:
    path: ttl
    type: number
  fqdn:
    path: fqdn
    type: string
  metadata:
    path: metadata
    type: object
  isAutoRegistered:
    path: isAutoRegistered
    type: boolean
  records:
    path: srvRecords
    type: array
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Network/privateDnsZones
  targetIdPath: refs_microsoft_network_privatednszones
actions:
  delete:
    operation: Azure.Microsoft.Network.PrivateDnsManagementClient.RecordSets_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.PrivateDnsManagementClient.RecordSets_Get
      itemsPath: $
      identityPath: id
    parameters:
      If-Match: resource.normalized.arm_etag
