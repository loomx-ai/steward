schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Insights/components/favorites
  class: observability.visualization
presentation:
  displayNames:
    en-US: Application Insights favorite
    zh-CN: Application Insights 收藏项
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Insights.Favorites_List
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      resourceName: parent.normalized.arm_parameters.resourceName
      canFetchContent: true
    itemsPath: value
    identityPath: FavoriteId
  detail:
    operation: Azure.Microsoft.Insights.Favorites_Get
    itemsPath: $
    identityPath: FavoriteId
  parent:
    source: product-api
    nativeType: Microsoft.Insights/components
fields:
  name:
    path: name
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Insights/components
  targetIdPath: refs_microsoft_insights_components
actions:
  delete:
    operation: Azure.Microsoft.Insights.Favorites_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Insights.Favorites_Get
      itemsPath: $
      identityPath: FavoriteId
