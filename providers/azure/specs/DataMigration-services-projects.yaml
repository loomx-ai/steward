schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DataMigration/services/projects
  class: data.transfer_job
presentation:
  displayNames:
    en-US: Migration project (classic)
    zh-CN: 迁移项目（经典）
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: data-migration
  list:
    operation: Azure.Microsoft.DataMigration.Projects_List
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.DataMigration.Projects_Get
    itemsPath: $
    identityPath: id
  parent:
    source: data-migration
    nativeType: Microsoft.DataMigration/services
fields:
  name:
    path: name
    type: string
  state:
    path: state
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.DataMigration/services
  targetIdPath: _datamigration_parent
actions:
  delete:
    operation: Azure.Microsoft.DataMigration.Projects_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.DataMigration.Projects_Get
      itemsPath: $
      identityPath: id
