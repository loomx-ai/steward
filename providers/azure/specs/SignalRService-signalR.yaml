schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.SignalRService/signalR
  class: messaging.realtime
presentation:
  displayNames:
    en-US: SignalR service
    zh-CN: SignalR 服务
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.SignalRService.SignalR_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.SignalRService.SignalR_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships: []
actions:
  delete:
    operation: Azure.Microsoft.SignalRService.SignalR_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.SignalRService.SignalR_Get
      itemsPath: $
      identityPath: id
