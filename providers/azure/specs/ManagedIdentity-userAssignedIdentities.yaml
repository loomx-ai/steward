schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.ManagedIdentity/userAssignedIdentities
  class: security.identity
presentation:
  displayNames:
    en-US: User-assigned managed identity
    zh-CN: 用户分配的托管标识
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: Azure.Microsoft.ManagedIdentity.UserAssignedIdentities_Get
    itemsPath: $
    identityPath: id
  list:
    operation: Azure.Microsoft.ManagedIdentity.UserAssignedIdentities_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
actions:
  delete:
    operation: Azure.Microsoft.ManagedIdentity.UserAssignedIdentities_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.ManagedIdentity.UserAssignedIdentities_Get
      itemsPath: $
      identityPath: id
