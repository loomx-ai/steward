schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DocumentDB/fleets/fleetspaces
  class: data.fleetspace
presentation:
  displayNames:
    en-US: Cosmos DB fleetspace
    zh-CN: Cosmos DB 舰队空间
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.DocumentDB.Fleetspace_List
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      fleetName: parent.normalized.arm_parameters.fleetName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.DocumentDB.Fleetspace_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.DocumentDB/fleets
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.DocumentDB/fleets
  targetIdPath: refs_microsoft_documentdb_fleets
actions:
  delete:
    operation: Azure.Microsoft.DocumentDB.Fleetspace_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.DocumentDB.Fleetspace_Get
      itemsPath: $
      identityPath: id
