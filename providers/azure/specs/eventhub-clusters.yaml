schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.EventHub/clusters
  class: messaging.cluster
presentation:
  displayNames:
    en-US: Event Hubs dedicated cluster
    zh-CN: Event Hubs 专用集群
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.EventHub.Clusters_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.EventHub.Clusters_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  sku:
    path: sku
    type: object
  createdAt:
    path: createdAt
    type: string
  updatedAt:
    path: updatedAt
    type: string
  metricId:
    path: metricId
    type: string
  status:
    path: status
    type: string
  supportsScaling:
    path: supportsScaling
    type: boolean
  quotaSettings:
    path: quotaSettings
    type: object
extensions:
  hook: azure.resource
actions:
  delete:
    operation: Azure.Microsoft.EventHub.Clusters_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.EventHub.Clusters_Get
      itemsPath: $
      identityPath: id
