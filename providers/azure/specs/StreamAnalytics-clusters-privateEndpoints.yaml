schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.StreamAnalytics/clusters/privateEndpoints
  class: network.managed_private_endpoint
presentation:
  displayNames:
    en-US: Stream Analytics private endpoint
    zh-CN: 流分析专用终结点
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.StreamAnalytics.PrivateEndpoints_ListByCluster
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      clusterName: parent.normalized.arm_parameters.clusterName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.StreamAnalytics.PrivateEndpoints_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.StreamAnalytics/clusters
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.StreamAnalytics/clusters
  targetIdPath: refs_microsoft_streamanalytics_clusters
- type: uses
  targetType: Microsoft.Storage/storageAccounts
  targetIdPath: refs_microsoft_storage_storageaccounts
- type: uses
  targetType: Microsoft.EventHub/namespaces
  targetIdPath: refs_microsoft_eventhub_namespaces
- type: uses
  targetType: Microsoft.Sql/servers
  targetIdPath: refs_microsoft_sql_servers
- type: uses
  targetType: Microsoft.DocumentDB/databaseAccounts
  targetIdPath: refs_microsoft_documentdb_databaseaccounts
- type: uses
  targetType: Microsoft.Network/privateLinkServices
  targetIdPath: refs_microsoft_network_privatelinkservices
actions:
  delete:
    operation: Azure.Microsoft.StreamAnalytics.PrivateEndpoints_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.StreamAnalytics.PrivateEndpoints_Get
      itemsPath: $
      identityPath: id
