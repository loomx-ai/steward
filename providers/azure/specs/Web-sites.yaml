schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Web/sites
  class: compute.service
presentation:
  displayNames:
    en-US: App Service or Function App
    zh-CN: App Service 或 Function App
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: azure-resource-manager
  detail:
    operation: Azure.Microsoft.Web.WebApps_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Web/serverfarms
  targetIdPath: refs_microsoft_web_serverfarms
- type: member_of
  targetType: Microsoft.Network/virtualNetworks
  targetIdPath: refs_microsoft_network_virtualnetworks
- type: member_of
  targetType: Microsoft.Network/virtualNetworks/subnets
  targetIdPath: refs_microsoft_network_virtualnetworks_subnets
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
actions:
  delete:
    operation: Azure.Microsoft.Web.WebApps_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Web.WebApps_Get
      itemsPath: $
      identityPath: id
