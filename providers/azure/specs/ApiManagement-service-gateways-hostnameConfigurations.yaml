schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.ApiManagement/service/gateways/hostnameConfigurations
  class: network.domain_binding
presentation:
  displayNames:
    en-US: API Management gateway hostname
    zh-CN: API 管理网关主机名配置
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.ApiManagement.GatewayHostnameConfiguration_ListByService
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      serviceName: parent.normalized.arm_parameters.serviceName
      gatewayId: parent.normalized.arm_parameters.gatewayId
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.ApiManagement.GatewayHostnameConfiguration_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.ApiManagement/service/gateways
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.ApiManagement/service/gateways
  targetIdPath: refs_microsoft_apimanagement_service_gateways
- type: uses
  targetType: Microsoft.ApiManagement/service/certificates
  targetIdPath: refs_microsoft_apimanagement_service_certificates
actions:
  delete:
    operation: Azure.Microsoft.ApiManagement.GatewayHostnameConfiguration_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.ApiManagement.GatewayHostnameConfiguration_Get
      itemsPath: $
      identityPath: id
    parameters:
      If-Match: resource.normalized.arm_etag
