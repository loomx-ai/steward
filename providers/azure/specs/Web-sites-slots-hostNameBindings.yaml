    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  sslState:
    path: sslState
    type: string
  thumbprint:
    path: thumbprint
    type: string
  hostNameType:
    path: hostNameType
    type: string
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Web/sites/slots
  targetIdPath: refs_microsoft_web_sites_slots
- type: uses
  targetType: Microsoft.Network/privateEndpoints
  targetIdPath: refs_microsoft_network_privateendpoints
actions:
