    operation: Azure.Microsoft.Web.WebApps_DeleteHostNameBindingSlot
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Web.WebApps_GetHostNameBindingSlot
      itemsPath: $
      identityPath: id
