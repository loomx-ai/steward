schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/dnsForwardingRulesets
  class: network.dns_forwarding_ruleset
presentation:
  displayNames:
    en-US: DNS forwarding ruleset
    zh-CN: DNS 转发规则集
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Network.DnsForwardingRulesets_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Network.DnsForwardingRulesets_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Network/dnsResolvers/outboundEndpoints
  targetIdPath: refs_microsoft_network_dnsresolvers_outboundendpoints
actions:
  delete:
    operation: Azure.Microsoft.Network.DnsForwardingRulesets_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.DnsForwardingRulesets_Get
      itemsPath: $
      identityPath: id
