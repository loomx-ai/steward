schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/virtualNetworks/subnets
  class: network.subnet
presentation:
  displayNames:
    en-US: Virtual network subnet
    zh-CN: 虚拟网络子网
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: Azure.Microsoft.Network.Subnets_Get
    itemsPath: $
    identityPath: id
  list:
    operation: Azure.Microsoft.Network.Subnets_List
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.resource_group
      virtualNetworkName: parent.normalized.name
    itemsPath: value
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Network/virtualNetworks
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  addressPrefix:
    path: addressPrefix
    type: string
  addressPrefixes:
    path: addressPrefixes
    type: array
extensions:
  hook: azure.resource
relationships:
- type: member_of
  targetType: Microsoft.Network/virtualNetworks
  targetIdPath: refs_microsoft_network_virtualnetworks
- type: uses
  targetType: Microsoft.Network/networkSecurityGroups
  targetIdPath: refs_microsoft_network_networksecuritygroups
- type: uses
  targetType: Microsoft.Network/routeTables
  targetIdPath: refs_microsoft_network_routetables
- type: uses
  targetType: Microsoft.Network/natGateways
  targetIdPath: refs_microsoft_network_natgateways
actions:
  delete:
    operation: Azure.Microsoft.Network.Subnets_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.Subnets_Get
      itemsPath: $
      identityPath: id
