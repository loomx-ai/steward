schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Compute/hostGroups
  class: compute.host_group
presentation:
  displayNames:
    en-US: Dedicated host group
    zh-CN: 专用主机组
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Compute.DedicatedHostGroups_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Compute.DedicatedHostGroups_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  platformFaultDomainCount:
    path: platformFaultDomainCount
    type: number
  supportAutomaticPlacement:
    path: supportAutomaticPlacement
    type: boolean
extensions:
  hook: azure.resource
relationships: []
actions:
  delete:
    operation: Azure.Microsoft.Compute.DedicatedHostGroups_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Compute.DedicatedHostGroups_Get
      itemsPath: $
      identityPath: id
