schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers
  class: data.container
presentation:
  displayNames:
    en-US: Cosmos DB NoSQL container
    zh-CN: Cosmos DB NoSQL 容器
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.DocumentDB.SqlResources_ListSqlContainers
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      accountName: parent.normalized.arm_parameters.accountName
      databaseName: parent.normalized.arm_parameters.databaseName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.DocumentDB.SqlResources_GetSqlContainer
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.DocumentDB/databaseAccounts/sqlDatabases
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.DocumentDB/databaseAccounts/sqlDatabases
  targetIdPath: refs_microsoft_documentdb_databaseaccounts_sqldatabases
- type: uses
  targetType: Microsoft.DocumentDB/databaseAccounts/sqlDatabases/clientEncryptionKeys
  targetIdPath: refs_microsoft_documentdb_databaseaccounts_sqldatabases_clientencryptionkeys
actions:
  delete:
    operation: Azure.Microsoft.DocumentDB.SqlResources_DeleteSqlContainer
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.DocumentDB.SqlResources_GetSqlContainer
      itemsPath: $
      identityPath: id
