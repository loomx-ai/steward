schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Insights/privateLinkScopes/scopedResources
  class: observability.resource_association
presentation:
  displayNames:
    en-US: Azure Monitor scoped resource
    zh-CN: Azure Monitor 范围资源关联
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Insights.PrivateLinkScopedResources_ListByPrivateLinkScope
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      scopeName: parent.normalized.arm_parameters.scopeName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Insights.PrivateLinkScopedResources_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Insights/privateLinkScopes
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  linkedResourceId:
    path: linkedResourceId
    type: string
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Insights/privateLinkScopes
  targetIdPath: refs_microsoft_insights_privatelinkscopes
- type: depends_on
  targetType: Microsoft.OperationalInsights/workspaces
  targetIdPath: refs_microsoft_operationalinsights_workspaces
- type: depends_on
  targetType: Microsoft.Insights/dataCollectionEndpoints
  targetIdPath: refs_microsoft_insights_datacollectionendpoints
actions:
  delete:
    operation: Azure.Microsoft.Insights.PrivateLinkScopedResources_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Insights.PrivateLinkScopedResources_Get
      itemsPath: $
      identityPath: id
