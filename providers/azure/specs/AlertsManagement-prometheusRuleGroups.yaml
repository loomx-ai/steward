schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.AlertsManagement/prometheusRuleGroups
  class: observability.alert_rule
presentation:
  displayNames:
    en-US: Prometheus rule group
    zh-CN: Prometheus 规则组
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.AlertsManagement.PrometheusRuleGroups_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.AlertsManagement.PrometheusRuleGroups_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  enabled:
    path: enabled
    type: boolean
  interval:
    path: interval
    type: string
  clusterName:
    path: clusterName
    type: string
  scopes:
    path: scopes
    type: array
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Insights/actionGroups
  targetIdPath: refs_microsoft_insights_actiongroups
actions:
  delete:
    operation: Azure.Microsoft.AlertsManagement.PrometheusRuleGroups_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.AlertsManagement.PrometheusRuleGroups_Get
      itemsPath: $
      identityPath: id
