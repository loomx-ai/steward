    operation: Azure.Microsoft.Cdn.SecurityPolicies_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Cdn.SecurityPolicies_Get
      itemsPath: $
      identityPath: id
