relationships:
- type: depends_on
  targetType: Microsoft.Network/frontDoorWebApplicationFirewallPolicies
  targetIdPath: refs_microsoft_network_frontdoorwebapplicationfirewallpolicies
- type: depends_on
  targetType: Microsoft.Cdn/profiles
  targetIdPath: refs_microsoft_cdn_profiles
- type: depends_on
  targetType: Microsoft.Cdn/profiles/customDomains
  targetIdPath: refs_microsoft_cdn_profiles_customdomains
- type: depends_on
  targetType: Microsoft.Cdn/profiles/afdEndpoints
  targetIdPath: refs_microsoft_cdn_profiles_afdendpoints
actions:
