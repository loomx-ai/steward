schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Batch/batchAccounts/pools
  class: compute.batch_pool
presentation:
  displayNames:
    en-US: Batch pool
    zh-CN: 批处理池
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Batch.Pool_ListByBatchAccount
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      accountName: parent.normalized.arm_parameters.accountName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Batch.Pool_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Batch/batchAccounts
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  vmSize:
    path: vmSize
    type: string
  allocationState:
    path: allocationState
    type: string
  applicationPackages:
    path: applicationPackages
    type: array
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Storage/storageAccounts/blobServices/containers
  targetIdPath: refs_microsoft_storage_storageaccounts_blobservices_containers
- type: uses
  targetType: Microsoft.Storage/storageAccounts/fileServices/shares
  targetIdPath: refs_microsoft_storage_storageaccounts_fileservices_shares
- type: uses
  targetType: Microsoft.Batch/batchAccounts
  targetIdPath: refs_microsoft_batch_batchaccounts
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
- type: uses
  targetType: Microsoft.Storage/storageAccounts
  targetIdPath: refs_microsoft_storage_storageaccounts
- type: uses
  targetType: Microsoft.KeyVault/vaults
  targetIdPath: refs_microsoft_keyvault_vaults
- type: uses
  targetType: Microsoft.Network/virtualNetworks/subnets
  targetIdPath: refs_microsoft_network_virtualnetworks_subnets
- type: uses
  targetType: Microsoft.Network/publicIPAddresses
  targetIdPath: refs_microsoft_network_publicipaddresses
- type: uses
  targetType: Microsoft.Batch/batchAccounts/applications
  targetIdPath: refs_microsoft_batch_batchaccounts_applications
- type: uses
  targetType: Microsoft.Batch/batchAccounts/applications/versions
  targetIdPath: refs_microsoft_batch_batchaccounts_applications_versions
- type: uses
  targetType: Microsoft.Compute/images
  targetIdPath: refs_microsoft_compute_images
actions:
  delete:
    operation: Azure.Microsoft.Batch.Pool_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Batch.Pool_Get
      itemsPath: $
      identityPath: id
