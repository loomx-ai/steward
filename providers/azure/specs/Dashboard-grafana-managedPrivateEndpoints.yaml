schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Dashboard/grafana/managedPrivateEndpoints
  class: network.managed_private_endpoint
presentation:
  displayNames:
    en-US: Grafana managed private endpoint
    zh-CN: Grafana 托管专用终结点
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Dashboard.ManagedPrivateEndpoints_List
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      workspaceName: parent.normalized.arm_parameters.workspaceName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Dashboard.ManagedPrivateEndpoints_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Dashboard/grafana
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  privateLinkResourceId:
    path: privateLinkResourceId
    type: string
  privateLinkResourceRegion:
    path: privateLinkResourceRegion
    type: string
  groupIds:
    path: groupIds
    type: array
  connectionState:
    path: connectionState
    type: object
  privateLinkServiceUrl:
    path: privateLinkServiceUrl
    type: string
  privateLinkServicePrivateIP:
    path: privateLinkServicePrivateIP
    type: string
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Dashboard/grafana
  targetIdPath: refs_microsoft_dashboard_grafana
- type: depends_on
  targetType: Microsoft.Network/privateLinkServices
  targetIdPath: refs_microsoft_network_privatelinkservices
- type: depends_on
  targetType: Microsoft.Storage/storageAccounts
  targetIdPath: refs_microsoft_storage_storageaccounts
- type: depends_on
  targetType: Microsoft.Sql/servers
  targetIdPath: refs_microsoft_sql_servers
- type: depends_on
  targetType: Microsoft.OperationalInsights/workspaces
  targetIdPath: refs_microsoft_operationalinsights_workspaces
actions:
  delete:
    operation: Azure.Microsoft.Dashboard.ManagedPrivateEndpoints_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Dashboard.ManagedPrivateEndpoints_Get
      itemsPath: $
      identityPath: id
