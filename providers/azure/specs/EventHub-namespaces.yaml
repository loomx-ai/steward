schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.EventHub/namespaces
  class: messaging.namespace
presentation:
  displayNames:
    en-US: Event Hubs namespace
    zh-CN: Event Hubs 命名空间
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.EventHub.Namespaces_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.EventHub.Namespaces_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  sku:
    path: sku
    type: object
  createdAt:
    path: createdAt
    type: string
  metricId:
    path: metricId
    type: string
  serviceBusEndpoint:
    path: serviceBusEndpoint
    type: string
  minimumTlsVersion:
    path: minimumTlsVersion
    type: string
  disableLocalAuth:
    path: disableLocalAuth
    type: boolean
  publicNetworkAccess:
    path: publicNetworkAccess
    type: string
  zoneRedundant:
    path: zoneRedundant
    type: boolean
  encryption:
    path: encryption
    type: object
  clusterArmId:
    path: clusterArmId
    type: string
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.EventHub/clusters
  targetIdPath: refs_microsoft_eventhub_clusters
- type: depends_on
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
actions:
  delete:
    operation: Azure.Microsoft.EventHub.Namespaces_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.EventHub.Namespaces_Get
      itemsPath: $
      identityPath: id
