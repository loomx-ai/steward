schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Kusto/clusters
  class: data.database_cluster
presentation:
  displayNames:
    en-US: Data Explorer cluster
    zh-CN: 数据资源管理器集群
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Kusto.Clusters_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Kusto.Clusters_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: state
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  publicNetworkAccess:
    path: publicNetworkAccess
    type: string
  virtualNetworkConfiguration:
    path: virtualNetworkConfiguration
    type: object
  engineType:
    path: engineType
    type: string
  languageExtensions:
    path: languageExtensions
    type: object
  migrationCluster:
    path: migrationCluster
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Kusto/clusters
  targetIdPath: refs_microsoft_kusto_clusters
- type: uses
  targetType: Microsoft.Kusto/clusters/sandboxCustomImages
  targetIdPath: refs_microsoft_kusto_clusters_sandboxcustomimages
- type: uses
  targetType: Microsoft.Network/virtualNetworks/subnets
  targetIdPath: refs_microsoft_network_virtualnetworks_subnets
- type: uses
  targetType: Microsoft.Network/virtualNetworks
  targetIdPath: refs_microsoft_network_virtualnetworks
- type: uses
  targetType: Microsoft.Network/publicIPAddresses
  targetIdPath: refs_microsoft_network_publicipaddresses
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
actions:
  delete:
    operation: Azure.Microsoft.Kusto.Clusters_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Kusto.Clusters_Get
      itemsPath: $
      identityPath: id
