schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.CognitiveServices/accounts
  class: data.ai_account
presentation:
  displayNames:
    en-US: Foundry account
    zh-CN: Foundry 账号
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.CognitiveServices.Accounts_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.CognitiveServices.Accounts_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  kind:
    path: kind
    type: string
  sku:
    path: sku
    type: object
  endpoint:
    path: endpoint
    type: string
  customSubDomainName:
    path: customSubDomainName
    type: string
  publicNetworkAccess:
    path: publicNetworkAccess
    type: string
  allowProjectManagement:
    path: allowProjectManagement
    type: boolean
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
- type: uses
  targetType: Microsoft.Storage/storageAccounts
  targetIdPath: refs_microsoft_storage_storageaccounts
- type: uses
  targetType: Microsoft.Network/virtualNetworks/subnets
  targetIdPath: refs_microsoft_network_virtualnetworks_subnets
- type: uses
  targetType: Microsoft.CognitiveServices/commitmentPlans
  targetIdPath: refs_microsoft_cognitiveservices_commitmentplans
actions:
  delete:
    operation: Azure.Microsoft.CognitiveServices.Accounts_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.CognitiveServices.Accounts_Get
      itemsPath: $
      identityPath: id
