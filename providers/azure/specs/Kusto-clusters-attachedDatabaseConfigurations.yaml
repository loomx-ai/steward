schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Kusto/clusters/attachedDatabaseConfigurations
  class: data.database_attachment
presentation:
  displayNames:
    en-US: Kusto attached database configuration
    zh-CN: Kusto 数据库附加配置
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Kusto.AttachedDatabaseConfigurations_ListByCluster
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      clusterName: parent.normalized.arm_parameters.clusterName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Kusto.AttachedDatabaseConfigurations_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Kusto/clusters
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  clusterResourceId:
    path: clusterResourceId
    type: string
  databaseName:
    path: databaseName
    type: string
  databaseNamePrefix:
    path: databaseNamePrefix
    type: string
  databaseNameOverride:
    path: databaseNameOverride
    type: string
  attachedDatabaseNames:
    path: attachedDatabaseNames
    type: array
  defaultPrincipalsModificationKind:
    path: defaultPrincipalsModificationKind
    type: string
  tableLevelSharingProperties:
    path: tableLevelSharingProperties
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Kusto/clusters
  targetIdPath: refs_microsoft_kusto_clusters
- type: uses
  targetType: Microsoft.Kusto/clusters/databases
  targetIdPath: refs_microsoft_kusto_clusters_databases
actions:
  delete:
    operation: Azure.Microsoft.Kusto.AttachedDatabaseConfigurations_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Kusto.AttachedDatabaseConfigurations_Get
      itemsPath: $
      identityPath: id
