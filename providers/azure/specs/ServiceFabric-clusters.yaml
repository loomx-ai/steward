schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.ServiceFabric/clusters
  class: middleware.registry
presentation:
  displayNames:
    en-US: Service Fabric cluster
    zh-CN: Service Fabric 群集
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: Azure.Microsoft.ServiceFabric.Clusters_Get
    itemsPath: $
    identityPath: id
  list:
    operation: Azure.Microsoft.ServiceFabric.Clusters_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships: []
actions:
  delete:
    operation: Azure.Microsoft.ServiceFabric.Clusters_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.ServiceFabric.Clusters_Get
      itemsPath: $
      identityPath: id
