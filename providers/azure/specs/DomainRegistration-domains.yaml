schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DomainRegistration/domains
  class: dns.registered_domain
presentation:
  displayNames:
    en-US: Registered domain
    zh-CN: 注册域名
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.DomainRegistration.Domains_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.DomainRegistration.Domains_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  registrationStatus:
    path: registrationStatus
    type: string
  createdTime:
    path: createdTime
    type: string
  expirationTime:
    path: expirationTime
    type: string
  autoRenew:
    path: autoRenew
    type: boolean
  privacy:
    path: privacy
    type: boolean
  dnsType:
    path: dnsType
    type: string
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Network/dnsZones
  targetIdPath: _domain_dns_zone
actions:
  delete:
    operation: Azure.Microsoft.DomainRegistration.Domains_Delete
    parameters:
      forceHardDeleteDomain: false
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.DomainRegistration.Domains_Get
      itemsPath: $
      identityPath: id
