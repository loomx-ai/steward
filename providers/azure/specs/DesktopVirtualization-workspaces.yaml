schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DesktopVirtualization/workspaces
  class: compute.virtual_desktop_workspace
presentation:
  displayNames:
    en-US: Azure Virtual Desktop workspace
    zh-CN: Azure 虚拟桌面工作区
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.DesktopVirtualization.Workspaces_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.DesktopVirtualization.Workspaces_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.DesktopVirtualization/applicationGroups
  targetIdPath: refs_microsoft_desktopvirtualization_applicationgroups
actions:
  delete:
    operation: Azure.Microsoft.DesktopVirtualization.Workspaces_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.DesktopVirtualization.Workspaces_Get
      itemsPath: $
      identityPath: id
