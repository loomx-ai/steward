schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Insights/webtests
  class: observability.availability_test
presentation:
  displayNames:
    en-US: Availability test
    zh-CN: 可用性测试
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Insights.WebTests_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Insights.WebTests_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  Name:
    path: Name
    type: string
  Kind:
    path: Kind
    type: string
  Enabled:
    path: Enabled
    type: boolean
  Frequency:
    path: Frequency
    type: number
  Timeout:
    path: Timeout
    type: number
  RetryEnabled:
    path: RetryEnabled
    type: boolean
  Locations:
    path: Locations
    type: array
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Insights/components
  targetIdPath: refs_microsoft_insights_components
actions:
  delete:
    operation: Azure.Microsoft.Insights.WebTests_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Insights.WebTests_Get
      itemsPath: $
      identityPath: id
