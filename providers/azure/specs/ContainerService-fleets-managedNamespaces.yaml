schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.ContainerService/fleets/managedNamespaces
  class: container.namespace
presentation:
  displayNames:
    en-US: Fleet managed namespace
    zh-CN: Fleet 托管命名空间
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: kubernetes-fleet
  list:
    operation: Azure.Microsoft.ContainerService.FleetManagedNamespaces_ListByFleet
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      fleetName: parent.normalized.arm_parameters.fleetName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.ContainerService.FleetManagedNamespaces_Get
    itemsPath: $
    identityPath: id
  parent:
    source: kubernetes-fleet
    nativeType: Microsoft.ContainerService/fleets
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  deletePolicy:
    path: deletePolicy
    type: string
  adoptionPolicy:
    path: adoptionPolicy
    type: string
  placementDynamic:
    path: placement_dynamic
    type: boolean
  placementMemberNames:
    path: placement_member_names
    type: array
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.ContainerService/fleets
  targetIdPath: refs_microsoft_containerservice_fleets
- type: uses
  targetType: Microsoft.ContainerService/fleets/members
  targetIdPath: refs_microsoft_containerservice_fleets_members
