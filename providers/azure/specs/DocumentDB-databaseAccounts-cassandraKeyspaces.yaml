schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DocumentDB/databaseAccounts/cassandraKeyspaces
  class: data.keyspace
presentation:
  displayNames:
    en-US: Cosmos DB Cassandra keyspace
    zh-CN: Cosmos DB Cassandra 键空间
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.DocumentDB.CassandraResources_ListCassandraKeyspaces
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      accountName: parent.normalized.arm_parameters.accountName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.DocumentDB.CassandraResources_GetCassandraKeyspace
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.DocumentDB/databaseAccounts
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.DocumentDB/databaseAccounts
  targetIdPath: refs_microsoft_documentdb_databaseaccounts
actions:
  delete:
    operation: Azure.Microsoft.DocumentDB.CassandraResources_DeleteCassandraKeyspace
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.DocumentDB.CassandraResources_GetCassandraKeyspace
      itemsPath: $
      identityPath: id
