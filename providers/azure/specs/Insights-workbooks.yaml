schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Insights/workbooks
  class: observability.workbook
presentation:
  displayNames:
    en-US: Workbook
    zh-CN: 工作簿
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: application-insights-workbooks
  list:
    operation: Azure.Microsoft.Insights.Workbooks_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
      category: workbook
      canFetchContent: true
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Insights.Workbooks_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  displayName:
    path: displayName
    type: string
  category:
    path: category
    type: string
  sourceId:
    path: sourceId
    type: string
  storageUri:
    path: storageUri
    type: string
  version:
    path: version
    type: string
  revision:
    path: revision
    type: string
  timeModified:
    path: timeModified
    type: string
  userId:
    path: userId
    type: string
  revisions:
    path: revisions
    type: array
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Storage/storageAccounts
  targetIdPath: refs_microsoft_storage_storageaccounts
- type: uses
  targetType: Microsoft.Storage/storageAccounts/blobServices/containers
  targetIdPath: refs_microsoft_storage_storageaccounts_blobservices_containers
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
- type: uses
  targetType: Microsoft.Insights/components
  targetIdPath: refs_microsoft_insights_components
- type: uses
  targetType: Microsoft.OperationalInsights/workspaces
  targetIdPath: refs_microsoft_operationalinsights_workspaces
actions:
  delete:
    operation: Azure.Microsoft.Insights.Workbooks_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Insights.Workbooks_Get
      itemsPath: $
      identityPath: id
