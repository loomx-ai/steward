schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/firewallPolicies
  class: security.firewall
presentation:
  displayNames:
    en-US: Firewall policy
    zh-CN: 防火墙策略
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Network.FirewallPolicies_ListAll
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Network.FirewallPolicies_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  sku:
    path: sku
    type: object
  threatIntelMode:
    path: threatIntelMode
    type: string
  dnsSettings:
    path: dnsSettings
    type: object
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Network/firewallPolicies
  targetIdPath: refs_microsoft_network_firewallpolicies
actions:
  delete:
    operation: Azure.Microsoft.Network.FirewallPolicies_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.FirewallPolicies_Get
      itemsPath: $
      identityPath: id
