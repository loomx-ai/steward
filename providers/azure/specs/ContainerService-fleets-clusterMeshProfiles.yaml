schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.ContainerService/fleets/clusterMeshProfiles
  class: container.cluster_mesh
presentation:
  displayNames:
    en-US: Fleet cross-cluster network
    zh-CN: Fleet 跨集群网络
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: kubernetes-fleet
  list:
    operation: Azure.Microsoft.ContainerService.ClusterMeshProfiles_ListByFleet
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      fleetName: parent.normalized.arm_parameters.fleetName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.ContainerService.ClusterMeshProfiles_Get
    itemsPath: $
    identityPath: id
  parent:
    source: kubernetes-fleet
    nativeType: Microsoft.ContainerService/fleets
fields:
  name:
    path: name
    type: string
  state:
    path: mesh_state
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  memberCount:
    path: mesh_member_count
    type: integer
extensions:
  hook: azure.resource
actions:
  delete:
    operation: Azure.Microsoft.ContainerService.ClusterMeshProfiles_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.ContainerService.ClusterMeshProfiles_Get
      itemsPath: $
      identityPath: id
relationships:
- type: uses
  targetType: Microsoft.ContainerService/fleets
  targetIdPath: refs_microsoft_containerservice_fleets
