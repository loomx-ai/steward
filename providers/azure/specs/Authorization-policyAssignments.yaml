schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Authorization/policyAssignments
  class: governance.policy_assignment
presentation:
  displayNames:
    en-US: Azure Policy assignment
    zh-CN: Azure Policy 分配
  consoleLinkTemplate: https://portal.azure.com/#view/Microsoft_Azure_Policy/EditAssignmentBlade/id/{nativeId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Authorization.PolicyAssignments_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Authorization.PolicyAssignments_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  displayName:
    path: displayName
    type: string
  policyDefinitionId:
    path: policyDefinitionId
    type: string
  scope:
    path: scope
    type: string
  enforcementMode:
    path: enforcementMode
    type: string
  assignmentType:
    path: assignmentType
    type: string
  initiative:
    path: initiative
    type: boolean
extensions:
  hook: azure.resource
actions:
  delete:
    operation: Azure.Microsoft.Authorization.PolicyAssignments_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Authorization.PolicyAssignments_Get
      itemsPath: $
      identityPath: id
