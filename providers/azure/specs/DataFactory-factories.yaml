schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DataFactory/factories
  class: data.pipeline
presentation:
  displayNames:
    en-US: Data Factory
    zh-CN: 数据工厂
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: data-factory
  list:
    operation: Azure.Microsoft.DataFactory.Factories_List
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.DataFactory.Factories_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: state
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
actions:
  delete:
    operation: Azure.Microsoft.DataFactory.Factories_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.DataFactory.Factories_Get
      itemsPath: $
      identityPath: id
