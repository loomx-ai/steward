schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/privateEndpoints
  class: network.endpoint
presentation:
  displayNames:
    en-US: Private endpoint
    zh-CN: 专用终结点
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: Azure.Microsoft.Network.PrivateEndpoints_Get
    itemsPath: $
    identityPath: id
  list:
    operation: Azure.Microsoft.Network.PrivateEndpoints_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  networkInterfaces:
    path: networkInterfaces
    type: array
  privateLinkServiceConnections:
    path: privateLinkServiceConnections
    type: array
  manualPrivateLinkServiceConnections:
    path: manualPrivateLinkServiceConnections
    type: array
  customDnsConfigs:
    path: customDnsConfigs
    type: array
  ipConfigurations:
    path: ipConfigurations
    type: array
  customNetworkInterfaceName:
    path: customNetworkInterfaceName
    type: string
extensions:
  hook: azure.resource
relationships:
- type: member_of
  targetType: Microsoft.Network/virtualNetworks
  targetIdPath: refs_microsoft_network_virtualnetworks
- type: member_of
  targetType: Microsoft.Network/virtualNetworks/subnets
  targetIdPath: refs_microsoft_network_virtualnetworks_subnets
actions:
  delete:
    operation: Azure.Microsoft.Network.PrivateEndpoints_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.PrivateEndpoints_Get
      itemsPath: $
      identityPath: id
