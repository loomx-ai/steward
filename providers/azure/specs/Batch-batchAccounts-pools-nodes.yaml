schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Batch/batchAccounts/pools/nodes
  class: compute.batch_node
presentation:
  displayNames:
    en-US: Batch compute node
    zh-CN: 批处理计算节点
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Batch.DataPlane.Nodes_ListNodes
    parameters:
      endpoint: parent.normalized._batch_endpoint
      poolId: parent.normalized._batch_parameters.poolId
    itemsPath: value
    identityPath: url
  detail:
    operation: Azure.Microsoft.Batch.DataPlane.Nodes_GetNode
    itemsPath: $
    identityPath: url
  parent:
    source: product-api
    nativeType: Microsoft.Batch/batchAccounts/pools
fields:
  name:
    path: name
    type: string
  state:
    path: state
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  poolInfo:
    path: poolInfo
    type: object
  jobSchedule:
    path: jobSchedule
    type: object
  dependsOn:
    path: dependsOn
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Storage/storageAccounts/blobServices/containers
  targetIdPath: refs_microsoft_storage_storageaccounts_blobservices_containers
- type: uses
  targetType: Microsoft.Storage/storageAccounts/fileServices/shares
  targetIdPath: refs_microsoft_storage_storageaccounts_fileservices_shares
- type: uses
  targetType: Microsoft.Batch/batchAccounts/pools
  targetIdPath: refs_microsoft_batch_batchaccounts_pools
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
- type: uses
  targetType: Microsoft.Storage/storageAccounts
  targetIdPath: refs_microsoft_storage_storageaccounts
- type: uses
  targetType: Microsoft.KeyVault/vaults
  targetIdPath: refs_microsoft_keyvault_vaults
actions:
  delete:
    operation: Azure.Microsoft.Batch.DataPlane.Pools_RemoveNodes
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Batch.DataPlane.Nodes_GetNode
      itemsPath: $
      identityPath: url
