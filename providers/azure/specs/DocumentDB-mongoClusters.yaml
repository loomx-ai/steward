schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DocumentDB/mongoClusters
  class: data.database_cluster
presentation:
  displayNames:
    en-US: Azure DocumentDB cluster
    zh-CN: Azure DocumentDB 集群
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.DocumentDB.MongoClusters_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.DocumentDB.MongoClusters_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  serverVersion:
    path: serverVersion
    type: string
  clusterStatus:
    path: clusterStatus
    type: string
  compute:
    path: compute
    type: object
  storage:
    path: storage
    type: object
  sharding:
    path: sharding
    type: object
  highAvailability:
    path: highAvailability
    type: object
  authConfig:
    path: authConfig
    type: object
  replica:
    path: replica
    type: object
  publicNetworkAccess:
    path: publicNetworkAccess
    type: string
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.DocumentDB/mongoClusters
  targetIdPath: refs_microsoft_documentdb_mongoclusters
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
actions:
  delete:
    operation: Azure.Microsoft.DocumentDB.MongoClusters_Delete
    idempotency: readback
    waiter: azure_operation
