schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DocumentDB/databaseAccounts/mongodbUserDefinitions
  class: security.database_user
presentation:
  displayNames:
    en-US: Cosmos DB MongoDB user
    zh-CN: Cosmos DB MongoDB 用户
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.DocumentDB.MongoDBResources_ListMongoUserDefinitions
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      accountName: parent.normalized.arm_parameters.accountName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.DocumentDB.MongoDBResources_GetMongoUserDefinition
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.DocumentDB/databaseAccounts
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.DocumentDB/databaseAccounts
  targetIdPath: refs_microsoft_documentdb_databaseaccounts
- type: uses
  targetType: Microsoft.DocumentDB/databaseAccounts/mongodbDatabases
  targetIdPath: refs_microsoft_documentdb_databaseaccounts_mongodbdatabases
- type: uses
  targetType: Microsoft.DocumentDB/databaseAccounts/mongodbRoleDefinitions
  targetIdPath: refs_microsoft_documentdb_databaseaccounts_mongodbroledefinitions
actions:
  delete:
    operation: Azure.Microsoft.DocumentDB.MongoDBResources_DeleteMongoUserDefinition
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.DocumentDB.MongoDBResources_GetMongoUserDefinition
      itemsPath: $
      identityPath: id
