schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Batch/batchAccounts/applications
  class: compute.batch_application
presentation:
  displayNames:
    en-US: Batch application
    zh-CN: 批处理应用
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Batch.Application_List
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      accountName: parent.normalized.arm_parameters.accountName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Batch.Application_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Batch/batchAccounts
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  allowUpdates:
    path: allowUpdates
    type: boolean
  defaultVersion:
    path: defaultVersion
    type: string
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Batch/batchAccounts
  targetIdPath: refs_microsoft_batch_batchaccounts
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
- type: uses
  targetType: Microsoft.Storage/storageAccounts
  targetIdPath: refs_microsoft_storage_storageaccounts
- type: uses
  targetType: Microsoft.KeyVault/vaults
  targetIdPath: refs_microsoft_keyvault_vaults
actions:
  delete:
    operation: Azure.Microsoft.Batch.Application_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Batch.Application_Get
      itemsPath: $
      identityPath: id
