schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Resources/resourceGroups
  class: organization.resource_group
presentation:
  displayNames:
    en-US: Resource group
    zh-CN: 资源组
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: global
discovery:
  source: azure-resource-manager
  detail:
    operation: Azure.ResourceManagementClient.ResourceGroups_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
