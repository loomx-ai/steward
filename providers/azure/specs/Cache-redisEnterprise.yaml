schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Cache/redisEnterprise
  class: database.cache
presentation:
  displayNames:
    en-US: Redis Enterprise / Managed Redis
    zh-CN: Redis Enterprise / 托管 Redis
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Cache.RedisEnterprise_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Cache.RedisEnterprise_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  sku:
    path: sku
    type: object
  hostName:
    path: hostName
    type: string
  redisVersion:
    path: redisVersion
    type: string
  highAvailability:
    path: highAvailability
    type: string
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
actions:
  delete:
    operation: Azure.Microsoft.Cache.RedisEnterprise_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Cache.RedisEnterprise_Get
      itemsPath: $
      identityPath: id
