schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/frontDoorWebApplicationFirewallPolicies
  class: security.waf_policy
presentation:
  displayNames:
    en-US: Front Door WAF policy
    zh-CN: Front Door WAF 策略
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Network.Policies_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Network.Policies_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  sku:
    path: sku
    type: object
  policySettings:
    path: policySettings
    type: object
  customRules:
    path: customRules
    type: object
  managedRules:
    path: managedRules
    type: object
extensions:
  hook: azure.resource
actions:
  delete:
    operation: Azure.Microsoft.Network.Policies_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.Policies_Get
      itemsPath: $
      identityPath: id
