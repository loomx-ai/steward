schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Network/azureFirewalls
  class: security.firewall
presentation:
  displayNames:
    en-US: Azure Firewall
    zh-CN: Azure 防火墙
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Network.AzureFirewalls_ListAll
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Network.AzureFirewalls_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  sku:
    path: sku
    type: object
  threatIntelMode:
    path: threatIntelMode
    type: string
  hubIPAddresses:
    path: hubIPAddresses
    type: object
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Network/firewallPolicies
  targetIdPath: refs_microsoft_network_firewallpolicies
- type: depends_on
  targetType: Microsoft.Network/publicIPAddresses
  targetIdPath: refs_microsoft_network_publicipaddresses
- type: depends_on
  targetType: Microsoft.Network/virtualNetworks/subnets
  targetIdPath: refs_microsoft_network_virtualnetworks_subnets
- type: depends_on
  targetType: Microsoft.Network/virtualNetworks
  targetIdPath: refs_microsoft_network_virtualnetworks
- type: depends_on
  targetType: Microsoft.Network/virtualHubs
  targetIdPath: refs_microsoft_network_virtualhubs
actions:
  delete:
    operation: Azure.Microsoft.Network.AzureFirewalls_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Network.AzureFirewalls_Get
      itemsPath: $
      identityPath: id
