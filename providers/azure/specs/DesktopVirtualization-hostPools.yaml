schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.DesktopVirtualization/hostPools
  class: network.virtual_desktop_network
presentation:
  displayNames:
    en-US: Azure Virtual Desktop host pool
    zh-CN: Azure 虚拟桌面主机池
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.DesktopVirtualization.HostPools_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.DesktopVirtualization.HostPools_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  hostPoolType:
    path: hostPoolType
    type: string
extensions:
  hook: azure.resource
relationships: []
actions:
  delete:
    operation: Azure.Microsoft.DesktopVirtualization.HostPools_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.DesktopVirtualization.HostPools_Get
      itemsPath: $
      identityPath: id
