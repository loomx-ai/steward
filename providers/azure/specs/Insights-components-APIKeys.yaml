schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Insights/components/APIKeys
  class: security.credential
presentation:
  displayNames:
    en-US: Application Insights API key
    zh-CN: Application Insights API 密钥
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Insights.APIKeys_List
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      resourceName: parent.normalized.arm_parameters.resourceName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Insights.APIKeys_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.Insights/components
fields:
  name:
    path: name
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.Insights/components
  targetIdPath: refs_microsoft_insights_components
actions:
  delete:
    operation: Azure.Microsoft.Insights.APIKeys_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Insights.APIKeys_Get
      itemsPath: $
      identityPath: id
