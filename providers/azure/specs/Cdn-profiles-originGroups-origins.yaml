  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  hostName:
    path: hostName
    type: string
  azureOrigin:
    path: azureOrigin
    type: object
  originHostHeader:
    path: originHostHeader
    type: string
  httpPort:
    path: httpPort
    type: integer
  httpsPort:
    path: httpsPort
    type: integer
  priority:
    path: priority
    type: integer
  weight:
