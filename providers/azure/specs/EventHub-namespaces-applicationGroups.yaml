schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.EventHub/namespaces/applicationGroups
  class: messaging.application_group
presentation:
  displayNames:
    en-US: Event Hubs application group
    zh-CN: Event Hubs 应用组
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.EventHub.ApplicationGroup_ListByNamespace
    parameters:
      subscriptionId: scope.subscription
      resourceGroupName: parent.normalized.arm_parameters.resourceGroupName
      namespaceName: parent.normalized.arm_parameters.namespaceName
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.EventHub.ApplicationGroup_Get
    itemsPath: $
    identityPath: id
  parent:
    source: product-api
    nativeType: Microsoft.EventHub/namespaces
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
  clientAppGroupIdentifier:
    path: clientAppGroupIdentifier
    type: string
  policies:
    path: policies
    type: array
  isEnabled:
    path: isEnabled
    type: boolean
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.EventHub/namespaces
  targetIdPath: refs_microsoft_eventhub_namespaces
actions:
  delete:
    operation: Azure.Microsoft.EventHub.ApplicationGroup_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.EventHub.ApplicationGroup_Get
      itemsPath: $
      identityPath: id
