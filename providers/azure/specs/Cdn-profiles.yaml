schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.Cdn/profiles
  class: network.cdn
presentation:
  displayNames:
    en-US: CDN / Front Door profile
    zh-CN: CDN / Front Door 配置
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.Cdn.Profiles_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.Cdn.Profiles_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
  sku:
    path: sku
    type: object
  originResponseTimeoutSeconds:
    path: originResponseTimeoutSeconds
    type: integer
  frontDoorId:
    path: frontDoorId
    type: string
  logScrubbing:
    path: logScrubbing
    type: object
extensions:
  hook: azure.resource
relationships:
- type: depends_on
  targetType: Microsoft.ManagedIdentity/userAssignedIdentities
  targetIdPath: refs_microsoft_managedidentity_userassignedidentities
actions:
  delete:
    operation: Azure.Microsoft.Cdn.Profiles_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.Cdn.Profiles_Get
      itemsPath: $
      identityPath: id
