schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.ApiManagement/gateways
  class: network.api_gateway
presentation:
  displayNames:
    en-US: API Management managed workspace gateway
    zh-CN: API 管理托管工作区网关
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: Azure.Microsoft.ApiManagement.ApiGateway_List
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
  detail:
    operation: Azure.Microsoft.ApiManagement.ApiGateway_Get
    itemsPath: $
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships:
- type: uses
  targetType: Microsoft.Network/virtualNetworks/subnets
  targetIdPath: refs_microsoft_network_virtualnetworks_subnets
- type: uses
  targetType: Microsoft.Network/virtualNetworks
  targetIdPath: refs_microsoft_network_virtualnetworks
actions:
  delete:
    operation: Azure.Microsoft.ApiManagement.ApiGateway_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.ApiManagement.ApiGateway_Get
      itemsPath: $
      identityPath: id
