schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: azure
  nativeType: Microsoft.StorageSync/storageSyncServices
  class: storage.gateway
presentation:
  displayNames:
    en-US: Storage Sync Service
    zh-CN: 存储同步服务
  consoleLinkTemplate: https://portal.azure.com/#resource{nativeId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: Azure.Microsoft.StorageSync.StorageSyncServices_Get
    itemsPath: $
    identityPath: id
  list:
    operation: Azure.Microsoft.StorageSync.StorageSyncServices_ListBySubscription
    parameters:
      subscriptionId: scope.subscription
    itemsPath: value
    identityPath: id
fields:
  name:
    path: name
    type: string
  state:
    path: provisioningState
    type: string
  subscriptionId:
    path: subscription_id
    type: string
  resourceGroup:
    path: resource_group
    type: string
  zoneId:
    path: zone_id
    type: string
  tags:
    path: tags
    type: object
extensions:
  hook: azure.resource
relationships: []
actions:
  delete:
    operation: Azure.Microsoft.StorageSync.StorageSyncServices_Delete
    idempotency: readback
    waiter: azure_operation
    readback: azure_absent
    read:
      operation: Azure.Microsoft.StorageSync.StorageSyncServices_Get
      itemsPath: $
      identityPath: id
