schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/TargetHttpProxy
  class: network.proxy
presentation:
  displayNames:
    en-US: Target HTTP proxy
    zh-CN: HTTP 目标代理
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: cloud-asset-inventory
  detail:
    operation: compute.targetHttpProxies.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  state:
    path: status
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  labels:
    path: labels
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: uses
  targetType: compute.googleapis.com/UrlMap
  targetIdPath: refs_compute_googleapis_com_UrlMap
actions:
  delete:
    operation: compute.targetHttpProxies.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.targetHttpProxies.get
      itemsPath: $
      identityPath: name
