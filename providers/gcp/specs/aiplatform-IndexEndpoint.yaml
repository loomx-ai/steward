schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: aiplatform.googleapis.com/IndexEndpoint
  class: ai.index_endpoint
presentation:
  displayNames:
    en-US: Vertex AI index endpoint
    zh-CN: Vertex AI 索引端点
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: aiplatform.projects.locations.indexEndpoints.list
    parameters:
      parent: scope.locationParent
    itemsPath: indexEndpoints
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: aiplatform.projects.locations.indexEndpoints.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  displayName:
    path: displayName
    type: string
  etag:
    path: etag
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  deployedIndexes:
    path: deployedIndexes
    type: array
  network:
    path: network
    type: string
  publicEndpointEnabled:
    path: publicEndpointEnabled
    type: boolean
extensions:
  hook: gcp.resource
relationships:
- type: member_of
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
actions:
  delete:
    operation: aiplatform.projects.locations.indexEndpoints.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: aiplatform.projects.locations.indexEndpoints.get
      itemsPath: $
      identityPath: name
