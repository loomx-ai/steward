schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: monitoring.googleapis.com/Group
  class: observability.resource_group
presentation:
  displayNames:
    en-US: Cloud Monitoring group
    zh-CN: 云监控资源组
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: monitoring.projects.groups.list
    parameters:
      name: scope.projectPath
    itemsPath: group
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: monitoring.projects.groups.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  displayName:
    path: displayName
    type: string
  parentName:
    path: parentName
    type: string
  isCluster:
    path: isCluster
    type: boolean
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: monitoring.projects.groups.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: monitoring.projects.groups.get
      itemsPath: $
      identityPath: name
