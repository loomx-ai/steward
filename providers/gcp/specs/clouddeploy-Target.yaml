schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: clouddeploy.googleapis.com/Target
  class: devops.deploy_target
presentation:
  displayNames:
    en-US: Cloud Deploy target
    zh-CN: Cloud Deploy 目标
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: clouddeploy.projects.locations.targets.list
    parameters:
      parent: scope.locationParent
    itemsPath: targets
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: clouddeploy.projects.locations.targets.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  uid:
    path: uid
    type: string
  targetId:
    path: targetId
    type: string
  etag:
    path: etag
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  requireApproval:
    path: requireApproval
    type: boolean
  gke:
    path: gke
    type: object
  run:
    path: run
    type: object
  executionConfigs:
    path: executionConfigs
    type: array
extensions:
  hook: gcp.resource
relationships:
- type: uses
  targetType: iam.googleapis.com/ServiceAccount
  targetIdPath: refs_iam_googleapis_com_ServiceAccount
actions:
  delete:
    operation: clouddeploy.projects.locations.targets.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: clouddeploy.projects.locations.targets.get
      itemsPath: $
      identityPath: name
