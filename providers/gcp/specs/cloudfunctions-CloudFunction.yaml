schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: cloudfunctions.googleapis.com/CloudFunction
  class: compute.function
presentation:
  displayNames:
    en-US: Cloud Run function
    zh-CN: 云函数
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: cloudfunctions.projects.locations.functions.list
    parameters:
      parent: scope.allLocationsParent
    itemsPath: functions
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: cloudfunctions.projects.locations.functions.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  environment:
    path: environment
    type: string
  description:
    path: description
    type: string
  buildConfig:
    path: buildConfig
    type: object
  serviceConfig:
    path: serviceConfig
    type: object
  eventTrigger:
    path: eventTrigger
    type: object
  stateMessages:
    path: stateMessages
    type: array
  kmsKeyName:
    path: kmsKeyName
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: depends_on
  targetType: compute.googleapis.com/Subnetwork
  targetIdPath: refs_compute_googleapis_com_Subnetwork
- type: depends_on
  targetType: cloudkms.googleapis.com/CryptoKey
  targetIdPath: refs_cloudkms_googleapis_com_CryptoKey
- type: depends_on
  targetType: run.googleapis.com/Service
  targetIdPath: refs_run_googleapis_com_Service
- type: depends_on
  targetType: pubsub.googleapis.com/Topic
  targetIdPath: refs_pubsub_googleapis_com_Topic
- type: depends_on
  targetType: iam.googleapis.com/ServiceAccount
  targetIdPath: refs_iam_googleapis_com_ServiceAccount
actions:
  delete:
    operation: cloudfunctions.projects.locations.functions.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: cloudfunctions.projects.locations.functions.get
      itemsPath: $
      identityPath: name
