schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/BackendService
  class: network.load_balancer_backend
presentation:
  displayNames:
    en-US: Backend service
    zh-CN: 后端服务
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: global
discovery:
  source: product-api
  detail:
    operation: compute.backendServices.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.backendServices.list
    parameters:
      project: scope.project
    itemsPath: items
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  externalManagedMigrationState:
    path: externalManagedMigrationState
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: member_of
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: uses
  targetType: compute.googleapis.com/HealthCheck
  targetIdPath: refs_compute_googleapis_com_HealthCheck
- type: uses
  targetType: compute.googleapis.com/InstanceGroup
  targetIdPath: refs_compute_googleapis_com_InstanceGroup
- type: uses
  targetType: compute.googleapis.com/NetworkEndpointGroup
  targetIdPath: refs_compute_googleapis_com_NetworkEndpointGroup
- type: depends_on
  targetType: compute.googleapis.com/SecurityPolicy
  targetIdPath: refs_compute_googleapis_com_SecurityPolicy
actions:
  delete:
    operation: compute.backendServices.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.backendServices.get
      itemsPath: $
      identityPath: name
