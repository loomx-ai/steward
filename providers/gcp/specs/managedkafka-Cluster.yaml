schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: managedkafka.googleapis.com/Cluster
  class: messaging.broker
presentation:
  displayNames:
    en-US: Managed Kafka cluster
    zh-CN: 托管 Kafka 集群
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: managedkafka.projects.locations.clusters.list
    parameters:
      parent: scope.locationParent
    itemsPath: clusters
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: managedkafka.projects.locations.clusters.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  capacityConfig:
    path: capacityConfig
    type: object
  gcpConfig:
    path: gcpConfig
    type: object
  rebalanceConfig:
    path: rebalanceConfig
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: depends_on
  targetType: compute.googleapis.com/Subnetwork
  targetIdPath: refs_compute_googleapis_com_Subnetwork
- type: depends_on
  targetType: cloudkms.googleapis.com/CryptoKey
  targetIdPath: refs_cloudkms_googleapis_com_CryptoKey
actions:
  delete:
    operation: managedkafka.projects.locations.clusters.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: managedkafka.projects.locations.clusters.get
      itemsPath: $
      identityPath: name
