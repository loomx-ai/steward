schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: discoveryengine.googleapis.com/Branch
  class: data.branch
presentation:
  displayNames:
    en-US: Discovery Engine Branch
    zh-CN: Discovery Engine 数据分支
  consoleLinkTemplate: https://console.cloud.google.com/gen-app-builder/engines?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: discoveryengine.projects.locations.collections.dataStores.branches.list
    parameters:
      parent: parent.nativeId
    itemsPath: branches
    identityPath: name
  detail:
    operation: discoveryengine.projects.locations.collections.dataStores.branches.get
    itemsPath: $
    identityPath: name
  parent:
    source: product-api
    nativeType: discoveryengine.googleapis.com/DataStore
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  displayName:
    path: displayName
    type: string
  createTime:
    path: createTime
    type: string
  state:
    path: state
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: discoveryengine.googleapis.com/DataStore
  targetIdPath: refs_discoveryengine_googleapis_com_DataStore
