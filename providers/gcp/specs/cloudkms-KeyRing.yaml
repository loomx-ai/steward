schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: cloudkms.googleapis.com/KeyRing
  class: security.key_ring
presentation:
  displayNames:
    en-US: Cloud KMS key ring
    zh-CN: KMS 密钥环
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: cloudkms.projects.locations.keyRings.list
    parameters:
      parent: scope.locationParent
    itemsPath: keyRings
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 1000
  detail:
    operation: cloudkms.projects.locations.keyRings.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  state:
    path: state
    type: string
  projectId:
    path: project_id
    type: string
  labels:
    path: labels
    type: object
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: cloudkms.projects.locations.keyRings.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: cloudkms.projects.locations.keyRings.get
      itemsPath: $
      identityPath: name
