schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: datafusion.googleapis.com/Instance
  class: data.pipeline
presentation:
  displayNames:
    en-US: Data Fusion instance
    zh-CN: Data Fusion 实例
  consoleLinkTemplate: https://console.cloud.google.com/data-fusion/instances?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: datafusion.projects.locations.instances.list
    parameters:
      parent: scope.locationParent
    itemsPath: instances
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail: &read
    operation: datafusion.projects.locations.instances.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  createTime:
    path: createTime
    type: string
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: datafusion.projects.locations.instances.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read: *read
relationships:
- type: depends_on
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: depends_on
  targetType: compute.googleapis.com/NetworkAttachment
  targetIdPath: refs_compute_googleapis_com_NetworkAttachment
- type: depends_on
  targetType: storage.googleapis.com/Bucket
  targetIdPath: refs_storage_googleapis_com_Bucket
- type: depends_on
  targetType: iam.googleapis.com/ServiceAccount
  targetIdPath: refs_iam_googleapis_com_ServiceAccount
- type: depends_on
  targetType: cloudkms.googleapis.com/CryptoKey
  targetIdPath: refs_cloudkms_googleapis_com_CryptoKey
- type: depends_on
  targetType: pubsub.googleapis.com/Topic
  targetIdPath: refs_pubsub_googleapis_com_Topic
