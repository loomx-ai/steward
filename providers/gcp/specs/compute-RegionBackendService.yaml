schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/RegionBackendService
  class: network.load_balancer_backend
presentation:
  displayNames:
    en-US: Regional backend service
    zh-CN: 区域后端服务
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.regionBackendServices.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.regionBackendServices.list
    parameters:
      project: scope.project
      region: scope.location
    itemsPath: items
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  state:
    path: status
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  labels:
    path: labels
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: member_of
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: uses
  targetType: compute.googleapis.com/HealthCheck
  targetIdPath: refs_compute_googleapis_com_HealthCheck
- type: uses
  targetType: compute.googleapis.com/InstanceGroup
  targetIdPath: refs_compute_googleapis_com_InstanceGroup
actions:
  delete:
    operation: compute.regionBackendServices.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.regionBackendServices.get
      itemsPath: $
      identityPath: name
