schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/SslCertificate
  class: security.certificate
presentation:
  displayNames:
    en-US: SSL certificate
    zh-CN: SSL 证书
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.sslCertificates.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.sslCertificates.aggregatedList
    parameters:
      project: scope.project
    itemsPath: items.*.sslCertificates
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  managedStatus:
    path: managed.status
    type: string
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: compute.sslCertificates.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.sslCertificates.get
      itemsPath: $
      identityPath: name
