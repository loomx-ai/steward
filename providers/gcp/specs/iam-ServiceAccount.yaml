schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: iam.googleapis.com/ServiceAccount
  class: identity.role
presentation:
  displayNames:
    en-US: IAM service account
    zh-CN: IAM 服务账号
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: iam.projects.serviceAccounts.list
    parameters:
      name: scope.projectPath
    itemsPath: accounts
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: iam.projects.serviceAccounts.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: projectId
    type: string
  etag:
    path: etag
    type: string
  uniqueId:
    path: uniqueId
    type: string
  email:
    path: email
    type: string
  displayName:
    path: displayName
    type: string
  disabled:
    path: disabled
    type: boolean
  description:
    path: description
    type: string
  oauth2ClientId:
    path: oauth2ClientId
    type: string
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: iam.projects.serviceAccounts.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: iam.projects.serviceAccounts.get
      itemsPath: $
      identityPath: name
