schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/NetworkEndpointGroup
  class: network.endpoint_group
presentation:
  displayNames:
    en-US: Network endpoint group
    zh-CN: 网络端点组
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.networkEndpointGroups.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.networkEndpointGroups.aggregatedList
    parameters:
      project: scope.project
      includeAllScopes: true
    itemsPath: items.*.networkEndpointGroups
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  state:
    path: status
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  labels:
    path: labels
    type: object
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: compute.networkEndpointGroups.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.networkEndpointGroups.get
      itemsPath: $
      identityPath: name
relationships:
- type: depends_on
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: depends_on
  targetType: compute.googleapis.com/Subnetwork
  targetIdPath: refs_compute_googleapis_com_Subnetwork
