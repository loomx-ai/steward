schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/Firewall
  class: network.security_group
presentation:
  displayNames:
    en-US: VPC firewall rule
    zh-CN: VPC 防火墙规则
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: global
discovery:
  source: product-api
  detail:
    operation: compute.firewalls.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.firewalls.list
    parameters:
      project: scope.project
    itemsPath: items
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: member_of
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
actions:
  delete:
    operation: compute.firewalls.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.firewalls.get
      itemsPath: $
      identityPath: name
