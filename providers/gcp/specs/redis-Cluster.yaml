schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: redis.googleapis.com/Cluster
  class: database.redis
presentation:
  displayNames:
    en-US: Memorystore Redis cluster
    zh-CN: Redis 集群
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: redis.projects.locations.clusters.list
    parameters:
      parent: scope.allLocationsParent
    itemsPath: clusters
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: redis.projects.locations.clusters.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  uid:
    path: uid
    type: string
  shardCount:
    path: shardCount
    type: number
  replicaCount:
    path: replicaCount
    type: number
  nodeType:
    path: nodeType
    type: string
  sizeGb:
    path: sizeGb
    type: number
  pscConfigs:
    path: pscConfigs
    type: array
  pscConnections:
    path: pscConnections
    type: array
  deletionProtectionEnabled:
    path: deletionProtectionEnabled
    type: boolean
  persistenceConfig:
    path: persistenceConfig
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: depends_on
  targetType: compute.googleapis.com/Subnetwork
  targetIdPath: refs_compute_googleapis_com_Subnetwork
- type: depends_on
  targetType: cloudkms.googleapis.com/CryptoKey
  targetIdPath: refs_cloudkms_googleapis_com_CryptoKey
actions:
  delete:
    operation: redis.projects.locations.clusters.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: redis.projects.locations.clusters.get
      itemsPath: $
      identityPath: name
