schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/NodeGroup
  class: compute.dedicated_host
presentation:
  displayNames:
    en-US: Sole-tenant node group
    zh-CN: 独占租户节点组
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.nodeGroups.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.nodeGroups.aggregatedList
    parameters:
      project: scope.project
      includeAllScopes: true
    itemsPath: items.*.nodeGroups
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  state:
    path: status
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  resourceId:
    path: id
    type: string
  description:
    path: description
    type: string
  createdAt:
    path: creationTimestamp
    type: string
  size:
    path: size
    type: number
  nodeTemplate:
    path: nodeTemplate
    type: string
  maintenancePolicy:
    path: maintenancePolicy
    type: string
  autoscalingPolicy:
    path: autoscalingPolicy
    type: object
  shareSettings:
    path: shareSettings
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: compute.googleapis.com/NodeTemplate
  targetIdPath: refs_compute_googleapis_com_NodeTemplate
actions:
  delete:
    operation: compute.nodeGroups.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.nodeGroups.get
      itemsPath: $
      identityPath: name
