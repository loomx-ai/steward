schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: file.googleapis.com/Instance
  class: storage.file_system
presentation:
  displayNames:
    en-US: Filestore instance
    zh-CN: Filestore 实例
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: file.projects.locations.instances.list
    parameters:
      parent: scope.allLocationsParent
    itemsPath: instances
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: file.projects.locations.instances.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  labels:
    path: labels
    type: object
  etag:
    path: etag
    type: string
  createTime:
    path: createTime
    type: string
  tier:
    path: tier
    type: string
  protocol:
    path: protocol
    type: string
  fileShares:
    path: fileShares
    type: array
  networks:
    path: networks
    type: array
  deletionProtectionEnabled:
    path: deletionProtectionEnabled
    type: boolean
  deletionProtectionReason:
    path: deletionProtectionReason
    type: string
  kmsKeyName:
    path: kmsKeyName
    type: string
  performanceConfig:
    path: performanceConfig
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: depends_on
  targetType: cloudkms.googleapis.com/CryptoKey
  targetIdPath: refs_cloudkms_googleapis_com_CryptoKey
actions:
  delete:
    operation: file.projects.locations.instances.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: file.projects.locations.instances.get
      itemsPath: $
      identityPath: name
