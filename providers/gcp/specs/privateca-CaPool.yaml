schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: privateca.googleapis.com/CaPool
  class: security.certificate_authority_pool
presentation:
  displayNames:
    en-US: Private CA pool
    zh-CN: 私有 CA 池
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: privateca.projects.locations.caPools.list
    parameters:
      parent: scope.locationParent
    itemsPath: caPools
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: privateca.projects.locations.caPools.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  tier:
    path: tier
    type: string
  labels:
    path: labels
    type: object
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: privateca.projects.locations.caPools.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: privateca.projects.locations.caPools.get
      itemsPath: $
      identityPath: name
