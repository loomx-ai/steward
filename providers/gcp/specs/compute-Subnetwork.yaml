schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/Subnetwork
  class: network.subnet
presentation:
  displayNames:
    en-US: VPC subnet
    zh-CN: VPC 子网
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.subnetworks.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.subnetworks.list
    parameters:
      project: scope.project
      region: scope.location
    itemsPath: items
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  state:
    path: state
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: member_of
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
actions:
  delete:
    operation: compute.subnetworks.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.subnetworks.get
      itemsPath: $
      identityPath: name
