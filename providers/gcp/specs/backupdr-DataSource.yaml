schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: backupdr.googleapis.com/DataSource
  class: backup.source
presentation:
  displayNames:
    en-US: Backup data source
    zh-CN: 备份数据源
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: backupdr.projects.locations.backupVaults.dataSources.list
    parameters:
      parent: parent.nativeId
    itemsPath: dataSources
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: backupdr.projects.locations.backupVaults.dataSources.get
    itemsPath: $
    identityPath: name
  parent:
    source: product-api
    nativeType: backupdr.googleapis.com/BackupVault
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  labels:
    path: labels
    type: object
  etag:
    path: etag
    type: string
  createTime:
    path: createTime
    type: string
  configState:
    path: configState
    type: string
  backupCount:
    path: backupCount
    type: string
  backupConfigInfo:
    path: backupConfigInfo
    type: object
  dataSourceGcpResource:
    path: dataSourceGcpResource
    type: object
  dataSourceBackupApplianceApplication:
    path: dataSourceBackupApplianceApplication
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: backupdr.googleapis.com/BackupVault
  targetIdPath: refs_backupdr_googleapis_com_BackupVault
actions:
  delete:
    operation: backupdr.projects.locations.backupVaults.dataSources.remove
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: backupdr.projects.locations.backupVaults.dataSources.get
      itemsPath: $
      identityPath: name
