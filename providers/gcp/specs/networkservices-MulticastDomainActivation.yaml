schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: networkservices.googleapis.com/MulticastDomainActivation
  class: network.multicast_activation
presentation:
  displayNames:
    en-US: Multicast domain activation
    zh-CN: 组播域激活
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: networkservices.projects.locations.multicastDomainActivations.list
    parameters:
      parent: scope.locationParent
    itemsPath: multicastDomainActivations
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: networkservices.projects.locations.multicastDomainActivations.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: object
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  uniqueId:
    path: uniqueId
    type: string
  description:
    path: description
    type: string
  adminNetwork:
    path: adminNetwork
    type: string
  multicastDomain:
    path: multicastDomain
    type: string
  disablePlacementPolicy:
    path: disablePlacementPolicy
    type: boolean
  trafficSpec:
    path: trafficSpec
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: depends_on
  targetType: networkservices.googleapis.com/MulticastDomain
  targetIdPath: refs_networkservices_googleapis_com_MulticastDomain
actions:
  delete:
    operation: networkservices.projects.locations.multicastDomainActivations.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: networkservices.projects.locations.multicastDomainActivations.get
      itemsPath: $
      identityPath: name
