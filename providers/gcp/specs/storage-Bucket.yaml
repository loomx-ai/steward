schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: storage.googleapis.com/Bucket
  class: storage.bucket
presentation:
  displayNames:
    en-US: Cloud Storage bucket
    zh-CN: 对象存储桶
  consoleLinkTemplate: https://console.cloud.google.com/storage/browser/{nativeId|suffix:/}?project={projectId}
scope:
  kind: global
discovery:
  source: product-api
  detail:
    operation: storage.buckets.get
    itemsPath: $
    identityPath: name
  list:
    operation: storage.buckets.list
    parameters:
      project: scope.project
    itemsPath: items
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  labels:
    path: labels
    type: object
  timeCreated:
    path: timeCreated
    type: string
  updated:
    path: updated
    type: string
  storageClass:
    path: storageClass
    type: string
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: storage.buckets.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: storage.buckets.get
      itemsPath: $
      identityPath: name
