schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: certificatemanager.googleapis.com/TrustConfig
  class: security.certificate
presentation:
  displayNames:
    en-US: Certificate Manager trust config
    zh-CN: 证书管理器信任配置
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: certificatemanager.projects.locations.trustConfigs.list
    parameters:
      parent: scope.locationParent
    itemsPath: trustConfigs
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: certificatemanager.projects.locations.trustConfigs.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  updateTime:
    path: updateTime
    type: string
  description:
    path: description
    type: string
  trustStores:
    path: trustStores
    type: array
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: certificatemanager.projects.locations.trustConfigs.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: certificatemanager.projects.locations.trustConfigs.get
      itemsPath: $
      identityPath: name
