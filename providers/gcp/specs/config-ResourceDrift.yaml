schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: config.googleapis.com/ResourceDrift
  class: orchestration.resource_drift
presentation:
  displayNames:
    en-US: Infrastructure Manager resource drift
    zh-CN: Infrastructure Manager 资源漂移
  consoleLinkTemplate: https://console.cloud.google.com/infra-manager/deployments?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  parent:
    nativeType: config.googleapis.com/Preview
    source: product-api
  list:
    operation: config.projects.locations.previews.resourceDrifts.list
    parameters:
      parent: parent.nativeId
    itemsPath: resourceDrifts
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 1000
  detail: &read
    operation: config.projects.locations.previews.resourceDrifts.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  deploymentResourceType:
    path: terraformInfo.type
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: config.googleapis.com/Preview
  targetIdPath: refs_config_googleapis_com_Preview
