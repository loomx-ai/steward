schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: apigateway.googleapis.com/ApiConfig
  class: network.api_config
presentation:
  displayNames:
    en-US: API Gateway configuration
    zh-CN: API Gateway 配置
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: apigateway.projects.locations.apis.configs.list
    parameters:
      parent: parent.nativeId
    itemsPath: apiConfigs
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: apigateway.projects.locations.apis.configs.get
    itemsPath: $
    identityPath: name
  parent:
    source: product-api
    nativeType: apigateway.googleapis.com/Api
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  displayName:
    path: displayName
    type: string
  gatewayServiceAccount:
    path: gatewayServiceAccount
    type: string
  serviceConfigId:
    path: serviceConfigId
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: apigateway.googleapis.com/Api
  targetIdPath: refs_apigateway_googleapis_com_Api
- type: depends_on
  targetType: iam.googleapis.com/ServiceAccount
  targetIdPath: refs_iam_googleapis_com_ServiceAccount
actions:
  delete:
    operation: apigateway.projects.locations.apis.configs.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: apigateway.projects.locations.apis.configs.get
      itemsPath: $
      identityPath: name
