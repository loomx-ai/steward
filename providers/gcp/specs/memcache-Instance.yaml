schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: memcache.googleapis.com/Instance
  class: database.cache
presentation:
  displayNames:
    en-US: Memorystore for Memcached instance
    zh-CN: Memcached 实例
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: memcache.projects.locations.instances.list
    parameters:
      parent: scope.locationParent
    itemsPath: instances
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: memcache.projects.locations.instances.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  authorizedNetwork:
    path: authorizedNetwork
    type: string
  nodeCount:
    path: nodeCount
    type: number
  memcacheVersion:
    path: memcacheVersion
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: member_of
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
actions:
  delete:
    operation: memcache.projects.locations.instances.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: memcache.projects.locations.instances.get
      itemsPath: $
      identityPath: name
