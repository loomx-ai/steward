schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/SslPolicy
  class: security.tls_policy
presentation:
  displayNames:
    en-US: SSL policy
    zh-CN: SSL 策略
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.sslPolicies.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.sslPolicies.aggregatedList
    parameters:
      project: scope.project
      includeAllScopes: true
    itemsPath: items.*.sslPolicies
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  resourceId:
    path: id
    type: string
  description:
    path: description
    type: string
  createdAt:
    path: creationTimestamp
    type: string
  profile:
    path: profile
    type: string
  minTlsVersion:
    path: minTlsVersion
    type: string
  enabledFeatures:
    path: enabledFeatures
    type: array
  customFeatures:
    path: customFeatures
    type: array
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: compute.sslPolicies.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.sslPolicies.get
      itemsPath: $
      identityPath: name
