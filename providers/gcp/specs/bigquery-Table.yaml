schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: bigquery.googleapis.com/Table
  class: database.table
presentation:
  displayNames:
    en-US: BigQuery table
    zh-CN: BigQuery 表
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: bigquery.tables.list
    parameters:
      projectId: scope.project
      datasetId: parent.normalized.datasetReference.datasetId
    itemsPath: tables
    identityPath: tableReference.tableId
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 100
  detail:
    operation: bigquery.tables.get
    itemsPath: $
    identityPath: tableReference.tableId
  parent:
    source: product-api
    nativeType: bigquery.googleapis.com/Dataset
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  labels:
    path: labels
    type: object
  etag:
    path: etag
    type: string
  tableReference:
    path: tableReference
    type: object
  friendlyName:
    path: friendlyName
    type: string
  type:
    path: type
    type: string
  location:
    path: location
    type: string
  numRows:
    path: numRows
    type: string
  numBytes:
    path: numBytes
    type: string
  expirationTime:
    path: expirationTime
    type: string
  encryptionConfiguration:
    path: encryptionConfiguration
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: bigquery.googleapis.com/Dataset
  targetIdPath: refs_bigquery_googleapis_com_Dataset
- type: depends_on
  targetType: cloudkms.googleapis.com/CryptoKey
  targetIdPath: refs_cloudkms_googleapis_com_CryptoKey
actions:
  delete:
    operation: bigquery.tables.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: bigquery.tables.get
      itemsPath: $
      identityPath: tableReference.tableId
