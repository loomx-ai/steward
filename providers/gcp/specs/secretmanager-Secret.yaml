schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: secretmanager.googleapis.com/Secret
  class: security.secret
presentation:
  displayNames:
    en-US: Secret Manager secret
    zh-CN: 密钥
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: secretmanager.projects.secrets.get
    itemsPath: $
    identityPath: name
  list:
    operation: secretmanager.projects.secrets.list
    parameters:
      parent: scope.projectPath
    itemsPath: secrets
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  state:
    path: status
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  labels:
    path: labels
    type: object
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: secretmanager.projects.secrets.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: secretmanager.projects.secrets.get
      itemsPath: $
      identityPath: name
