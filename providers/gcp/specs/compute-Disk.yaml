schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/Disk
  class: storage.disk
presentation:
  displayNames:
    en-US: Persistent disk
    zh-CN: 持久磁盘
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.disks.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.disks.aggregatedList
    parameters:
      project: scope.project
    itemsPath: items.*.disks
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  state:
    path: status
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  labels:
    path: labels
    type: object
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: compute.disks.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.disks.get
      itemsPath: $
      identityPath: name
relationships:
- type: depends_on
  targetType: compute.googleapis.com/ResourcePolicy
  targetIdPath: refs_compute_googleapis_com_ResourcePolicy
