schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: discoveryengine.googleapis.com/Collection
  class: data.collection
presentation:
  displayNames:
    en-US: Discovery Engine Collection
    zh-CN: Discovery Engine 集合
  consoleLinkTemplate: https://console.cloud.google.com/gen-app-builder/engines?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: discoveryengine.projects.locations.collections.list
    parameters:
      parent: scope.locationParent
    itemsPath: collections
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail: &id001
    operation: discoveryengine.projects.locations.collections.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  displayName:
    path: displayName
    type: string
  createTime:
    path: createTime
    type: string
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: discoveryengine.projects.locations.collections.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read: *id001
