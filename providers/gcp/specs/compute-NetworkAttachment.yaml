schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/NetworkAttachment
  class: network.endpoint
presentation:
  displayNames:
    en-US: Network attachment
    zh-CN: 网络附件
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.networkAttachments.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.networkAttachments.aggregatedList
    parameters:
      project: scope.project
      includeAllScopes: true
    itemsPath: items.*.networkAttachments
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  resourceId:
    path: id
    type: string
  description:
    path: description
    type: string
  createdAt:
    path: creationTimestamp
    type: string
  network:
    path: network
    type: string
  subnetworks:
    path: subnetworks
    type: array
  connectionPreference:
    path: connectionPreference
    type: string
  connectionEndpoints:
    path: connectionEndpoints
    type: array
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: depends_on
  targetType: compute.googleapis.com/Subnetwork
  targetIdPath: refs_compute_googleapis_com_Subnetwork
actions:
  delete:
    operation: compute.networkAttachments.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.networkAttachments.get
      itemsPath: $
      identityPath: name
