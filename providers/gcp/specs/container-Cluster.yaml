schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: container.googleapis.com/Cluster
  class: container.cluster
presentation:
  displayNames:
    en-US: GKE cluster
    zh-CN: GKE 集群
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: container.projects.locations.clusters.get
    itemsPath: $
    identityPath: name
  list:
    operation: container.projects.locations.clusters.list
    parameters:
      parent: scope.allLocationsParent
    itemsPath: clusters
    identityPath: name
fields:
  name:
    path: name
    type: string
  state:
    path: status
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  labels:
    path: resourceLabels
    type: object
  clusterId:
    path: id
    type: string
  currentMasterVersion:
    path: currentMasterVersion
    type: string
  nodePools:
    path: nodePools
    type: array
extensions:
  hook: gcp.resource
relationships:
- type: member_of
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: member_of
  targetType: compute.googleapis.com/Subnetwork
  targetIdPath: refs_compute_googleapis_com_Subnetwork
actions:
  delete:
    operation: container.projects.locations.clusters.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: container.projects.locations.clusters.get
      itemsPath: $
      identityPath: name
