schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: config.googleapis.com/ResourceChange
  class: orchestration.resource_change
presentation:
  displayNames:
    en-US: Infrastructure Manager resource change
    zh-CN: Infrastructure Manager 资源变更
  consoleLinkTemplate: https://console.cloud.google.com/infra-manager/deployments?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  parent:
    nativeType: config.googleapis.com/Preview
    source: product-api
  list:
    operation: config.projects.locations.previews.resourceChanges.list
    parameters:
      parent: parent.nativeId
    itemsPath: resourceChanges
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 1000
  detail: &read
    operation: config.projects.locations.previews.resourceChanges.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: config.googleapis.com/Preview
  targetIdPath: refs_config_googleapis_com_Preview
