schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/Autoscaler
  class: compute.scaling_policy
presentation:
  displayNames:
    en-US: Autoscaler
    zh-CN: 自动扩缩容策略
  consoleLinkTemplate: https://console.cloud.google.com/compute/instanceGroups?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.autoscalers.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.autoscalers.aggregatedList
    parameters:
      project: scope.project
    itemsPath: items.*.autoscalers
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  labels:
    path: labels
    type: object
  autoscalingPolicy:
    path: autoscalingPolicy
    type: object
  state:
    path: status
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: uses
  targetType: compute.googleapis.com/InstanceGroupManager
  targetIdPath: refs_compute_googleapis_com_InstanceGroupManager
actions:
  delete:
    operation: compute.autoscalers.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.autoscalers.get
      itemsPath: $
      identityPath: name
