schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: networkservices.googleapis.com/MulticastProducerAssociation
  class: network.multicast_attachment
presentation:
  displayNames:
    en-US: Multicast producer association
    zh-CN: 组播发送方关联
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: networkservices.projects.locations.multicastProducerAssociations.list
    parameters:
      parent: scope.locationParent
    itemsPath: multicastProducerAssociations
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: networkservices.projects.locations.multicastProducerAssociations.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: object
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  uniqueId:
    path: uniqueId
    type: string
  description:
    path: description
    type: string
  multicastDomainActivation:
    path: multicastDomainActivation
    type: string
  network:
    path: network
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: depends_on
  targetType: networkservices.googleapis.com/MulticastDomainActivation
  targetIdPath: refs_networkservices_googleapis_com_MulticastDomainActivation
actions:
  delete:
    operation: networkservices.projects.locations.multicastProducerAssociations.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: networkservices.projects.locations.multicastProducerAssociations.get
      itemsPath: $
      identityPath: name
