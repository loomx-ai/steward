schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: discoveryengine.googleapis.com/Assistant
  class: search.assistant
presentation:
  displayNames:
    en-US: Discovery Engine Assistant
    zh-CN: Discovery Engine 助手
  consoleLinkTemplate: https://console.cloud.google.com/gen-app-builder/engines?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: discoveryengine.projects.locations.collections.engines.assistants.list
    parameters:
      parent: parent.nativeId
    itemsPath: assistants
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail: &id001
    operation: discoveryengine.projects.locations.collections.engines.assistants.get
    itemsPath: $
    identityPath: name
  parent:
    source: product-api
    nativeType: discoveryengine.googleapis.com/Engine
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  displayName:
    path: displayName
    type: string
  createTime:
    path: createTime
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: discoveryengine.googleapis.com/Engine
  targetIdPath: refs_discoveryengine_googleapis_com_Engine
actions:
  delete:
    operation: discoveryengine.projects.locations.collections.engines.assistants.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read: *id001
