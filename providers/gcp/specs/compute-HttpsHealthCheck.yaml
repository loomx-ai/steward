schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/HttpsHealthCheck
  class: network.health_check
presentation:
  displayNames:
    en-US: Legacy HTTPS health check
    zh-CN: 旧版 HTTPS 健康检查
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: global
discovery:
  source: product-api
  detail:
    operation: compute.httpsHealthChecks.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.httpsHealthChecks.list
    parameters:
      project: scope.project
    itemsPath: items
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  state:
    path: status
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  labels:
    path: labels
    type: object
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: compute.httpsHealthChecks.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.httpsHealthChecks.get
      itemsPath: $
      identityPath: name
