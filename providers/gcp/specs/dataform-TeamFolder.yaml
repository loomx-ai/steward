schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: dataform.googleapis.com/TeamFolder
  class: data.folder
presentation:
  displayNames:
    en-US: Dataform team folder
    zh-CN: Dataform 团队文件夹
  consoleLinkTemplate: https://console.cloud.google.com/bigquery?project={projectId}
scope:
  kind: region
discovery:
  source: dataform-visible
  list:
    operation: dataform.projects.locations.teamFolders.search
    parameters:
      location: scope.locationParent
    itemsPath: results
    identityPath: teamFolder.name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: dataform.projects.locations.teamFolders.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  displayName:
    path: displayName
    type: string
  projectId:
    path: project_id
    type: string
  createTime:
    path: createTime
    type: string
  updateTime:
    path: updateTime
    type: string
  creatorIamPrincipal:
    path: creatorIamPrincipal
    type: string
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: dataform.projects.locations.teamFolders.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: dataform.projects.locations.teamFolders.get
      itemsPath: $
      identityPath: name
