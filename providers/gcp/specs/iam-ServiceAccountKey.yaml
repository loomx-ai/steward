schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: iam.googleapis.com/ServiceAccountKey
  class: security.key_pair
presentation:
  displayNames:
    en-US: IAM service account key
    zh-CN: IAM 服务账号密钥
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: iam.projects.serviceAccounts.keys.list
    parameters:
      name: parent.nativeId
    itemsPath: keys
    identityPath: name
  detail:
    operation: iam.projects.serviceAccounts.keys.get
    itemsPath: $
    identityPath: name
  parent:
    source: product-api
    nativeType: iam.googleapis.com/ServiceAccount
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  keyType:
    path: keyType
    type: string
  keyAlgorithm:
    path: keyAlgorithm
    type: string
  keyOrigin:
    path: keyOrigin
    type: string
  validAfterTime:
    path: validAfterTime
    type: string
  validBeforeTime:
    path: validBeforeTime
    type: string
  disabled:
    path: disabled
    type: boolean
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: iam.googleapis.com/ServiceAccount
  targetIdPath: refs_iam_googleapis_com_ServiceAccount
actions:
  delete:
    operation: iam.projects.serviceAccounts.keys.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: iam.projects.serviceAccounts.keys.get
      itemsPath: $
      identityPath: name
    preconditions:
    - path: keyType
      allowedValues:
      - USER_MANAGED
      reason: system_managed_service_account_key
