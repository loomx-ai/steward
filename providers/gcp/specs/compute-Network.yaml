schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/Network
  class: network.vpc
presentation:
  displayNames:
    en-US: VPC network
    zh-CN: VPC 网络
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: global
discovery:
  source: product-api
  detail:
    operation: compute.networks.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.networks.list
    parameters:
      project: scope.project
    itemsPath: items
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: compute.networks.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.networks.get
      itemsPath: $
      identityPath: name
