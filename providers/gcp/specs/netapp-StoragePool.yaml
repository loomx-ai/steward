schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: netapp.googleapis.com/StoragePool
  class: storage.pool
presentation:
  displayNames:
    en-US: NetApp Volumes storage pool
    zh-CN: NetApp Volumes 存储池
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: netapp.projects.locations.storagePools.list
    parameters:
      parent: scope.locationParent
    itemsPath: storagePools
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: netapp.projects.locations.storagePools.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  network:
    path: network
    type: string
  serviceLevel:
    path: serviceLevel
    type: string
  capacityGib:
    path: capacityGib
    type: string
  volumeCount:
    path: volumeCount
    type: number
extensions:
  hook: gcp.resource
relationships:
- type: member_of
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
actions:
  delete:
    operation: netapp.projects.locations.storagePools.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: netapp.projects.locations.storagePools.get
      itemsPath: $
      identityPath: name
