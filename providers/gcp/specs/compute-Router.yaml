schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/Router
  class: network.router
presentation:
  displayNames:
    en-US: Cloud Router
    zh-CN: Cloud Router 路由器
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: cloud-asset-inventory
  detail:
    operation: compute.routers.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  state:
    path: status
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  labels:
    path: labels
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: member_of
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: member_of
  targetType: compute.googleapis.com/Subnetwork
  targetIdPath: refs_compute_googleapis_com_Subnetwork
actions:
  delete:
    operation: compute.routers.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.routers.get
      itemsPath: $
      identityPath: name
