schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: tpu.googleapis.com/Reservation
  class: compute.reservation
presentation:
  displayNames:
    en-US: Cloud TPU reservation
    zh-CN: Cloud TPU 预留容量
  consoleLinkTemplate: https://console.cloud.google.com/compute/tpus?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: tpu.projects.locations.reservations.list
    parameters:
      parent: scope.locationParent
    itemsPath: reservations
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: tpu.projects.locations.reservations.list
    itemsPath: reservations
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
extensions:
  hook: gcp.resource
