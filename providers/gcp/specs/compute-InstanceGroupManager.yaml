schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/InstanceGroupManager
  class: compute.scaling_group
presentation:
  displayNames:
    en-US: Managed instance group
    zh-CN: 托管实例组
  consoleLinkTemplate: https://console.cloud.google.com/compute/instanceGroups?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.instanceGroupManagers.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.instanceGroupManagers.aggregatedList
    parameters:
      project: scope.project
    itemsPath: items.*.instanceGroupManagers
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  targetSize:
    path: targetSize
    type: number
  isStable:
    path: status.isStable
    type: boolean
  statefulPolicy:
    path: statefulPolicy
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: created_from
  targetType: compute.googleapis.com/InstanceTemplate
  targetIdPath: refs_compute_googleapis_com_InstanceTemplate
- type: uses
  targetType: compute.googleapis.com/HealthCheck
  targetIdPath: refs_compute_googleapis_com_HealthCheck
actions:
  delete:
    operation: compute.instanceGroupManagers.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.instanceGroupManagers.get
      itemsPath: $
      identityPath: name
