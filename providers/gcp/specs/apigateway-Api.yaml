schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: apigateway.googleapis.com/Api
  class: network.api
presentation:
  displayNames:
    en-US: API Gateway API
    zh-CN: API Gateway API
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: apigateway.projects.locations.apis.list
    parameters:
      parent: scope.locationParent
    itemsPath: apis
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: apigateway.projects.locations.apis.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  displayName:
    path: displayName
    type: string
  managedService:
    path: managedService
    type: string
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: apigateway.projects.locations.apis.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: apigateway.projects.locations.apis.get
      itemsPath: $
      identityPath: name
