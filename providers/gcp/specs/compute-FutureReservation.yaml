schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/FutureReservation
  class: compute.elasticity_assurance
presentation:
  displayNames:
    en-US: Future reservation
    zh-CN: 未来容量预留
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.futureReservations.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.futureReservations.aggregatedList
    parameters:
      project: scope.project
      includeAllScopes: true
    itemsPath: items.*.futureReservations
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  state:
    path: status.procurementStatus
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  resourceId:
    path: id
    type: string
  description:
    path: description
    type: string
  createdAt:
    path: creationTimestamp
    type: string
  planningStatus:
    path: planningStatus
    type: string
  timeWindow:
    path: timeWindow
    type: object
  specificSkuProperties:
    path: specificSkuProperties
    type: object
  shareSettings:
    path: shareSettings
    type: object
  autoDeleteAutoCreatedReservations:
    path: autoDeleteAutoCreatedReservations
    type: boolean
  statusDetails:
    path: status
    type: object
  requestedInstanceCount:
    path: specificSkuProperties.totalCount
    type: string
  fulfilledCount:
    path: status.fulfilledCount
    type: string
  lockTime:
    path: status.lockTime
    type: string
  amendmentStatus:
    path: status.amendmentStatus
    type: string
  autoCreatedReservations:
    path: status.autoCreatedReservations
    type: array
  existingMatchingUsageInfo:
    path: status.existingMatchingUsageInfo
    type: object
  resolvedSkuProperties:
    path: status.specificSkuProperties
    type: object
  lastKnownGoodState:
    path: status.lastKnownGoodState
    type: object
  storagePoolProvisionedCapacity:
    path: status.storagePoolProvisionedCapacity
    type: object
  exapoolProvisionedCapacityGb:
    path: status.exapoolProvisionedCapacityGb
    type: object
  storagePoolProperties:
    path: storagePoolProperties
    type: object
  aggregateReservation:
    path: aggregateReservation
    type: object
  commitmentInfo:
    path: commitmentInfo
    type: object
  autoCreatedReservationsDeleteTime:
    path: autoCreatedReservationsDeleteTime
    type: string
  autoCreatedReservationsDuration:
    path: autoCreatedReservationsDuration
    type: object
  reservationMode:
    path: reservationMode
    type: string
  reservationName:
    path: reservationName
    type: string
  specificReservationRequired:
    path: specificReservationRequired
    type: boolean
  schedulingType:
    path: schedulingType
    type: string
  deploymentType:
    path: deploymentType
    type: string
  namePrefix:
    path: namePrefix
    type: string
  confidentialComputeType:
    path: confidentialComputeType
    type: string
  enableEmergentMaintenance:
    path: enableEmergentMaintenance
    type: boolean
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: compute.futureReservations.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.futureReservations.get
      itemsPath: $
      identityPath: name
