schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: notebooks.googleapis.com/Instance
  class: ai.workbench_instance
presentation:
  displayNames:
    en-US: Vertex AI Workbench instance
    zh-CN: Vertex AI Workbench 实例
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: notebooks.projects.locations.instances.list
    parameters:
      parent: scope.allLocationsParent
    itemsPath: instances
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: notebooks.projects.locations.instances.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  creator:
    path: creator
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  gceSetup:
    path: gceSetup
    type: object
  enableDeletionProtection:
    path: enableDeletionProtection
    type: boolean
extensions:
  hook: gcp.resource
relationships:
- type: member_of
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: member_of
  targetType: compute.googleapis.com/Subnetwork
  targetIdPath: refs_compute_googleapis_com_Subnetwork
- type: uses
  targetType: iam.googleapis.com/ServiceAccount
  targetIdPath: refs_iam_googleapis_com_ServiceAccount
actions:
  delete:
    operation: notebooks.projects.locations.instances.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: notebooks.projects.locations.instances.get
      itemsPath: $
      identityPath: name
