schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: discoveryengine.googleapis.com/Document
  class: data.document
presentation:
  displayNames:
    en-US: Discovery Engine Document
    zh-CN: Discovery Engine 文档
  consoleLinkTemplate: https://console.cloud.google.com/gen-app-builder/engines?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: discoveryengine.projects.locations.collections.dataStores.branches.documents.list
    parameters:
      parent: parent.nativeId
    itemsPath: documents
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail: &id001
    operation: discoveryengine.projects.locations.collections.dataStores.branches.documents.get
    itemsPath: $
    identityPath: name
  parent:
    source: product-api
    nativeType: discoveryengine.googleapis.com/Branch
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  displayName:
    path: displayName
    type: string
  createTime:
    path: createTime
    type: string
  state:
    path: state
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: discoveryengine.googleapis.com/Schema
  targetIdPath: refs_discoveryengine_googleapis_com_Schema
- type: depends_on
  targetType: discoveryengine.googleapis.com/Branch
  targetIdPath: refs_discoveryengine_googleapis_com_Branch
actions:
  delete:
    operation: discoveryengine.projects.locations.collections.dataStores.branches.documents.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read: *id001
