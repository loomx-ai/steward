schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: certificatemanager.googleapis.com/Certificate
  class: security.certificate
presentation:
  displayNames:
    en-US: Certificate Manager certificate
    zh-CN: 证书管理器证书
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: certificatemanager.projects.locations.certificates.list
    parameters:
      parent: scope.locationParent
    itemsPath: certificates
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: certificatemanager.projects.locations.certificates.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  description:
    path: description
    type: string
  scope:
    path: scope
    type: string
  managed:
    path: managed
    type: object
  sanDnsnames:
    path: sanDnsnames
    type: array
  expireTime:
    path: expireTime
    type: string
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: certificatemanager.projects.locations.certificates.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: certificatemanager.projects.locations.certificates.get
      itemsPath: $
      identityPath: name
