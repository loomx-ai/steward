schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: netapp.googleapis.com/Volume
  class: storage.file_system
presentation:
  displayNames:
    en-US: NetApp Volumes volume
    zh-CN: NetApp Volumes 卷
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: netapp.projects.locations.volumes.list
    parameters:
      parent: scope.locationParent
    itemsPath: volumes
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: netapp.projects.locations.volumes.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  storagePool:
    path: storagePool
    type: string
  network:
    path: network
    type: string
  capacityGib:
    path: capacityGib
    type: string
  shareName:
    path: shareName
    type: string
  protocols:
    path: protocols
    type: array
  hasReplication:
    path: hasReplication
    type: boolean
extensions:
  hook: gcp.resource
relationships:
- type: member_of
  targetType: netapp.googleapis.com/StoragePool
  targetIdPath: refs_netapp_googleapis_com_StoragePool
- type: member_of
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
actions:
  delete:
    operation: netapp.projects.locations.volumes.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: netapp.projects.locations.volumes.get
      itemsPath: $
      identityPath: name
