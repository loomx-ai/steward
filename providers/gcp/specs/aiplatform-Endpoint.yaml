schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: aiplatform.googleapis.com/Endpoint
  class: ai.endpoint
presentation:
  displayNames:
    en-US: Vertex AI endpoint
    zh-CN: Vertex AI 端点
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: aiplatform.projects.locations.endpoints.list
    parameters:
      parent: scope.locationParent
    itemsPath: endpoints
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: aiplatform.projects.locations.endpoints.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  labels:
    path: labels
    type: object
  etag:
    path: etag
    type: string
  createTime:
    path: createTime
    type: string
  displayName:
    path: displayName
    type: string
  deployedModels:
    path: deployedModels
    type: array
  network:
    path: network
    type: string
  encryptionSpec:
    path: encryptionSpec
    type: object
  privateServiceConnectConfig:
    path: privateServiceConnectConfig
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: depends_on
  targetType: cloudkms.googleapis.com/CryptoKey
  targetIdPath: refs_cloudkms_googleapis_com_CryptoKey
actions:
  delete:
    operation: aiplatform.projects.locations.endpoints.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: aiplatform.projects.locations.endpoints.get
      itemsPath: $
      identityPath: name
