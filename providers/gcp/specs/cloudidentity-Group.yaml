schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: cloudidentity.googleapis.com/Group
  class: identity.group
presentation:
  displayNames:
    en-US: Cloud Identity group
    zh-CN: Cloud Identity 身份组
scope:
  kind: global
discovery:
  source: identity-groups-visible
  list:
    operation: cloudidentity.groups.list
    itemsPath: groups
    identityPath: name
  detail: &read
    operation: cloudidentity.groups.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  displayName:
    path: displayName
    type: string
  createTime:
    path: createTime
    type: string
  updateTime:
    path: updateTime
    type: string
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: cloudidentity.groups.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read: *read
