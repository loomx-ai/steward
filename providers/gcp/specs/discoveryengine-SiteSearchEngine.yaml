schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: discoveryengine.googleapis.com/SiteSearchEngine
  class: search.site_configuration
presentation:
  displayNames:
    en-US: Discovery Engine SiteSearchEngine
    zh-CN: Discovery Engine 网站搜索配置
  consoleLinkTemplate: https://console.cloud.google.com/gen-app-builder/engines?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: discoveryengine.projects.locations.collections.dataStores.getSiteSearchEngine
    parameters:
      name: parent.normalized._discoveryengine_site_name
    itemsPath: $
    identityPath: name
  detail:
    operation: discoveryengine.projects.locations.collections.dataStores.getSiteSearchEngine
    itemsPath: $
    identityPath: name
  parent:
    source: product-api
    nativeType: discoveryengine.googleapis.com/DataStore
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: discoveryengine.googleapis.com/DataStore
  targetIdPath: refs_discoveryengine_googleapis_com_DataStore
