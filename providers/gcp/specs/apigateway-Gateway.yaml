schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: apigateway.googleapis.com/Gateway
  class: network.api_gateway
presentation:
  displayNames:
    en-US: API Gateway gateway
    zh-CN: API Gateway 网关
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: apigateway.projects.locations.gateways.list
    parameters:
      parent: scope.locationParent
    itemsPath: gateways
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: apigateway.projects.locations.gateways.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  displayName:
    path: displayName
    type: string
  apiConfig:
    path: apiConfig
    type: string
  defaultHostname:
    path: defaultHostname
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: apigateway.googleapis.com/ApiConfig
  targetIdPath: refs_apigateway_googleapis_com_ApiConfig
actions:
  delete:
    operation: apigateway.projects.locations.gateways.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: apigateway.projects.locations.gateways.get
      itemsPath: $
      identityPath: name
