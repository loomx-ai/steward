schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: networkmanagement.googleapis.com/VpcFlowLogsConfig
  class: observability.flow_log
presentation:
  displayNames:
    en-US: VPC Flow Logs configuration
    zh-CN: VPC 流日志配置
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: networkmanagement.projects.locations.vpcFlowLogsConfigs.list
    parameters:
      parent: scope.locationParent
    itemsPath: vpcFlowLogsConfigs
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: networkmanagement.projects.locations.vpcFlowLogsConfigs.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  description:
    path: description
    type: string
  network:
    path: network
    type: string
  subnet:
    path: subnet
    type: string
  vpnTunnel:
    path: vpnTunnel
    type: string
  interconnectAttachment:
    path: interconnectAttachment
    type: string
  aggregationInterval:
    path: aggregationInterval
    type: string
  flowSampling:
    path: flowSampling
    type: number
  metadata:
    path: metadata
    type: string
  filterExpr:
    path: filterExpr
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: depends_on
  targetType: compute.googleapis.com/Subnetwork
  targetIdPath: refs_compute_googleapis_com_Subnetwork
- type: depends_on
  targetType: compute.googleapis.com/VpnTunnel
  targetIdPath: refs_compute_googleapis_com_VpnTunnel
- type: depends_on
  targetType: compute.googleapis.com/InterconnectAttachment
  targetIdPath: refs_compute_googleapis_com_InterconnectAttachment
actions:
  delete:
    operation: networkmanagement.projects.locations.vpcFlowLogsConfigs.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: networkmanagement.projects.locations.vpcFlowLogsConfigs.get
      itemsPath: $
      identityPath: name
