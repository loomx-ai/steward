schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: workstations.googleapis.com/WorkstationCluster
  class: network.virtual_desktop_network
presentation:
  displayNames:
    en-US: Workstation cluster
    zh-CN: 工作站集群
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: workstations.projects.locations.workstationClusters.list
    parameters:
      parent: scope.locationParent
    itemsPath: workstationClusters
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: workstations.projects.locations.workstationClusters.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  updateTime:
    path: updateTime
    type: string
  network:
    path: network
    type: string
  subnetwork:
    path: subnetwork
    type: string
  reconciling:
    path: reconciling
    type: boolean
extensions:
  hook: gcp.resource
relationships:
- type: member_of
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: member_of
  targetType: compute.googleapis.com/Subnetwork
  targetIdPath: refs_compute_googleapis_com_Subnetwork
actions:
  delete:
    operation: workstations.projects.locations.workstationClusters.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: workstations.projects.locations.workstationClusters.get
      itemsPath: $
      identityPath: name
