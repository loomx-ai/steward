schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/InstanceGroup
  class: compute.instance_group
presentation:
  displayNames:
    en-US: Instance group
    zh-CN: 实例组
  consoleLinkTemplate: https://console.cloud.google.com/compute/instanceGroups?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.instanceGroups.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.instanceGroups.aggregatedList
    parameters:
      project: scope.project
    itemsPath: items.*.instanceGroups
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  size:
    path: size
    type: number
extensions:
  hook: gcp.resource
relationships:
- type: member_of
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: member_of
  targetType: compute.googleapis.com/Subnetwork
  targetIdPath: refs_compute_googleapis_com_Subnetwork
actions:
  delete:
    operation: compute.instanceGroups.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.instanceGroups.get
      itemsPath: $
      identityPath: name
