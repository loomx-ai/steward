schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: clouddeploy.googleapis.com/Automation
  class: devops.automation
presentation:
  displayNames:
    en-US: Cloud Deploy automation
    zh-CN: Cloud Deploy 自动化
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  parent:
    nativeType: clouddeploy.googleapis.com/DeliveryPipeline
    source: product-api
  list:
    operation: clouddeploy.projects.locations.deliveryPipelines.automations.list
    parameters:
      parent: parent.nativeId
    itemsPath: automations
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: clouddeploy.projects.locations.deliveryPipelines.automations.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  uid:
    path: uid
    type: string
  etag:
    path: etag
    type: string
  createTime:
    path: createTime
    type: string
  suspended:
    path: suspended
    type: boolean
  serviceAccount:
    path: serviceAccount
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: clouddeploy.googleapis.com/DeliveryPipeline
  targetIdPath: refs_clouddeploy_googleapis_com_DeliveryPipeline
- type: uses
  targetType: iam.googleapis.com/ServiceAccount
  targetIdPath: refs_iam_googleapis_com_ServiceAccount
actions:
  delete:
    operation: clouddeploy.projects.locations.deliveryPipelines.automations.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: clouddeploy.projects.locations.deliveryPipelines.automations.get
      itemsPath: $
      identityPath: name
