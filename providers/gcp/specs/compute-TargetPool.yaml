schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/TargetPool
  class: network.target_pool
presentation:
  displayNames:
    en-US: Target pool
    zh-CN: 目标池
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.targetPools.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.targetPools.aggregatedList
    parameters:
      project: scope.project
    itemsPath: items.*.targetPools
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: compute.targetPools.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.targetPools.get
      itemsPath: $
      identityPath: name
relationships:
- type: depends_on
  targetType: compute.googleapis.com/Instance
  targetIdPath: refs_compute_googleapis_com_Instance
- type: depends_on
  targetType: compute.googleapis.com/HttpHealthCheck
  targetIdPath: refs_compute_googleapis_com_HttpHealthCheck
