schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: artifactregistry.googleapis.com/Repository
  class: storage.registry
presentation:
  displayNames:
    en-US: Artifact Registry repository
    zh-CN: 制品库
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: artifactregistry.projects.locations.repositories.get
    itemsPath: $
    identityPath: name
  list:
    operation: artifactregistry.projects.locations.repositories.list
    parameters:
      parent: scope.locationParent
    itemsPath: repositories
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  updateTime:
    path: updateTime
    type: string
  format:
    path: format
    type: string
  mode:
    path: mode
    type: string
  sizeBytes:
    path: sizeBytes
    type: string
extensions:
  hook: gcp.resource
actions:
  delete:
    operation: artifactregistry.projects.locations.repositories.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: artifactregistry.projects.locations.repositories.get
      itemsPath: $
      identityPath: name
