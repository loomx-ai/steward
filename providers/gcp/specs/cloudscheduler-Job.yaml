schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: cloudscheduler.googleapis.com/Job
  class: orchestration.schedule
presentation:
  displayNames:
    en-US: Cloud Scheduler job
    zh-CN: Cloud Scheduler 作业
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: cloudscheduler.projects.locations.jobs.list
    parameters:
      parent: scope.locationParent
    itemsPath: jobs
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: cloudscheduler.projects.locations.jobs.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  schedule:
    path: schedule
    type: string
  timeZone:
    path: timeZone
    type: string
  pubsubTarget:
    path: pubsubTarget
    type: object
  httpTarget:
    path: httpTarget
    type: object
  appEngineHttpTarget:
    path: appEngineHttpTarget
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: uses
  targetType: pubsub.googleapis.com/Topic
  targetIdPath: refs_pubsub_googleapis_com_Topic
- type: uses
  targetType: iam.googleapis.com/ServiceAccount
  targetIdPath: refs_iam_googleapis_com_ServiceAccount
actions:
  delete:
    operation: cloudscheduler.projects.locations.jobs.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: cloudscheduler.projects.locations.jobs.get
      itemsPath: $
      identityPath: name
