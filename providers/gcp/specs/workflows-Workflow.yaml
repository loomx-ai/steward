schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: workflows.googleapis.com/Workflow
  class: orchestration.workflow
presentation:
  displayNames:
    en-US: Workflow
    zh-CN: 工作流
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: workflows.projects.locations.workflows.list
    parameters:
      parent: scope.locationParent
    itemsPath: workflows
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: workflows.projects.locations.workflows.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  state:
    path: state
    type: string
  revisionId:
    path: revisionId
    type: string
  labels:
    path: labels
    type: object
  createTime:
    path: createTime
    type: string
  serviceAccount:
    path: serviceAccount
    type: string
  cryptoKeyName:
    path: cryptoKeyName
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: uses
  targetType: iam.googleapis.com/ServiceAccount
  targetIdPath: refs_iam_googleapis_com_ServiceAccount
- type: uses
  targetType: cloudkms.googleapis.com/CryptoKey
  targetIdPath: refs_cloudkms_googleapis_com_CryptoKey
actions:
  delete:
    operation: workflows.projects.locations.workflows.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: workflows.projects.locations.workflows.get
      itemsPath: $
      identityPath: name
