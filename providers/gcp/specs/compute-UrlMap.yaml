schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/UrlMap
  class: network.url_map
presentation:
  displayNames:
    en-US: URL map
    zh-CN: URL 映射
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.urlMaps.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.urlMaps.aggregatedList
    parameters:
      project: scope.project
    itemsPath: items.*.urlMaps
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  state:
    path: status
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  labels:
    path: labels
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: uses
  targetType: compute.googleapis.com/BackendService
  targetIdPath: refs_compute_googleapis_com_BackendService
- type: uses
  targetType: compute.googleapis.com/RegionBackendService
  targetIdPath: refs_compute_googleapis_com_RegionBackendService
- type: depends_on
  targetType: compute.googleapis.com/BackendBucket
  targetIdPath: refs_compute_googleapis_com_BackendBucket
actions:
  delete:
    operation: compute.urlMaps.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.urlMaps.get
      itemsPath: $
      identityPath: name
