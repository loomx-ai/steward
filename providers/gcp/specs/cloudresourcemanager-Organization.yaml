schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: cloudresourcemanager.googleapis.com/Organization
  class: identity.resource_directory
presentation:
  displayNames:
    en-US: Google Cloud organization
    zh-CN: Google Cloud 组织
scope:
  kind: global
discovery:
  source: organization-ancestry
  list:
    operation: cloudresourcemanager.organizations.get
    itemsPath: $
    identityPath: name
  detail:
    operation: cloudresourcemanager.organizations.get
    itemsPath: $
    identityPath: name
fields:
  name:
    path: name
    type: string
  displayName:
    path: displayName
    type: string
  state:
    path: state
    type: string
  createTime:
    path: createTime
    type: string
  updateTime:
    path: updateTime
    type: string
  directoryCustomerId:
    path: directoryCustomerId
    type: string
