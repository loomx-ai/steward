schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: discoveryengine.googleapis.com/Session
  class: search.session
presentation:
  displayNames:
    en-US: Discovery Engine Session
    zh-CN: Discovery Engine 会话
  consoleLinkTemplate: https://console.cloud.google.com/gen-app-builder/engines?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: discoveryengine.projects.locations.collections.dataStores.sessions.list
    parameters:
      parent: parent.nativeId
    itemsPath: sessions
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail: &id001
    operation: discoveryengine.projects.locations.collections.dataStores.sessions.get
    itemsPath: $
    identityPath: name
  parent:
    source: product-api
    nativeType: discoveryengine.googleapis.com/DataStore
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  displayName:
    path: displayName
    type: string
  state:
    path: state
    type: string
  startTime:
    path: startTime
    type: string
  endTime:
    path: endTime
    type: string
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: discoveryengine.googleapis.com/DataStore
  targetIdPath: refs_discoveryengine_googleapis_com_DataStore
- type: depends_on
  targetType: discoveryengine.googleapis.com/Engine
  targetIdPath: refs_discoveryengine_googleapis_com_Engine
actions:
  delete:
    operation: discoveryengine.projects.locations.collections.dataStores.sessions.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read: *id001
