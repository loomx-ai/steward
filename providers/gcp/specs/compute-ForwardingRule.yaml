schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: compute.googleapis.com/ForwardingRule
  class: network.load_balancer
presentation:
  displayNames:
    en-US: Regional forwarding rule
    zh-CN: 区域转发规则
  consoleLinkTemplate: https://console.cloud.google.com/home/dashboard?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  detail:
    operation: compute.forwardingRules.get
    itemsPath: $
    identityPath: name
  list:
    operation: compute.forwardingRules.list
    parameters:
      region: scope.location
      project: scope.project
    itemsPath: items
    identityPath: selfLink
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: maxResults
      maxPageSize: 500
fields:
  name:
    path: name
    type: string
  state:
    path: status
    type: string
  projectId:
    path: project_id
    type: string
  zoneId:
    path: zone_id
    type: string
  labels:
    path: labels
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: member_of
  targetType: compute.googleapis.com/Network
  targetIdPath: refs_compute_googleapis_com_Network
- type: member_of
  targetType: compute.googleapis.com/Subnetwork
  targetIdPath: refs_compute_googleapis_com_Subnetwork
- type: uses
  targetType: compute.googleapis.com/BackendService
  targetIdPath: refs_compute_googleapis_com_BackendService
- type: uses
  targetType: compute.googleapis.com/RegionBackendService
  targetIdPath: refs_compute_googleapis_com_RegionBackendService
- type: uses
  targetType: compute.googleapis.com/TargetHttpProxy
  targetIdPath: refs_compute_googleapis_com_TargetHttpProxy
- type: uses
  targetType: compute.googleapis.com/TargetHttpsProxy
  targetIdPath: refs_compute_googleapis_com_TargetHttpsProxy
- type: depends_on
  targetType: compute.googleapis.com/ServiceAttachment
  targetIdPath: refs_compute_googleapis_com_ServiceAttachment
- type: depends_on
  targetType: compute.googleapis.com/TargetTcpProxy
  targetIdPath: refs_compute_googleapis_com_TargetTcpProxy
- type: depends_on
  targetType: compute.googleapis.com/TargetSslProxy
  targetIdPath: refs_compute_googleapis_com_TargetSslProxy
- type: depends_on
  targetType: compute.googleapis.com/TargetVpnGateway
  targetIdPath: refs_compute_googleapis_com_TargetVpnGateway
actions:
  delete:
    operation: compute.forwardingRules.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: compute.forwardingRules.get
      itemsPath: $
      identityPath: name
