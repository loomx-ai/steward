schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: gcp
  nativeType: dataform.googleapis.com/Workspace
  class: data.workspace
presentation:
  displayNames:
    en-US: Dataform workspace
    zh-CN: Dataform 工作区
  consoleLinkTemplate: https://console.cloud.google.com/bigquery/dataform?project={projectId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: dataform.projects.locations.repositories.workspaces.list
    parameters:
      parent: parent.nativeId
    itemsPath: workspaces
    identityPath: name
    pagination:
      type: token
      tokenParameter: pageToken
      tokenPath: nextPageToken
      pageSizeParameter: pageSize
      maxPageSize: 100
  detail:
    operation: dataform.projects.locations.repositories.workspaces.get
    itemsPath: $
    identityPath: name
  parent:
    source: product-api
    nativeType: dataform.googleapis.com/Repository
fields:
  name:
    path: name
    type: string
  projectId:
    path: project_id
    type: string
  createTime:
    path: createTime
    type: string
  disableMoves:
    path: disableMoves
    type: boolean
  privateResourceMetadata:
    path: privateResourceMetadata
    type: object
extensions:
  hook: gcp.resource
relationships:
- type: depends_on
  targetType: dataform.googleapis.com/Repository
  targetIdPath: refs_dataform_googleapis_com_Repository
actions:
  delete:
    operation: dataform.projects.locations.repositories.workspaces.delete
    idempotency: readback
    waiter: gcp_operation
    readback: gcp_absent
    read:
      operation: dataform.projects.locations.repositories.workspaces.get
      itemsPath: $
      identityPath: name
