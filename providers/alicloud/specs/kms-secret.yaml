schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::KMS::Secret
  class: security.secret
presentation:
  consoleLinkTemplate: "https://kms.console.aliyun.com/{regionId}/secret/detail?secretName={nativeId}"
  displayNames:
    zh-CN: KMS 凭据
    en-US: KMS Secret
  icon: shield
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: AlibabaCloud.KMS.ListSecrets
    itemsPath: SecretList.Secret
    identityPath: SecretName
    pagination:
      type: page-number
      pageParameter: PageNumber
      pageSizeParameter: PageSize
      totalPath: TotalCount
      maxPageSize: 100
  enrich:
    operation: AlibabaCloud.KMS.DescribeSecret
    parameters:
      SecretName: resources.nativeId
    itemsPath: $
    identityPath: SecretName
    maxBatchSize: 1
fields:
  name: SecretName
  createdAt: CreateTime
  updatedAt: UpdateTime
  secretType: SecretType
  owingService: OwingService
  plannedDeleteTime: PlannedDeleteTime
  encryptionKeyId: EncryptionKeyId
  dkmsInstanceId: DKMSInstanceId
relationships:
  - type: uses
    targetType: ACS::KMS::Key
    targetIdPath: encryptionKeyId
actions:
  delete:
    operation: AlibabaCloud.KMS.DeleteSecret
    parameters:
      SecretName: resource.nativeId
      RecoveryWindowInDays: "7"
    preconditions:
      - path: OwingService
        allowedValues: [""]
        reason: a secret owned by a cloud service is managed by that service
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.KMS.DescribeSecret
      parameters:
        SecretName: resource.nativeId
      itemsPath: $
      identityPath: SecretName
