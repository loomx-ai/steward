schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::CEN::TransitRouterEcrAttachment
  class: network.cen_attachment
presentation:
  consoleLinkTemplate: "https://cen.console.aliyun.com/cen/attachment/{regionId}"
  displayNames:
    zh-CN: CEN ECR 连接
    en-US: CEN ECR Attachment
  icon: network
scope:
  kind: region
discovery:
  source: cen-topology
  list:
    operation: AlibabaCloud.CEN.ListTransitRouterEcrAttachments
    itemsPath: TransitRouterAttachments
    identityPath: TransitRouterAttachmentId
    statePath: Status
fields:
  name: TransitRouterAttachmentName
  state: Status
  createdAt: CreationTime
  regionId: EcrRegionId
  cenId: CenId
  transitRouterId: TransitRouterId
  ecrId: EcrId
actions:
  delete:
    operation: AlibabaCloud.CEN.DeleteTransitRouterEcrAttachment
    parameters:
      TransitRouterAttachmentId: resource.nativeId
      DryRun: false
      Force: true
    idempotency: provider_token
    waiter: absent
    pollIntervalSeconds: 5
    deletionCheckTimeoutSeconds: 600
    read:
      operation: AlibabaCloud.CEN.ListTransitRouterEcrAttachments
      parameters:
        TransitRouterId: resource.normalized.transitRouterId
        TransitRouterAttachmentId: resource.nativeId
        MaxResults: 20
      itemsPath: TransitRouterAttachments
      identityPath: TransitRouterAttachmentId
      statePath: Status
