schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::SLB::VServerGroup
  class: network.target_group
presentation:
  consoleLinkTemplate: "https://slb.console.aliyun.com/slb/{regionId}/slbs/{parentId}/vgroups"
  displayNames:
    zh-CN: CLB 虚拟服务器组
    en-US: CLB Virtual Server Group
  icon: network
scope:
  kind: region
discovery:
  source: product-api
  parent:
    operation: AlibabaCloud.SLB.DescribeLoadBalancers
    parameters:
      RegionId: scope.location
    itemsPath: LoadBalancers.LoadBalancer
    identityPath: LoadBalancerId
    pagination:
      type: page-number
      pageParameter: PageNumber
      pageSizeParameter: PageSize
      totalPath: TotalCount
      maxPageSize: 100
  list:
    operation: AlibabaCloud.SLB.DescribeVServerGroups
    parameters:
      RegionId: scope.location
      LoadBalancerId: parent.nativeId
    itemsPath: VServerGroups.VServerGroup
    identityPath: VServerGroupId
fields:
  name: VServerGroupName
  createdAt: CreateTime
  loadBalancerId: _parent.nativeId
  serverCount: ServerCount
relationships:
  - type: member_of
    targetType: ACS::SLB::LoadBalancer
    targetIdPath: loadBalancerId
actions:
  delete:
    operation: AlibabaCloud.SLB.DeleteVServerGroup
    parameters:
      RegionId: scope.location
      VServerGroupId: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.SLB.DescribeVServerGroupAttribute
      parameters:
        RegionId: scope.location
        VServerGroupId: resource.nativeId
      itemsPath: $
      identityPath: VServerGroupId
