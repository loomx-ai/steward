schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::VPC::VSwitch
  class: network.subnet
presentation:
  consoleLinkTemplate: "https://vpc.console.aliyun.com/vpc/{regionId}/switches/{nativeId}"
  icon: network
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: DescribeVSwitches
    parameters:
      RegionId: scope.location
    itemsPath: VSwitches.VSwitch
    identityPath: VSwitchId
    statePath: Status
    pagination:
      type: page-number
      pageParameter: PageNumber
      pageSizeParameter: PageSize
      totalPath: TotalCount
      maxPageSize: 50
fields:
  name: VSwitchName
  state: Status
  createdAt: CreationTime
  vpc_id: VpcId
  zone_id: ZoneId
relationships:
  - type: member_of
    targetType: ACS::VPC::VPC
    targetIdPath: vpc_id
actions:
  delete:
    operation: DeleteVSwitch
    parameters:
      RegionId: scope.location
      VSwitchId: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: DescribeVSwitches
      parameters:
        RegionId: scope.location
        VSwitchId: resource.nativeId
        PageSize: 1
      itemsPath: VSwitches.VSwitch
      identityPath: VSwitchId
      statePath: Status
