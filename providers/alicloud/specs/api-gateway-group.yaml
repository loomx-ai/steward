schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::ApiGateway::Group
  class: network.api_group
presentation:
  consoleLinkTemplate: "https://apigateway.console.aliyun.com/#/{regionId}/groups/detail/{nativeId}"
  displayNames:
    zh-CN: API 网关分组
    en-US: API Gateway API Group
  icon: network
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: AlibabaCloud.ApiGateway.DescribeApiGroups
    itemsPath: ApiGroupAttributes.ApiGroupAttribute
    identityPath: GroupId
    pagination:
      type: page-number
      pageParameter: PageNumber
      pageSizeParameter: PageSize
      totalPath: TotalCount
      maxPageSize: 50
fields:
  name: GroupName
  createdAt: CreatedTime
  updatedAt: ModifiedTime
  instanceId: InstanceId
  instanceType: InstanceType
  subDomain: SubDomain
  billingStatus: BillingStatus
  illegalStatus: IllegalStatus
relationships:
  - type: member_of
    targetType: ACS::ApiGateway::Instance
    targetIdPath: instanceId
actions:
  delete:
    operation: AlibabaCloud.ApiGateway.DeleteApiGroup
    parameters:
      GroupId: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.ApiGateway.DescribeApiGroups
      parameters:
        GroupId: resource.nativeId
        PageSize: 50
      itemsPath: ApiGroupAttributes.ApiGroupAttribute
      identityPath: GroupId
      pagination:
        type: page-number
        pageParameter: PageNumber
        pageSizeParameter: PageSize
        totalPath: TotalCount
        maxPageSize: 50
