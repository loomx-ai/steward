schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::CEN::TrafficMarkingPolicy
  class: network.traffic_marking_policy
presentation:
  consoleLinkTemplate: "https://cen.console.aliyun.com/cen/attachment/{regionId}"
  displayNames:
    zh-CN: CEN 流量标记策略
    en-US: CEN Traffic Marking Policy
  icon: network
scope:
  kind: region
discovery:
  source: cen-topology
  list:
    operation: AlibabaCloud.CEN.ListTrafficMarkingPolicies
    itemsPath: TrafficMarkingPolicies
    identityPath: TrafficMarkingPolicyId
    statePath: TrafficMarkingPolicyStatus
fields:
  name: TrafficMarkingPolicyName
  state: TrafficMarkingPolicyStatus
  transitRouterId: TransitRouterId
  priority: Priority
actions:
  delete:
    operation: AlibabaCloud.CEN.DeleteTrafficMarkingPolicy
    parameters:
      TrafficMarkingPolicyId: resource.nativeId
      DryRun: false
      Force: true
    idempotency: provider_token
    waiter: absent
    pollIntervalSeconds: 5
    deletionCheckTimeoutSeconds: 600
    read:
      operation: AlibabaCloud.CEN.ListTrafficMarkingPolicies
      parameters:
        TransitRouterId: resource.normalized.transitRouterId
        TrafficMarkingPolicyId: resource.nativeId
      itemsPath: TrafficMarkingPolicies
      identityPath: TrafficMarkingPolicyId
      statePath: TrafficMarkingPolicyStatus
