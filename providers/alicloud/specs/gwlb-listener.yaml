schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::GWLB::Listener
  class: network.load_balancer_listener
presentation:
  consoleLinkTemplate: "https://slb.console.aliyun.com/gwlb/{regionId}/gwlbs/{loadBalancerId}"
  displayNames:
    zh-CN: 网关型负载均衡监听
    en-US: Gateway Load Balancer Listener
  icon: network
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: AlibabaCloud.GWLB.ListListeners
    itemsPath: Listeners
    identityPath: ListenerId
    statePath: ListenerStatus
    supportedRegions:
      - ap-northeast-1
      - ap-southeast-1
      - ap-southeast-3
      - ap-southeast-7
      - ap-southeast-8
      - cn-beijing
      - cn-chengdu
      - cn-hangzhou
      - cn-hongkong
      - cn-shanghai
      - cn-shenzhen
      - cn-wulanchabu
      - eu-central-1
      - eu-west-1
      - me-central-1
      - me-east-1
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
fields:
  name: ListenerDescription
  state: ListenerStatus
  loadBalancerId: LoadBalancerId
  serverGroupId: ServerGroupId
relationships:
  - type: member_of
    targetType: ACS::GWLB::LoadBalancer
    targetIdPath: loadBalancerId
  - type: uses
    targetType: ACS::GWLB::ServerGroup
    targetIdPath: serverGroupId
actions:
  delete:
    operation: AlibabaCloud.GWLB.DeleteListener
    parameters:
      ListenerId: resource.nativeId
      DryRun: false
    idempotency: provider_token
    waiter: absent
    pollIntervalSeconds: 5
    deletionCheckTimeoutSeconds: 600
    read:
      operation: AlibabaCloud.GWLB.ListListeners
      parameters:
        ListenerIds: resources.nativeIds
        MaxResults: 100
      itemsPath: Listeners
      identityPath: ListenerId
      statePath: ListenerStatus
      pagination:
        type: token
        tokenParameter: NextToken
        tokenPath: NextToken
        pageSizeParameter: MaxResults
        maxPageSize: 100
