schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::VPN::IpsecServer
  class: network.vpn_server
presentation:
  consoleLinkTemplate: "https://vpc.console.aliyun.com/vpn/{regionId}/ipsecservers"
  displayNames:
    zh-CN: IPsec 服务端
    en-US: IPsec Server
  icon: network
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: ListIpsecServers
    parameters:
      RegionId: scope.location
    itemsPath: IpsecServers
    identityPath: IpsecServerId
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 20
fields:
  name: IpsecServerName
  createdAt: CreationTime
  vpnGatewayId: VpnGatewayId
  localSubnet: LocalSubnet
  clientIpPool: ClientIpPool
  resourceGroupId: ResourceGroupId
relationships:
  - type: member_of
    targetType: ACS::VPN::VpnGateway
    targetIdPath: vpnGatewayId
actions:
  delete:
    operation: DeleteIpsecServer
    parameters:
      RegionId: scope.location
      IpsecServerId: resource.nativeId
    idempotency: provider_token
    waiter: absent
    read:
      operation: ListIpsecServers
      parameters:
        RegionId: scope.location
        IpsecServerId.1: resource.nativeId
        MaxResults: 1
      itemsPath: IpsecServers
      identityPath: IpsecServerId
