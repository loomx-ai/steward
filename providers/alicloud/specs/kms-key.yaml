schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::KMS::Key
  class: security.encryption_key
presentation:
  consoleLinkTemplate: "https://kms.console.aliyun.com/{regionId}/key/detail/{nativeId}"
  displayNames:
    zh-CN: KMS 密钥
    en-US: KMS Key
  icon: application
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: AlibabaCloud.KMS.ListKeys
    itemsPath: Keys.Key
    identityPath: KeyId
    pagination:
      type: page-number
      pageParameter: PageNumber
      pageSizeParameter: PageSize
      totalPath: TotalCount
      maxPageSize: 100
fields:
  name: KeyId
  creator: Creator
actions:
  delete:
    operation: AlibabaCloud.KMS.ScheduleKeyDeletion
    parameters:
      KeyId: resource.nativeId
      PendingWindowInDays: 7
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.KMS.DescribeKey
      parameters:
        KeyId: resource.nativeId
      itemsPath: KeyMetadata
      identityPath: KeyId
      statePath: KeyState
    deletionProtection:
      path: DeletionProtection
      enabledValues:
        - Enabled
      disable:
        operation: AlibabaCloud.KMS.SetDeletionProtection
        parameters:
          KeyId: resource.nativeId
          EnableDeletionProtection: false
