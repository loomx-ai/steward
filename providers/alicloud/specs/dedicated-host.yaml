schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::ECS::DedicatedHost
  class: compute.dedicated_host
presentation:
  consoleLinkTemplate: "https://ecs.console.aliyun.com/dedicatedHost/region/{regionId}?dedicatedHostId={nativeId}"
  icon: instance
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: DescribeDedicatedHosts
    parameters:
      RegionId: scope.location
    itemsPath: DedicatedHosts.DedicatedHost
    identityPath: DedicatedHostId
    statePath: Status
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
fields:
  name: DedicatedHostName
  state: Status
  createdAt: CreationTime
actions:
  delete:
    operation: ReleaseDedicatedHost
    parameters:
      RegionId: scope.location
      DedicatedHostId: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: DescribeDedicatedHosts
      parameters:
        RegionId: scope.location
        DedicatedHostIds: resource.nativeIdsJson
        MaxResults: 1
      itemsPath: DedicatedHosts.DedicatedHost
      identityPath: DedicatedHostId
      statePath: Status
