schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::FC::Alias
  class: serverless.alias
presentation:
  consoleLinkTemplate: "https://fcnext.console.aliyun.com/{regionId}/services/{serviceName}/alias"
  displayNames:
    zh-CN: 函数计算别名
    en-US: Function Compute Alias
  icon: application
scope:
  kind: region
discovery:
  source: product-api
  parent:
    source: resource-center
    nativeType: ACS::FC::Service
  list:
    operation: AlibabaCloud.FC.ListAliases
    parameters:
      serviceName: parent.nativeId
    itemsPath: aliases
    identityPath: _parent.nativeId+aliasName
    pagination:
      type: token
      tokenParameter: nextToken
      tokenPath: nextToken
      pageSizeParameter: limit
      maxPageSize: 100
fields:
  name: aliasName
  createdAt: createdTime
  updatedAt: lastModifiedTime
  serviceName: _parent.nativeId
  aliasName: aliasName
  versionId: versionId
  description: description
relationships:
  - type: member_of
    targetType: ACS::FC::Service
    targetIdPath: serviceName
  - type: uses
    targetType: ACS::FC::Version
    targetIdPath: versionRefs
actions:
  delete:
    operation: AlibabaCloud.FC.DeleteAlias
    parameters:
      serviceName: resource.normalized.serviceName
      aliasName: resource.normalized.aliasName
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.FC.ListAliases
      parameters:
        serviceName: resource.normalized.serviceName
        prefix: resource.normalized.aliasName
        limit: 100
      itemsPath: aliases
      identityPath: aliasName
      pagination:
        type: token
        tokenParameter: nextToken
        tokenPath: nextToken
        pageSizeParameter: limit
        maxPageSize: 100
