schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::CEN::TransitRouterVpnAttachment
  class: network.cen_attachment
presentation:
  consoleLinkTemplate: "https://cen.console.aliyun.com/cen/attachment/{regionId}"
  displayNames:
    zh-CN: CEN VPN 连接
    en-US: CEN VPN Attachment
  icon: network
scope:
  kind: region
discovery:
  source: cen-topology
  list:
    operation: AlibabaCloud.CEN.ListTransitRouterVpnAttachments
    itemsPath: TransitRouterAttachments
    identityPath: TransitRouterAttachmentId
    statePath: Status
fields:
  name: TransitRouterAttachmentName
  state: Status
  createdAt: CreationTime
  regionId: VpnRegionId
  cenId: CenId
  transitRouterId: TransitRouterId
  vpnId: VpnId
actions:
  delete:
    operation: AlibabaCloud.CEN.DeleteTransitRouterVpnAttachment
    parameters:
      TransitRouterAttachmentId: resource.nativeId
      DryRun: false
      Force: true
    idempotency: provider_token
    waiter: absent
    pollIntervalSeconds: 5
    deletionCheckTimeoutSeconds: 600
    read:
      operation: AlibabaCloud.CEN.ListTransitRouterVpnAttachments
      parameters:
        TransitRouterId: resource.normalized.transitRouterId
        TransitRouterAttachmentId: resource.nativeId
        MaxResults: 20
      itemsPath: TransitRouterAttachments
      identityPath: TransitRouterAttachmentId
      statePath: Status
