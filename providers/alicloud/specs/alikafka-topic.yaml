schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::AliKafka::Topic
  class: messaging.topic
presentation:
  consoleLinkTemplate: "https://kafka.console.aliyun.com/region/{regionId}/instance/{parentId}/topic"
  displayNames:
    zh-CN: Kafka Topic
    en-US: Kafka Topic
  icon: application
scope:
  kind: region
discovery:
  source: product-api
  parent:
    operation: AlibabaCloud.AliKafka.GetInstanceList
    parameters:
      RegionId: scope.location
    itemsPath: InstanceList.InstanceVO
    identityPath: InstanceId
  list:
    operation: AlibabaCloud.AliKafka.GetTopicList
    parameters:
      RegionId: scope.location
      InstanceId: parent.nativeId
    itemsPath: TopicList.TopicVO
    identityPath: InstanceId+Topic
    statePath: StatusName
    pagination:
      type: page-number
      pageParameter: CurrentPage
      pageSizeParameter: PageSize
      totalPath: Total
      maxPageSize: 100
fields:
  name: Topic
  topic: Topic
  state: StatusName
  createdAt: CreateTime
  instanceId: _parent.nativeId
  partitionNum: PartitionNum
  compactTopic: CompactTopic
  remark: Remark
relationships:
  - type: member_of
    targetType: ACS::AliKafka::Instance
    targetIdPath: instanceId
actions:
  delete:
    operation: AlibabaCloud.AliKafka.DeleteTopic
    parameters:
      RegionId: scope.location
      InstanceId: resource.normalized.instanceId
      Topic: resource.normalized.topic
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.AliKafka.GetTopicList
      parameters:
        RegionId: scope.location
        InstanceId: resource.normalized.instanceId
        Topic: resource.normalized.topic
      itemsPath: TopicList.TopicVO
      identityPath: InstanceId+Topic
      statePath: StatusName
