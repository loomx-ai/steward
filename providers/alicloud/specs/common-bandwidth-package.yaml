schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::CBWP::CommonBandwidthPackage
  class: network.bandwidth_package
presentation:
  consoleLinkTemplate: "https://vpc.console.aliyun.com/cbwp/{regionId}/cbwps/{nativeId}"
  icon: network
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: DescribeCommonBandwidthPackages
    parameters:
      RegionId: scope.location
    itemsPath: CommonBandwidthPackages.CommonBandwidthPackage
    identityPath: BandwidthPackageId
    statePath: Status
    pagination:
      type: page-number
      pageParameter: PageNumber
      pageSizeParameter: PageSize
      totalPath: TotalCount
      maxPageSize: 50
fields:
  name: Name
  state: Status
  createdAt: CreationTime
actions:
  delete:
    operation: DeleteCommonBandwidthPackage
    parameters:
      RegionId: scope.location
      BandwidthPackageId: resource.nativeId
      Force: "false"
    idempotency: readback
    waiter: absent
    read:
      operation: DescribeCommonBandwidthPackages
      parameters:
        RegionId: scope.location
        BandwidthPackageId: resource.nativeId
        PageSize: 1
      itemsPath: CommonBandwidthPackages.CommonBandwidthPackage
      identityPath: BandwidthPackageId
      statePath: Status
    deletionProtection:
      path: DeletionProtection
      enabledValues:
        - "true"
      disable:
        operation: AlibabaCloud.VPC.DeletionProtection
        parameters:
          RegionId: scope.location
          InstanceId: resource.nativeId
          Type: CBWP
          ProtectionEnable: false
