schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::RocketMQ::Topic
  class: messaging.topic
presentation:
  consoleLinkTemplate: "https://rocketmq.console.aliyun.com/region/{regionId}/instances/{parentId}/topic"
  displayNames:
    zh-CN: RocketMQ 5.0 Topic
    en-US: RocketMQ 5.0 Topic
  icon: application
scope:
  kind: region
discovery:
  source: product-api
  parent:
    operation: AlibabaCloud.RocketMQ.ListInstances
    itemsPath: data.list
    identityPath: instanceId
    pagination:
      type: page-number
      pageParameter: pageNumber
      pageSizeParameter: pageSize
      totalPath: data.totalCount
      maxPageSize: 100
  list:
    operation: AlibabaCloud.RocketMQ.ListTopics
    parameters:
      instanceId: parent.nativeId
    itemsPath: data.list
    identityPath: instanceId+topicName
    statePath: status
    pagination:
      type: page-number
      pageParameter: pageNumber
      pageSizeParameter: pageSize
      totalPath: data.totalCount
      maxPageSize: 100
fields:
  name: topicName
  topicName: topicName
  state: status
  createdAt: createTime
  instanceId: _parent.nativeId
  messageType: messageType
  remark: remark
relationships:
  - type: member_of
    targetType: ACS::RocketMQ::Instance
    targetIdPath: instanceId
actions:
  delete:
    operation: AlibabaCloud.RocketMQ.DeleteTopic
    parameters:
      instanceId: resource.normalized.instanceId
      topicName: resource.normalized.topicName
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.RocketMQ.GetTopic
      parameters:
        instanceId: resource.normalized.instanceId
        topicName: resource.normalized.topicName
      itemsPath: data
      identityPath: instanceId+topicName
      statePath: status
