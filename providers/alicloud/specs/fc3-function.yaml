schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::FC3::Function
  class: serverless.function
presentation:
  consoleLinkTemplate: "https://fcnext.console.aliyun.com/{regionId}/functions/{functionName}"
  displayNames:
    zh-CN: 函数计算 3.0 函数
    en-US: Function Compute 3.0 Function
  icon: application
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: AlibabaCloud.FC3.ListFunctions
    parameters:
      fcVersion: v3
    itemsPath: functions
    identityPath: functionId
    statePath: state
    pagination:
      type: token
      tokenParameter: nextToken
      tokenPath: nextToken
      pageSizeParameter: limit
      maxPageSize: 100
fields:
  name: functionName
  state: state
  createdAt: createdTime
  updatedAt: lastModifiedTime
  functionId: functionId
  functionName: functionName
  functionArn: functionArn
  description: description
  runtime: runtime
  handler: handler
  timeout: timeout
  memorySize: memorySize
  cpu: cpu
  diskSize: diskSize
  instanceConcurrency: instanceConcurrency
  role: role
  resourceGroupId: resourceGroupId
  lockedBy: lockInfo.lockedBy
  vpcId: vpcConfig.vpcId
  vSwitchIds: vpcConfig.vSwitchIds
  securityGroupId: vpcConfig.securityGroupId
relationships:
  - type: member_of
    targetType: ACS::VPC::VPC
    targetIdPath: vpcId
  - type: uses
    targetType: ACS::VPC::VSwitch
    targetIdPath: vSwitchIds
  - type: uses
    targetType: ACS::ECS::SecurityGroup
    targetIdPath: securityGroupId
actions:
  delete:
    operation: AlibabaCloud.FC3.DeleteFunction
    parameters:
      functionName: resource.normalized.functionName
    preconditions:
      - path: lockInfo.lockedBy
        allowedValues: [""]
        reason: a function locked by another product is managed by that product and must be removed through it
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.FC3.ListFunctions
      parameters:
        fcVersion: v3
        prefix: resource.normalized.functionName
        limit: 100
      itemsPath: functions
      identityPath: functionId
      statePath: state
      pagination:
        type: token
        tokenParameter: nextToken
        tokenPath: nextToken
        pageSizeParameter: limit
        maxPageSize: 100
