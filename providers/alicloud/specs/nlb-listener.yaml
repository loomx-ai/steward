schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::NLB::Listener
  class: network.load_balancer_listener
presentation:
  consoleLinkTemplate: "https://slb.console.aliyun.com/nlb/{regionId}/nlbs/{parentId}/listeners"
  displayNames:
    zh-CN: NLB 监听
    en-US: NLB Listener
  icon: network
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: AlibabaCloud.NLB.ListListeners
    parameters:
      RegionId: scope.location
    itemsPath: Listeners
    identityPath: ListenerId
    statePath: ListenerStatus
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
fields:
  name: ListenerDescription
  state: ListenerStatus
  loadBalancerId: LoadBalancerId
  serverGroupId: ServerGroupId
  listenerProtocol: ListenerProtocol
  listenerPort: ListenerPort
relationships:
  - type: member_of
    targetType: ACS::NLB::LoadBalancer
    targetIdPath: loadBalancerId
  - type: uses
    targetType: ACS::NLB::ServerGroup
    targetIdPath: serverGroupId
actions:
  delete:
    operation: AlibabaCloud.NLB.DeleteListener
    parameters:
      RegionId: scope.location
      ListenerId: resource.nativeId
    idempotency: provider_token
    waiter: absent
    read:
      operation: AlibabaCloud.NLB.ListListeners
      parameters:
        RegionId: scope.location
        ListenerIds: resources.nativeIds
        MaxResults: 1
      itemsPath: Listeners
      identityPath: ListenerId
      statePath: ListenerStatus
