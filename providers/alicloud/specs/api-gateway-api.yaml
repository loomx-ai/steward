schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::ApiGateway::Api
  class: network.api
presentation:
  consoleLinkTemplate: "https://apigateway.console.aliyun.com/#/{regionId}/apis/list"
  displayNames:
    zh-CN: API 网关 API
    en-US: API Gateway API
  icon: application
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: AlibabaCloud.ApiGateway.DescribeApis
    itemsPath: ApiSummarys.ApiSummary
    identityPath: ApiId
    pagination:
      type: page-number
      pageParameter: PageNumber
      pageSizeParameter: PageSize
      totalPath: TotalCount
      maxPageSize: 100
fields:
  name: ApiName
  createdAt: CreatedTime
  updatedAt: ModifiedTime
  groupId: GroupId
  groupName: GroupName
  apiPath: ApiPath
  apiMethod: ApiMethod
  visibility: Visibility
relationships:
  - type: member_of
    targetType: ACS::ApiGateway::Group
    targetIdPath: groupId
actions:
  delete:
    operation: AlibabaCloud.ApiGateway.DeleteApi
    parameters:
      GroupId: resource.normalized.groupId
      ApiId: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.ApiGateway.DescribeApis
      parameters:
        GroupId: resource.normalized.groupId
        ApiId: resource.nativeId
        PageSize: 100
      itemsPath: ApiSummarys.ApiSummary
      identityPath: ApiId
      pagination:
        type: page-number
        pageParameter: PageNumber
        pageSizeParameter: PageSize
        totalPath: TotalCount
        maxPageSize: 100
