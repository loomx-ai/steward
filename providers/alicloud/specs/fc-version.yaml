schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::FC::Version
  class: serverless.version
presentation:
  consoleLinkTemplate: "https://fcnext.console.aliyun.com/{regionId}/services/{serviceName}/version"
  displayNames:
    zh-CN: 函数计算服务版本
    en-US: Function Compute Service Version
  icon: application
scope:
  kind: region
discovery:
  source: product-api
  parent:
    source: resource-center
    nativeType: ACS::FC::Service
  list:
    operation: AlibabaCloud.FC.ListServiceVersions
    parameters:
      serviceName: parent.nativeId
    itemsPath: versions
    identityPath: _parent.nativeId+versionId
    pagination:
      type: token
      tokenParameter: nextToken
      tokenPath: nextToken
      pageSizeParameter: limit
      maxPageSize: 100
fields:
  name: versionId
  createdAt: createdTime
  updatedAt: lastModifiedTime
  serviceName: _parent.nativeId
  versionId: versionId
  description: description
relationships:
  - type: member_of
    targetType: ACS::FC::Service
    targetIdPath: serviceName
actions:
  delete:
    operation: AlibabaCloud.FC.DeleteServiceVersion
    parameters:
      serviceName: resource.normalized.serviceName
      versionId: resource.normalized.versionId
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.FC.ListServiceVersions
      parameters:
        serviceName: resource.normalized.serviceName
        startKey: resource.normalized.versionId
        direction: FORWARD
        limit: 100
      itemsPath: versions
      identityPath: versionId
      pagination:
        type: token
        tokenParameter: nextToken
        tokenPath: nextToken
        pageSizeParameter: limit
        maxPageSize: 100
