schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::DataHub::Project
  class: data.project
presentation:
  consoleLinkTemplate: "https://dhsnext.console.aliyun.com/{regionId}/projects/{nativeId}"
  displayNames:
    zh-CN: DataHub 项目
    en-US: DataHub Project
  icon: application
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: AlibabaCloud.DataHub.ListProjects
    itemsPath: List.Project
    identityPath: ProjectName
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
fields:
  name: ProjectName
  createdAt: CreateTime
  updatedAt: UpdateTime
  comment: Comment
  creator: Creator
actions:
  delete:
    operation: AlibabaCloud.DataHub.DeleteProject
    parameters:
      ProjectName: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.DataHub.ListProjects
      parameters:
        Keyword: resource.nativeId
        Pure: true
        MaxResults: 1
      itemsPath: List.Project
      identityPath: ProjectName
