schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::CEN::Flowlog
  class: observability.flow_log
presentation:
  consoleLinkTemplate: "https://cen.console.aliyun.com/cen/flowlog/{regionId}"
  displayNames:
    zh-CN: CEN 流日志
    en-US: CEN Flow Log
  icon: network
scope:
  kind: region
discovery:
  source: cen-topology
  list:
    operation: AlibabaCloud.CEN.DescribeFlowlogs
    itemsPath: FlowLogs.FlowLog
    identityPath: FlowLogId
    statePath: Status
fields:
  name: FlowLogName
  state: Status
  createdAt: CreationTime
  regionId: RegionId
  cenId: CenId
  transitRouterAttachmentId: TransitRouterAttachmentId
  projectName: ProjectName
  logStoreName: LogStoreName
relationships:
  - type: uses
    targetType: ACS::SLS::Project
    targetIdPath: projectName
  - type: uses
    targetType: ACS::SLS::LogStore
    targetIdPath: logStoreRef
actions:
  delete:
    operation: AlibabaCloud.CEN.DeleteFlowlog
    parameters:
      RegionId: resource.normalized.regionId
      CenId: resource.normalized.cenId
      FlowLogId: resource.nativeId
    idempotency: provider_token
    waiter: absent
    pollIntervalSeconds: 5
    deletionCheckTimeoutSeconds: 600
    read:
      operation: AlibabaCloud.CEN.DescribeFlowlogs
      parameters:
        RegionId: resource.normalized.regionId
        CenId: resource.normalized.cenId
        FlowLogId: resource.nativeId
      itemsPath: FlowLogs.FlowLog
      identityPath: FlowLogId
      statePath: Status
