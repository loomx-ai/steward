schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::CEN::TransitRouterVbrAttachment
  class: network.cen_attachment
presentation:
  consoleLinkTemplate: "https://cen.console.aliyun.com/cen/attachment/{regionId}"
  displayNames:
    zh-CN: CEN VBR 连接
    en-US: CEN VBR Attachment
  icon: network
scope:
  kind: region
discovery:
  source: cen-topology
  list:
    operation: AlibabaCloud.CEN.ListTransitRouterVbrAttachments
    itemsPath: TransitRouterAttachments
    identityPath: TransitRouterAttachmentId
    statePath: Status
fields:
  name: TransitRouterAttachmentName
  state: Status
  createdAt: CreationTime
  regionId: VbrRegionId
  cenId: CenId
  transitRouterId: TransitRouterId
  vbrId: VbrId
actions:
  delete:
    operation: AlibabaCloud.CEN.DeleteTransitRouterVbrAttachment
    parameters:
      TransitRouterAttachmentId: resource.nativeId
      DryRun: false
      Force: true
    preconditions:
      - path: ManagedService
        allowedValues: [""]
        reason: a VBR connection managed by a cloud service is removed through that service
    idempotency: provider_token
    waiter: absent
    pollIntervalSeconds: 5
    deletionCheckTimeoutSeconds: 600
    read:
      operation: AlibabaCloud.CEN.ListTransitRouterVbrAttachments
      parameters:
        TransitRouterId: resource.normalized.transitRouterId
        TransitRouterAttachmentId: resource.nativeId
        MaxResults: 20
      itemsPath: TransitRouterAttachments
      identityPath: TransitRouterAttachmentId
      statePath: Status
