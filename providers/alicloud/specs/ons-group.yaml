schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::Ons::Group
  class: messaging.consumer_group
presentation:
  consoleLinkTemplate: "https://ons.console.aliyun.com/region/{regionId}/instance/{parentId}/group"
  displayNames:
    zh-CN: RocketMQ 4.0 Group
    en-US: RocketMQ 4.0 Group
  icon: application
scope:
  kind: region
discovery:
  source: product-api
  parent:
    operation: AlibabaCloud.ONS.OnsInstanceInServiceList
    itemsPath: Data.InstanceVO
    identityPath: InstanceId
  list:
    operation: AlibabaCloud.ONS.OnsGroupList
    parameters:
      InstanceId: parent.nativeId
    itemsPath: Data.SubscribeInfoDo
    identityPath: InstanceId+GroupId
fields:
  name: GroupId
  groupId: GroupId
  createdAt: CreateTime
  instanceId: _parent.nativeId
  groupType: GroupType
  owner: Owner
  remark: Remark
relationships:
  - type: member_of
    targetType: ACS::Ons::Instance
    targetIdPath: instanceId
actions:
  delete:
    operation: AlibabaCloud.ONS.OnsGroupDelete
    parameters:
      InstanceId: resource.normalized.instanceId
      GroupId: resource.normalized.groupId
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.ONS.OnsGroupList
      parameters:
        InstanceId: resource.normalized.instanceId
        GroupId: resource.normalized.groupId
      itemsPath: Data.SubscribeInfoDo
      identityPath: InstanceId+GroupId
