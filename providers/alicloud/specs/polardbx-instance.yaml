schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::DRDS::PolarDBXInstance
  class: database.distributed
presentation:
  consoleLinkTemplate: "https://drds.console.aliyun.com/"
  displayNames:
    zh-CN: PolarDB-X 实例
    en-US: PolarDB-X Instance
  icon: database
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: AlibabaCloud.PolarDBX.DescribeDBInstances
    parameters:
      RegionId: scope.location
    itemsPath: DBInstances
    identityPath: DBInstanceName
    statePath: Status
    pagination:
      type: page-number
      pageParameter: PageNumber
      pageSizeParameter: PageSize
      totalPath: TotalNumber
      maxPageSize: 100
fields:
  name: Description
  state: Status
  createdAt: CreateTime
  chargeType: PayType
  resourceGroupId: ResourceGroupId
  vpcId: VPCId
  zoneId: ZoneId
relationships:
  - type: member_of
    targetType: ACS::VPC::VPC
    targetIdPath: vpcId
actions:
  delete:
    operation: AlibabaCloud.PolarDBX.DeleteDBInstance
    parameters:
      RegionId: scope.location
      DBInstanceName: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.PolarDBX.DescribeDBInstances
      parameters:
        RegionId: scope.location
        InstanceId: resource.nativeId
        PageNumber: 1
        PageSize: 30
      itemsPath: DBInstances
      identityPath: DBInstanceName
      statePath: Status
