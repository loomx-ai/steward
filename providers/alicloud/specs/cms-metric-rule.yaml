schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::CMS::MetricRule
  class: observability.alert_rule
presentation:
  consoleLinkTemplate: "https://cms.console.aliyun.com/#/alarm/rule"
  displayNames:
    zh-CN: 云监控报警规则
    en-US: CloudMonitor Alert Rule
  icon: application
scope:
  kind: global
discovery:
  source: product-api
  list:
    operation: AlibabaCloud.CMS.DescribeMetricRuleList
    itemsPath: Alarms.Alarm
    identityPath: RuleId
    statePath: AlertState
    pagination:
      type: page-number
      pageParameter: Page
      pageSizeParameter: PageSize
      totalPath: Total
      maxPageSize: 100
fields:
  name: RuleName
  state: AlertState
  namespace: Namespace
  metricName: MetricName
  groupId: GroupId
  enableState: EnableState
  contactGroups: ContactGroups
relationships:
  - type: member_of
    targetType: ACS::CMS::MonitorGroup
    targetIdPath: groupId
actions:
  delete:
    operation: AlibabaCloud.CMS.DeleteMetricRules
    parameters:
      Id.1: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.CMS.DescribeMetricRuleList
      parameters:
        RuleIds: resource.nativeId
      itemsPath: Alarms.Alarm
      identityPath: RuleId
      statePath: AlertState
