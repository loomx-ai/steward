schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::EmrServerlessSpark::Workspace
  class: data.workspace
presentation:
  consoleLinkTemplate: "https://emr-next.console.aliyun.com/spark/#/region/{regionId}/workspace/{nativeId}/overview"
  displayNames:
    zh-CN: EMR Serverless Spark 工作空间
    en-US: EMR Serverless Spark Workspace
  icon: application
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: AlibabaCloud.EmrServerlessSpark.ListWorkspaces
    parameters:
      regionId: scope.location
    itemsPath: workspaces
    identityPath: workspaceId
    statePath: workspaceStatus
    pagination:
      type: token
      tokenParameter: nextToken
      tokenPath: nextToken
      pageSizeParameter: maxResults
      maxPageSize: 100
fields:
  name: workspaceName
  state: workspaceStatus
  createdAt: createTime
  expireTime: expireTime
  paymentType: paymentType
  regionId: regionId
  resourceGroupId: resourceGroupId
