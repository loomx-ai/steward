schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::FC::Trigger
  class: serverless.trigger
presentation:
  consoleLinkTemplate: "https://fcnext.console.aliyun.com/{regionId}/services/{serviceName}/function-detail/{functionName}/LATEST?tab=trigger"
  displayNames:
    zh-CN: 函数计算触发器
    en-US: Function Compute Trigger
  icon: application
scope:
  kind: region
discovery:
  source: product-api
  parent:
    source: product-api
    nativeType: ACS::FC::Function
  list:
    operation: AlibabaCloud.FC.ListTriggers
    parameters:
      serviceName: parent.normalized.serviceName
      functionName: parent.normalized.functionName
    itemsPath: triggers
    identityPath: triggerId
    pagination:
      type: token
      tokenParameter: nextToken
      tokenPath: nextToken
      pageSizeParameter: limit
      maxPageSize: 100
fields:
  name: triggerName
  createdAt: createdTime
  updatedAt: lastModifiedTime
  serviceName: _parent.normalized.serviceName
  functionName: _parent.normalized.functionName
  functionId: _parent.nativeId
  triggerName: triggerName
  triggerType: triggerType
  qualifier: qualifier
  sourceArn: sourceArn
  invocationRole: invocationRole
  description: description
relationships:
  - type: member_of
    targetType: ACS::FC::Function
    targetIdPath: functionId
actions:
  delete:
    operation: AlibabaCloud.FC.DeleteTrigger
    parameters:
      serviceName: resource.normalized.serviceName
      functionName: resource.normalized.functionName
      triggerName: resource.normalized.triggerName
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.FC.ListTriggers
      parameters:
        serviceName: resource.normalized.serviceName
        functionName: resource.normalized.functionName
        prefix: resource.normalized.triggerName
        limit: 100
      itemsPath: triggers
      identityPath: triggerId
      pagination:
        type: token
        tokenParameter: nextToken
        tokenPath: nextToken
        pageSizeParameter: limit
        maxPageSize: 100
