schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::ECS::PrefixList
  class: network.prefix_list
presentation:
  consoleLinkTemplate: "https://ecs.console.aliyun.com/prefixList/region/{regionId}"
  displayNames:
    zh-CN: ECS 前缀列表
    en-US: ECS Prefix List
  icon: network
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: DescribePrefixLists
    parameters:
      RegionId: scope.location
    itemsPath: PrefixLists.PrefixList
    identityPath: PrefixListId
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
fields:
  name: PrefixListName
  createdAt: CreationTime
  addressFamily: AddressFamily
  associationCount: AssociationCount
  resourceGroupId: ResourceGroupId
actions:
  delete:
    operation: DeletePrefixList
    parameters:
      RegionId: scope.location
      PrefixListId: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: DescribePrefixLists
      parameters:
        RegionId: scope.location
        PrefixListId: resources.nativeIds
        MaxResults: 100
      itemsPath: PrefixLists.PrefixList
      identityPath: PrefixListId
      pagination:
        type: token
        tokenParameter: NextToken
        tokenPath: NextToken
        pageSizeParameter: MaxResults
        maxPageSize: 100
