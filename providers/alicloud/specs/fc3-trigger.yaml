schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::FC3::Trigger
  class: serverless.trigger
presentation:
  consoleLinkTemplate: "https://fcnext.console.aliyun.com/{regionId}/functions/{functionName}/trigger"
  displayNames:
    zh-CN: 函数计算 3.0 触发器
    en-US: Function Compute 3.0 Trigger
  icon: application
scope:
  kind: region
discovery:
  source: product-api
  parent:
    source: product-api
    nativeType: ACS::FC3::Function
  list:
    operation: AlibabaCloud.FC3.ListTriggers
    parameters:
      functionName: parent.normalized.functionName
    itemsPath: triggers
    identityPath: triggerId
    statePath: status
    pagination:
      type: token
      tokenParameter: nextToken
      tokenPath: nextToken
      pageSizeParameter: limit
      maxPageSize: 100
fields:
  name: triggerName
  state: status
  createdAt: createdTime
  updatedAt: lastModifiedTime
  functionName: _parent.normalized.functionName
  functionId: _parent.nativeId
  triggerName: triggerName
  triggerType: triggerType
  qualifier: qualifier
  sourceArn: sourceArn
  targetArn: targetArn
  invocationRole: invocationRole
  description: description
relationships:
  - type: member_of
    targetType: ACS::FC3::Function
    targetIdPath: functionId
actions:
  delete:
    operation: AlibabaCloud.FC3.DeleteTrigger
    parameters:
      functionName: resource.normalized.functionName
      triggerName: resource.normalized.triggerName
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.FC3.ListTriggers
      parameters:
        functionName: resource.normalized.functionName
        prefix: resource.normalized.triggerName
        limit: 100
      itemsPath: triggers
      identityPath: triggerId
      statePath: status
      pagination:
        type: token
        tokenParameter: nextToken
        tokenPath: nextToken
        pageSizeParameter: limit
        maxPageSize: 100
