schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: alicloud
  nativeType: ACS::NAS::FileSystem
  class: storage.filesystem
presentation:
  consoleLinkTemplate: "https://nas.console.aliyun.com/{regionId}/filesystem/{nativeId}/info"
  icon: disk
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: AlibabaCloud.NAS.DescribeFileSystems
    itemsPath: FileSystems.FileSystem
    identityPath: FileSystemId
    statePath: Status
    pagination:
      type: page-number
      pageParameter: PageNumber
      pageSizeParameter: PageSize
      totalPath: TotalCount
      maxPageSize: 100
fields:
  name: Description
  state: Status
  createdAt: CreateTime
  vpcId: VpcId
relationships:
  - type: member_of
    targetType: ACS::VPC::VPC
    targetIdPath: vpcId
  - type: uses
    targetType: ACS::VPC::VSwitch
    targetIdPath: vSwitchIds
actions:
  delete:
    operation: AlibabaCloud.NAS.DeleteFileSystem
    pollIntervalSeconds: 5
    deletionCheckTimeoutSeconds: 600
    parameters:
      FileSystemId: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: AlibabaCloud.NAS.DescribeFileSystems
      parameters:
        FileSystemId: resource.nativeId
        PageSize: 1
      itemsPath: FileSystems.FileSystem
      identityPath: FileSystemId
      statePath: Status
