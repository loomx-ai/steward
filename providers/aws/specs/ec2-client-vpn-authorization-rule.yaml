schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::EC2::ClientVpnAuthorizationRule
  class: network.vpn_server_rule
presentation:
  displayNames:
    zh-CN: Client VPN 授权规则
    en-US: Client VPN Authorization Rule
scope:
  kind: region
discovery:
  source: product-api
  parent:
    source: product-api
    nativeType: AWS::EC2::ClientVpnEndpoint
  list:
    operation: com.amazonaws.ec2#DescribeClientVpnAuthorizationRules
    parameters:
      ClientVpnEndpointId: parent.nativeId
    itemsPath: AuthorizationRules
    identityPath: RuleKey
    statePath: Status.Code
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 1000
relationships:
- type: member_of
  targetType: AWS::EC2::ClientVpnEndpoint
  targetIdPath: ClientVpnEndpointId
actions:
  delete:
    operation: com.amazonaws.ec2#RevokeClientVpnIngress
    parameters:
      ClientVpnEndpointId: resource.normalized.ClientVpnEndpointId
      TargetNetworkCidr: resource.normalized.DestinationCidr
      AccessGroupId: resource.normalized.GroupId
    idempotency: readback
    waiter: absent
    read:
      operation: com.amazonaws.ec2#DescribeClientVpnAuthorizationRules
      parameters:
        ClientVpnEndpointId: resource.normalized.ClientVpnEndpointId
      itemsPath: AuthorizationRules
      identityPath: RuleKey
      statePath: Status.Code
extensions:
  hook: aws.product.resource
