schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::EC2::ClientVpnEndpoint
  class: network.vpn_server
presentation:
  displayNames:
    zh-CN: Client VPN 端点
    en-US: Client VPN Endpoint
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: com.amazonaws.ec2#DescribeClientVpnEndpoints
    itemsPath: ClientVpnEndpoints
    identityPath: ClientVpnEndpointId
    statePath: Status.Code
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 1000
relationships:
- type: member_of
  targetType: AWS::EC2::VPC
  targetIdPath: vpc_id
- type: uses
  targetType: AWS::EC2::SecurityGroup
  targetIdPath: security_group_ids
- type: uses
  targetType: AWS::CertificateManager::Certificate
  targetIdPath: certificate_arns
- type: uses
  targetType: AWS::Logs::LogGroup
  targetIdPath: log_group_name
actions:
  delete:
    operation: com.amazonaws.ec2#DeleteClientVpnEndpoint
    parameters:
      ClientVpnEndpointId: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: com.amazonaws.ec2#DescribeClientVpnEndpoints
      parameters:
        ClientVpnEndpointIds: resource.nativeIdsJson
      itemsPath: ClientVpnEndpoints
      identityPath: ClientVpnEndpointId
      statePath: Status.Code
extensions:
  hook: aws.product.resource
