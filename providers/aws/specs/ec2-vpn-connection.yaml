schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::EC2::VPNConnection
  class: network.vpn_connection
presentation:
  displayNames:
    zh-CN: 站点到站点 VPN 连接
    en-US: Site-to-Site VPN Connection
scope:
  kind: region
discovery:
  source: cloud-control
  list:
    operation: com.amazonaws.cloudcontrol#ListResources
    parameters:
      TypeName: AWS::EC2::VPNConnection
    itemsPath: ResourceDescriptions
    identityPath: Identifier
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
  detail:
    operation: com.amazonaws.cloudcontrol#GetResource
    itemsPath: ResourceDescription
    identityPath: Identifier
relationships:
- type: uses
  targetType: AWS::EC2::VPNGateway
  targetIdPath: VpnGatewayId
- type: uses
  targetType: AWS::EC2::CustomerGateway
  targetIdPath: CustomerGatewayId
- type: member_of
  targetType: AWS::EC2::TransitGateway
  targetIdPath: TransitGatewayId
actions:
  delete:
    operation: com.amazonaws.cloudcontrol#DeleteResource
    idempotency: provider_token
    waiter: cloud_control_terminal
    readback: cloud_control_absent
extensions:
  hook: aws.cloudcontrol.resource
