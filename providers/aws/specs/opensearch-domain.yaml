schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::OpenSearchService::Domain
  class: search.domain
presentation:
  displayNames:
    zh-CN: OpenSearch Service 域
    en-US: OpenSearch Service Domain
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: com.amazonaws.opensearch#ListDomainNames
    itemsPath: DomainNames
    identityPath: DomainName
actions:
  delete:
    operation: com.amazonaws.opensearch#DeleteDomain
    parameters:
      DomainName: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: com.amazonaws.opensearch#DescribeDomains
      parameters:
        DomainNames: resource.nativeIdsJson
      itemsPath: DomainStatusList
      identityPath: DomainName
extensions:
  hook: aws.product.resource
