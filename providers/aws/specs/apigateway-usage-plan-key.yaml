schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::ApiGateway::UsagePlanKey
  class: api.usage_plan_key
presentation:
  displayNames:
    zh-CN: API Gateway 使用计划密钥
    en-US: API Gateway Usage Plan Key
scope:
  kind: region
discovery:
  source: cloud-control
  parent:
    source: cloud-control
    nativeType: AWS::ApiGateway::UsagePlan
  list:
    operation: com.amazonaws.cloudcontrol#ListResources
    parameters:
      TypeName: AWS::ApiGateway::UsagePlanKey
      ResourceModel.UsagePlanId: parent.nativeId
    itemsPath: ResourceDescriptions
    identityPath: Identifier
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
  detail:
    operation: com.amazonaws.cloudcontrol#GetResource
    itemsPath: ResourceDescription
    identityPath: Identifier
relationships:
- type: member_of
  targetType: AWS::ApiGateway::UsagePlan
  targetIdPath: UsagePlanId
- type: uses
  targetType: AWS::ApiGateway::ApiKey
  targetIdPath: KeyId
actions:
  delete:
    operation: com.amazonaws.cloudcontrol#DeleteResource
    idempotency: provider_token
    waiter: cloud_control_terminal
    readback: cloud_control_absent
extensions:
  hook: aws.cloudcontrol.resource
