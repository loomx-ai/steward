schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::EC2::Instance
  class: compute.instance
presentation:
  displayNames:
    zh-CN: EC2 实例
    en-US: EC2 Instance
  consoleLinkTemplate: https://{regionId}.console.aws.amazon.com/ec2/home?region={regionId}#InstanceDetails:instanceId={nativeId}
scope:
  kind: region
discovery:
  source: cloud-control
  list:
    operation: com.amazonaws.cloudcontrol#ListResources
    parameters:
      TypeName: AWS::EC2::Instance
    itemsPath: ResourceDescriptions
    identityPath: Identifier
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
  detail:
    operation: com.amazonaws.cloudcontrol#GetResource
    itemsPath: ResourceDescription
    identityPath: Identifier
relationships:
- type: member_of
  targetType: AWS::EC2::VPC
  targetIdPath: vpc_id
- type: member_of
  targetType: AWS::EC2::Subnet
  targetIdPath: subnet_ids
- type: uses
  targetType: AWS::EC2::SecurityGroup
  targetIdPath: security_group_ids
- type: attached_to
  targetType: AWS::EC2::Volume
  targetIdPath: volume_ids
- type: uses
  targetType: AWS::EC2::NetworkInterface
  targetIdPath: network_interface_ids
- type: uses
  targetType: AWS::EC2::KeyPair
  targetIdPath: KeyName
- type: uses
  targetType: AWS::EC2::PlacementGroup
  targetIdPath: PlacementGroupName
- type: uses
  targetType: AWS::EC2::Image
  targetIdPath: ImageId
- type: depends_on
  targetType: AWS::EC2::Host
  targetIdPath: HostId
- type: uses
  targetType: AWS::EC2::LaunchTemplate
  targetIdPath: LaunchTemplate.LaunchTemplateId
actions:
  delete:
    operation: com.amazonaws.cloudcontrol#DeleteResource
    idempotency: provider_token
    waiter: cloud_control_terminal
    readback: cloud_control_absent
    read:
      operation: com.amazonaws.cloudcontrol#GetResource
      parameters:
        TypeName: AWS::EC2::Instance
        Identifier: resource.nativeId
      itemsPath: ResourceDescription.Properties
      identityPath: Identifier
    deletionProtection:
      path: DisableApiTermination
      enabledValues:
      - 'true'
      disable:
        operation: com.amazonaws.cloudcontrol#UpdateResource
        parameters:
          TypeName: AWS::EC2::Instance
          Identifier: resource.nativeId
          PatchOperation: replace
          PatchValue: false
extensions:
  hook: aws.cloudcontrol.resource
