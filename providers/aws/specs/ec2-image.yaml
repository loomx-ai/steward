schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::EC2::Image
  class: compute.image
presentation:
  displayNames:
    zh-CN: Amazon 系统映像
    en-US: Amazon Machine Image
  consoleLinkTemplate: https://{regionId}.console.aws.amazon.com/ec2/home?region={regionId}#ImageDetails:imageId={nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: com.amazonaws.ec2#DescribeImages
    parameters:
      Owners:
      - self
      IncludeDeprecated: true
      IncludeDisabled: true
    itemsPath: Images
    identityPath: ImageId
    statePath: State
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 1000
relationships:
- type: uses
  targetType: AWS::EC2::Snapshot
  targetIdPath: snapshot_ids
actions:
  delete:
    operation: com.amazonaws.ec2#DeregisterImage
    parameters:
      ImageId: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: com.amazonaws.ec2#DescribeImages
      parameters:
        ImageIds: resource.nativeIdsJson
        IncludeDeprecated: true
        IncludeDisabled: true
      itemsPath: Images
      identityPath: ImageId
      statePath: State
    deletionProtection:
      path: DeregistrationProtection
      enabledValues:
      - enabled
      - enabled-with-cooldown
      disable:
        operation: com.amazonaws.ec2#DisableImageDeregistrationProtection
        parameters:
          ImageId: resource.nativeId
extensions:
  hook: aws.product.resource
