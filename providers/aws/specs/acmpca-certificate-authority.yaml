schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::ACMPCA::CertificateAuthority
  class: security.certificate_authority
presentation:
  displayNames:
    zh-CN: 私有证书颁发机构
    en-US: Private Certificate Authority
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: com.amazonaws.acmpca#ListCertificateAuthorities
    parameters:
      ResourceOwner: SELF
    itemsPath: CertificateAuthorities
    identityPath: Arn
    statePath: Status
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 1000
actions:
  delete:
    operation: com.amazonaws.acmpca#DeleteCertificateAuthority
    parameters:
      CertificateAuthorityArn: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: com.amazonaws.acmpca#DescribeCertificateAuthority
      parameters:
        CertificateAuthorityArn: resource.nativeId
      itemsPath: CertificateAuthority
      identityPath: Arn
      statePath: Status
    deletionProtection:
      path: Status
      enabledValues:
      - ACTIVE
      disable:
        operation: com.amazonaws.acmpca#UpdateCertificateAuthority
        parameters:
          CertificateAuthorityArn: resource.nativeId
          Status: DISABLED
extensions:
  hook: aws.product.resource
