schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::GlobalAccelerator::EndpointGroup
  class: network.global_accelerator_endpoint_group
presentation:
  displayNames:
    zh-CN: Global Accelerator 终端节点组
    en-US: Global Accelerator Endpoint Group
scope:
  kind: global
discovery:
  source: cloud-control
  list:
    operation: com.amazonaws.cloudcontrol#ListResources
    parameters:
      TypeName: AWS::GlobalAccelerator::EndpointGroup
    itemsPath: ResourceDescriptions
    identityPath: Identifier
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
  detail:
    operation: com.amazonaws.cloudcontrol#GetResource
    itemsPath: ResourceDescription
    identityPath: Identifier
relationships:
- type: member_of
  targetType: AWS::GlobalAccelerator::Listener
  targetIdPath: ListenerArn
actions:
  delete:
    operation: com.amazonaws.cloudcontrol#DeleteResource
    idempotency: provider_token
    waiter: cloud_control_terminal
    readback: cloud_control_absent
extensions:
  hook: aws.cloudcontrol.resource
