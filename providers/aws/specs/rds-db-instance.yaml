schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::RDS::DBInstance
  class: database.instance
presentation:
  displayNames:
    zh-CN: RDS 数据库实例
    en-US: RDS DB Instance
  consoleLinkTemplate: https://{regionId}.console.aws.amazon.com/rds/home?region={regionId}#database:id={nativeId}
scope:
  kind: region
discovery:
  source: cloud-control
  list:
    operation: com.amazonaws.cloudcontrol#ListResources
    parameters:
      TypeName: AWS::RDS::DBInstance
    itemsPath: ResourceDescriptions
    identityPath: Identifier
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
  detail:
    operation: com.amazonaws.cloudcontrol#GetResource
    itemsPath: ResourceDescription
    identityPath: Identifier
relationships:
- type: uses
  targetType: AWS::EC2::SecurityGroup
  targetIdPath: security_group_ids
- type: member_of
  targetType: AWS::RDS::DBCluster
  targetIdPath: DBClusterIdentifier
actions:
  delete:
    operation: com.amazonaws.cloudcontrol#DeleteResource
    idempotency: provider_token
    waiter: cloud_control_terminal
    readback: cloud_control_absent
    read:
      operation: com.amazonaws.cloudcontrol#GetResource
      parameters:
        TypeName: AWS::RDS::DBInstance
        Identifier: resource.nativeId
      itemsPath: ResourceDescription.Properties
      identityPath: Identifier
    deletionProtection:
      path: DeletionProtection
      enabledValues:
      - 'true'
      disable:
        operation: com.amazonaws.cloudcontrol#UpdateResource
        parameters:
          TypeName: AWS::RDS::DBInstance
          Identifier: resource.nativeId
          PatchOperation: replace
          PatchValue: false
extensions:
  hook: aws.cloudcontrol.resource
