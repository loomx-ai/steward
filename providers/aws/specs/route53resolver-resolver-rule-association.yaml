schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::Route53Resolver::ResolverRuleAssociation
  class: network.dns_forwarding_rule_association
presentation:
  displayNames:
    zh-CN: Route 53 Resolver 规则关联
    en-US: Route 53 Resolver Rule Association
scope:
  kind: region
discovery:
  source: cloud-control
  list:
    operation: com.amazonaws.cloudcontrol#ListResources
    parameters:
      TypeName: AWS::Route53Resolver::ResolverRuleAssociation
    itemsPath: ResourceDescriptions
    identityPath: Identifier
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
  detail:
    operation: com.amazonaws.cloudcontrol#GetResource
    itemsPath: ResourceDescription
    identityPath: Identifier
relationships:
- type: member_of
  targetType: AWS::Route53Resolver::ResolverRule
  targetIdPath: ResolverRuleId
- type: uses
  targetType: AWS::EC2::VPC
  targetIdPath: VPCId
actions:
  delete:
    operation: com.amazonaws.cloudcontrol#DeleteResource
    idempotency: provider_token
    waiter: cloud_control_terminal
    readback: cloud_control_absent
extensions:
  hook: aws.cloudcontrol.resource
