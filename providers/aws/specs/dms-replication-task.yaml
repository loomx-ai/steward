schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::DMS::ReplicationTask
  class: data.transfer_job
presentation:
  displayNames:
    zh-CN: DMS 复制任务
    en-US: DMS Replication Task
scope:
  kind: region
discovery:
  source: cloud-control
  list:
    operation: com.amazonaws.cloudcontrol#ListResources
    parameters:
      TypeName: AWS::DMS::ReplicationTask
    itemsPath: ResourceDescriptions
    identityPath: Identifier
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
  detail:
    operation: com.amazonaws.cloudcontrol#GetResource
    itemsPath: ResourceDescription
    identityPath: Identifier
relationships:
- type: uses
  targetType: AWS::DMS::Endpoint
  targetIdPath: SourceEndpointArn
- type: uses
  targetType: AWS::DMS::Endpoint
  targetIdPath: TargetEndpointArn
- type: member_of
  targetType: AWS::DMS::ReplicationInstance
  targetIdPath: ReplicationInstanceArn
actions:
  delete:
    operation: com.amazonaws.cloudcontrol#DeleteResource
    idempotency: provider_token
    waiter: cloud_control_terminal
    readback: cloud_control_absent
extensions:
  hook: aws.cloudcontrol.resource
