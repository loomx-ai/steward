schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::WAFv2::WebACLAssociation
  class: security.protected_resource
presentation:
  displayNames:
    zh-CN: WAF Web ACL 关联
    en-US: WAF Web ACL Association
scope:
  kind: region
discovery:
  source: product-api
  parent:
    source: cloud-control
    nativeType: AWS::WAFv2::WebACL
  list:
    operation: com.amazonaws.wafv2#ListResourcesForWebACL
    parameters:
      WebACLArn: parent.normalized.Arn
    itemsPath: ResourceArns
    identityPath: ResourceArn
relationships:
- type: member_of
  targetType: AWS::WAFv2::WebACL
  targetIdPath: web_acl_id
- type: attached_to
  targetType: AWS::ElasticLoadBalancingV2::LoadBalancer
  targetIdPath: load_balancer_arn
actions:
  delete:
    operation: com.amazonaws.wafv2#DisassociateWebACL
    parameters:
      ResourceArn: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: com.amazonaws.wafv2#GetWebACLForResource
      parameters:
        ResourceArn: resource.nativeId
      itemsPath: WebACL
      identityPath: ResourceArn
    preconditions:
    - path: ManagedByFirewallManager
      allowedValues:
      - 'false'
      reason: A Firewall Manager policy manages this web ACL and reapplies its associations.
extensions:
  hook: aws.product.resource
