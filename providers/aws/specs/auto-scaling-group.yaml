schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::AutoScaling::AutoScalingGroup
  class: compute.autoscaling_group
presentation:
  displayNames:
    zh-CN: Auto Scaling 组
    en-US: Auto Scaling Group
scope:
  kind: region
discovery:
  source: cloud-control
  list:
    operation: com.amazonaws.cloudcontrol#ListResources
    parameters:
      TypeName: AWS::AutoScaling::AutoScalingGroup
    itemsPath: ResourceDescriptions
    identityPath: Identifier
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
  detail:
    operation: com.amazonaws.cloudcontrol#GetResource
    itemsPath: ResourceDescription
    identityPath: Identifier
relationships:
- type: member_of
  targetType: AWS::EC2::VPC
  targetIdPath: vpc_id
- type: member_of
  targetType: AWS::EC2::Subnet
  targetIdPath: subnet_ids
- type: uses
  targetType: AWS::EC2::LaunchTemplate
  targetIdPath: LaunchTemplate.LaunchTemplateId
- type: uses
  targetType: AWS::AutoScaling::LaunchConfiguration
  targetIdPath: LaunchConfigurationName
- type: uses
  targetType: AWS::ElasticLoadBalancingV2::TargetGroup
  targetIdPath: TargetGroupARNs
actions:
  delete:
    operation: com.amazonaws.cloudcontrol#DeleteResource
    idempotency: provider_token
    waiter: cloud_control_terminal
    readback: cloud_control_absent
    read:
      operation: com.amazonaws.cloudcontrol#GetResource
      parameters:
        TypeName: AWS::AutoScaling::AutoScalingGroup
        Identifier: resource.nativeId
      itemsPath: ResourceDescription.Properties
      identityPath: Identifier
    deletionProtection:
      path: DeletionProtection
      enabledValues:
      - prevent-all-deletion
      - prevent-force-deletion
      disable:
        operation: com.amazonaws.cloudcontrol#UpdateResource
        parameters:
          TypeName: AWS::AutoScaling::AutoScalingGroup
          Identifier: resource.nativeId
          PatchOperation: replace
          PatchValue: none
extensions:
  hook: aws.cloudcontrol.resource
