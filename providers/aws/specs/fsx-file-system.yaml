schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::FSx::FileSystem
  class: storage.filesystem
presentation:
  displayNames:
    zh-CN: FSx 文件系统
    en-US: FSx File System
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: com.amazonaws.fsx#DescribeFileSystems
    itemsPath: FileSystems
    identityPath: FileSystemId
    statePath: Lifecycle
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
relationships:
- type: member_of
  targetType: AWS::EC2::VPC
  targetIdPath: vpc_id
- type: member_of
  targetType: AWS::EC2::Subnet
  targetIdPath: subnet_ids
- type: uses
  targetType: AWS::EC2::SecurityGroup
  targetIdPath: security_group_ids
actions:
  delete:
    operation: com.amazonaws.fsx#DeleteFileSystem
    parameters:
      FileSystemId: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: com.amazonaws.fsx#DescribeFileSystems
      parameters:
        FileSystemIds: resource.nativeIdsJson
      itemsPath: FileSystems
      identityPath: FileSystemId
      statePath: Lifecycle
extensions:
  hook: aws.product.resource
