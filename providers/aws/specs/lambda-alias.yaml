schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::Lambda::Alias
  class: serverless.alias
presentation:
  displayNames:
    zh-CN: Lambda 别名
    en-US: Lambda Alias
scope:
  kind: region
discovery:
  source: cloud-control
  parent:
    source: cloud-control
    nativeType: AWS::Lambda::Function
  list:
    operation: com.amazonaws.cloudcontrol#ListResources
    parameters:
      TypeName: AWS::Lambda::Alias
      ResourceModel.FunctionName: parent.nativeId
    itemsPath: ResourceDescriptions
    identityPath: Identifier
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
  detail:
    operation: com.amazonaws.cloudcontrol#GetResource
    itemsPath: ResourceDescription
    identityPath: Identifier
relationships:
- type: member_of
  targetType: AWS::Lambda::Function
  targetIdPath: function_name
- type: uses
  targetType: AWS::Lambda::Version
  targetIdPath: version_arns
actions:
  delete:
    operation: com.amazonaws.cloudcontrol#DeleteResource
    idempotency: provider_token
    waiter: cloud_control_terminal
    readback: cloud_control_absent
extensions:
  hook: aws.cloudcontrol.resource
