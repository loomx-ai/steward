schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::DirectConnect::DirectConnectGatewayAssociation
  class: network.cen_attachment
presentation:
  displayNames:
    zh-CN: Direct Connect 网关关联
    en-US: Direct Connect Gateway Association
scope:
  kind: global
discovery:
  source: cloud-control
  parent:
    source: cloud-control
    nativeType: AWS::DirectConnect::DirectConnectGateway
  list:
    operation: com.amazonaws.cloudcontrol#ListResources
    parameters:
      TypeName: AWS::DirectConnect::DirectConnectGatewayAssociation
      ResourceModel.DirectConnectGatewayId: parent.normalized.DirectConnectGatewayId
    itemsPath: ResourceDescriptions
    identityPath: Identifier
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
  detail:
    operation: com.amazonaws.cloudcontrol#GetResource
    itemsPath: ResourceDescription
    identityPath: Identifier
actions:
  delete:
    operation: com.amazonaws.cloudcontrol#DeleteResource
    idempotency: provider_token
    waiter: cloud_control_terminal
    readback: cloud_control_absent
extensions:
  hook: aws.cloudcontrol.resource
