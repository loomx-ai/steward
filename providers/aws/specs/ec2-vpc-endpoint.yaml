schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::EC2::VPCEndpoint
  class: network.vpc_endpoint
presentation:
  displayNames:
    en-US: EC2 VPC Endpoint
scope:
  kind: region
discovery:
  source: cloud-control
  detail:
    operation: com.amazonaws.cloudcontrol#GetResource
    itemsPath: ResourceDescription
    identityPath: Identifier
relationships:
  - type: uses
    targetType: AWS::EC2::RouteTable
    targetIdPath: RouteTableIds
  - type: member_of
    targetType: AWS::EC2::VPC
    targetIdPath: vpc_id
  - type: member_of
    targetType: AWS::EC2::Subnet
    targetIdPath: subnet_ids
  - type: uses
    targetType: AWS::EC2::SecurityGroup
    targetIdPath: security_group_ids
actions:
  delete:
    operation: com.amazonaws.cloudcontrol#DeleteResource
    idempotency: provider_token
    waiter: cloud_control_terminal
    readback: cloud_control_absent
extensions:
  hook: aws.cloudcontrol.resource
