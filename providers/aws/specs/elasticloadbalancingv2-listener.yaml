schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::ElasticLoadBalancingV2::Listener
  class: network.load_balancer_listener
presentation:
  displayNames:
    zh-CN: 负载均衡监听器
    en-US: Load Balancer Listener
scope:
  kind: region
discovery:
  source: cloud-control
  parent:
    source: cloud-control
    nativeType: AWS::ElasticLoadBalancingV2::LoadBalancer
  list:
    operation: com.amazonaws.cloudcontrol#ListResources
    parameters:
      TypeName: AWS::ElasticLoadBalancingV2::Listener
      ResourceModel.LoadBalancerArn: parent.nativeId
    itemsPath: ResourceDescriptions
    identityPath: Identifier
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
  detail:
    operation: com.amazonaws.cloudcontrol#GetResource
    itemsPath: ResourceDescription
    identityPath: Identifier
relationships:
- type: member_of
  targetType: AWS::ElasticLoadBalancingV2::LoadBalancer
  targetIdPath: LoadBalancerArn
actions:
  delete:
    operation: com.amazonaws.cloudcontrol#DeleteResource
    idempotency: provider_token
    waiter: cloud_control_terminal
    readback: cloud_control_absent
extensions:
  hook: aws.cloudcontrol.resource
