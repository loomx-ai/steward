schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::ServiceDiscovery::Service
  class: middleware.registry_service
presentation:
  displayNames:
    zh-CN: Cloud Map 服务
    en-US: Cloud Map Service
scope:
  kind: region
discovery:
  source: cloud-control
  list:
    operation: com.amazonaws.cloudcontrol#ListResources
    parameters:
      TypeName: AWS::ServiceDiscovery::Service
    itemsPath: ResourceDescriptions
    identityPath: Identifier
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
  detail:
    operation: com.amazonaws.cloudcontrol#GetResource
    itemsPath: ResourceDescription
    identityPath: Identifier
relationships:
- type: member_of
  targetType: AWS::ServiceDiscovery::PrivateDnsNamespace
  targetIdPath: NamespaceId
- type: member_of
  targetType: AWS::ServiceDiscovery::HttpNamespace
  targetIdPath: NamespaceId
actions:
  delete:
    operation: com.amazonaws.cloudcontrol#DeleteResource
    idempotency: provider_token
    waiter: cloud_control_terminal
    readback: cloud_control_absent
extensions:
  hook: aws.cloudcontrol.resource
