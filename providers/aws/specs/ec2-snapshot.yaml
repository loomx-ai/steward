schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::EC2::Snapshot
  class: storage.snapshot
presentation:
  displayNames:
    zh-CN: EBS 快照
    en-US: EBS Snapshot
  consoleLinkTemplate: https://{regionId}.console.aws.amazon.com/ec2/home?region={regionId}#SnapshotDetails:snapshotId={nativeId}
scope:
  kind: region
discovery:
  source: product-api
  list:
    operation: com.amazonaws.ec2#DescribeSnapshots
    parameters:
      OwnerIds:
      - self
    itemsPath: Snapshots
    identityPath: SnapshotId
    statePath: State
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 1000
relationships:
- type: uses
  targetType: AWS::EC2::Volume
  targetIdPath: VolumeId
actions:
  delete:
    operation: com.amazonaws.ec2#DeleteSnapshot
    parameters:
      SnapshotId: resource.nativeId
    idempotency: readback
    waiter: absent
    read:
      operation: com.amazonaws.ec2#DescribeSnapshots
      parameters:
        SnapshotIds: resource.nativeIdsJson
      itemsPath: Snapshots
      identityPath: SnapshotId
      statePath: State
extensions:
  hook: aws.product.resource
