schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::EKS::FargateProfile
  class: container.fargate_profile
presentation:
  displayNames:
    zh-CN: EKS Fargate 配置文件
    en-US: EKS Fargate Profile
scope:
  kind: region
discovery:
  source: cloud-control
  parent:
    source: cloud-control
    nativeType: AWS::EKS::Cluster
  list:
    operation: com.amazonaws.cloudcontrol#ListResources
    parameters:
      TypeName: AWS::EKS::FargateProfile
      ResourceModel.ClusterName: parent.nativeId
    itemsPath: ResourceDescriptions
    identityPath: Identifier
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 100
  detail:
    operation: com.amazonaws.cloudcontrol#GetResource
    itemsPath: ResourceDescription
    identityPath: Identifier
relationships:
- type: member_of
  targetType: AWS::EC2::VPC
  targetIdPath: vpc_id
- type: member_of
  targetType: AWS::EC2::Subnet
  targetIdPath: subnet_ids
- type: member_of
  targetType: AWS::EKS::Cluster
  targetIdPath: ClusterName
actions:
  delete:
    operation: com.amazonaws.cloudcontrol#DeleteResource
    idempotency: provider_token
    waiter: cloud_control_terminal
    readback: cloud_control_absent
extensions:
  hook: aws.cloudcontrol.resource
