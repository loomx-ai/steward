schema: steward.io/resource-kind
kind: ResourceKind
metadata:
  provider: aws
  nativeType: AWS::EC2::ClientVpnTargetNetworkAssociation
  class: network.vpn_server_association
presentation:
  displayNames:
    zh-CN: Client VPN 目标网络关联
    en-US: Client VPN Target Network Association
scope:
  kind: region
discovery:
  source: product-api
  parent:
    source: product-api
    nativeType: AWS::EC2::ClientVpnEndpoint
  list:
    operation: com.amazonaws.ec2#DescribeClientVpnTargetNetworks
    parameters:
      ClientVpnEndpointId: parent.nativeId
    itemsPath: ClientVpnTargetNetworks
    identityPath: AssociationKey
    statePath: Status.Code
    pagination:
      type: token
      tokenParameter: NextToken
      tokenPath: NextToken
      pageSizeParameter: MaxResults
      maxPageSize: 1000
relationships:
- type: member_of
  targetType: AWS::EC2::ClientVpnEndpoint
  targetIdPath: ClientVpnEndpointId
- type: uses
  targetType: AWS::EC2::Subnet
  targetIdPath: subnet_ids
actions:
  delete:
    operation: com.amazonaws.ec2#DisassociateClientVpnTargetNetwork
    parameters:
      ClientVpnEndpointId: resource.normalized.ClientVpnEndpointId
      AssociationId: resource.normalized.AssociationId
    idempotency: readback
    waiter: absent
    read:
      operation: com.amazonaws.ec2#DescribeClientVpnTargetNetworks
      parameters:
        ClientVpnEndpointId: resource.normalized.ClientVpnEndpointId
        AssociationIds: resource.normalized.AssociationId
      itemsPath: ClientVpnTargetNetworks
      identityPath: AssociationKey
      statePath: Status.Code
extensions:
  hook: aws.product.resource
