name: test

on:
  workflow_call:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: steward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steward -d steward_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STEWARD_TEST_POSTGRES_DSN: postgres://steward:steward@127.0.0.1:5432/steward_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: go test ./...
      - run: go test -race ./internal/... ./providers/...
      - run: go vet ./...
      - run: npm --prefix web run test
      - run: npm --prefix web run lint
      - run: npm --prefix web run build
