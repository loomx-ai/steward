name: test

on:
  workflow_call:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: steward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steward -d steward_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STEWARD_TEST_POSTGRES_DSN: postgres://steward:steward@127.0.0.1:5432/steward_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go test -timeout 30m ./...
      - run: go vet ./...
      - run: npm --prefix web run test
      - run: npm --prefix web run lint
      - run: npm --prefix web run build

  # The race detector multiplies each package's runtime, and providers/azure
  # alone exceeds a shared 30-minute budget. Each group gets its own job and
  # timeout so one large package cannot exhaust the others' time.
  race:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: internal
            packages: ./internal/...
          - name: azure-a-upper
            packages: ./providers/azure/...
            run: "-run ^TestA[A-Z]"
          - name: azure-a-lower
            packages: ./providers/azure/...
            run: "-run ^TestA[a-z]"
          - name: azure-bc
            packages: ./providers/azure/...
            run: "-run ^Test[B-C]"
          - name: azure-d
            packages: ./providers/azure/...
            run: "-run ^TestD"
          - name: azure-e
            packages: ./providers/azure/...
            run: "-run ^TestE"
          - name: azure-fp
            packages: ./providers/azure/...
            run: "-run ^Test[F-P]"
          - name: azure-rw
            packages: ./providers/azure/...
            run: "-run ^Test[R-W]"
          - name: gcp
            packages: ./providers/gcp/...
          - name: aws-alicloud
            packages: ./providers/aws/... ./providers/alicloud/... ./providers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 -timeout 60m ${{ matrix.run }} ${{ matrix.packages }}
