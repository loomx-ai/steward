name: test

on:
  workflow_call:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: steward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steward -d steward_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STEWARD_TEST_POSTGRES_DSN: postgres://steward:steward@127.0.0.1:5432/steward_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go test ./...
      - run: go test -race -timeout 30m ./internal/... ./providers/...
      - run: go vet ./...
      - run: npm --prefix web run test
      - run: npm --prefix web run lint
      - run: npm --prefix web run build

  aws-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install "moto[server]==5.2.3"
      - name: Start Moto
        run: |
          moto_server -H 127.0.0.1 -p 5055 > moto.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5055/moto-api/ && exit 0
            sleep 1
          done
          cat moto.log
          exit 1
      - run: go test -count=1 -run Moto ./providers/aws
        env:
          STEWARD_AWS_MOTO_URL: http://127.0.0.1:5055

  gcp-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/fsouza/fake-gcs-server@v1.52.2
      - name: Start fake-gcs-server
        run: |
          "$(go env GOPATH)/bin/fake-gcs-server" -scheme http -host 127.0.0.1 -port 4443 -backend memory > fake-gcs.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4443/storage/v1/b && exit 0
            sleep 1
          done
          cat fake-gcs.log
          exit 1
      - run: go test -count=1 -run Emulator ./providers/gcp
        env:
          STEWARD_GCS_EMULATOR_URL: http://127.0.0.1:4443
