name: test

on:
  workflow_call:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: steward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steward -d steward_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STEWARD_TEST_POSTGRES_DSN: postgres://steward:steward@127.0.0.1:5432/steward_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go test ./...
      - run: go vet ./...
      - run: npm --prefix web run test
      - run: npm --prefix web run lint
      - run: npm --prefix web run build

  # The race detector multiplies each package's runtime, and providers/azure
  # alone exceeds a shared 30-minute budget. Each group gets its own job and
  # timeout so one large package cannot exhaust the others' time.
  race:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: internal
            packages: ./internal/...
          - name: azure-abc
            packages: ./providers/azure/...
            run: "-run ^Test[A-C]"
          - name: azure-de
            packages: ./providers/azure/...
            run: "-run ^Test[D-E]"
          - name: azure-fp
            packages: ./providers/azure/...
            run: "-run ^Test[F-P]"
          - name: azure-rw
            packages: ./providers/azure/...
            run: "-run ^Test[R-W]"
          - name: gcp
            packages: ./providers/gcp/...
          - name: aws-alicloud
            packages: ./providers/aws/... ./providers/alicloud/... ./providers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 -timeout 60m ${{ matrix.run }} ${{ matrix.packages }}

  aws-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install "moto[server]==5.2.3"
      - name: Start Moto
        run: |
          moto_server -H 127.0.0.1 -p 5055 > moto.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5055/moto-api/ && exit 0
            sleep 1
          done
          cat moto.log
          exit 1
      - run: go test -count=1 -run Moto ./providers/aws
        env:
          STEWARD_AWS_MOTO_URL: http://127.0.0.1:5055

  gcp-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/fsouza/fake-gcs-server@v1.52.2
      - name: Start fake-gcs-server
        run: |
          "$(go env GOPATH)/bin/fake-gcs-server" -scheme http -host 127.0.0.1 -port 4443 -backend memory > fake-gcs.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4443/storage/v1/b && exit 0
            sleep 1
          done
          cat fake-gcs.log
          exit 1
      - name: Start the pinned Bigtable harness
        run: |
          cd providers/gcp/fixtures/bigtable/harness
          go run . -listen 127.0.0.1:8091 > "$RUNNER_TEMP/bigtable.log" 2>&1 &
          for attempt in $(seq 1 60); do
            grep -q "http://127.0.0.1:8091" "$RUNNER_TEMP/bigtable.log" && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/bigtable.log"
          exit 1
      - run: go test -count=1 -run Emulator ./providers/gcp
        env:
          STEWARD_GCS_EMULATOR_URL: http://127.0.0.1:4443
          STEWARD_BIGTABLE_EMULATOR_URL: http://127.0.0.1:8091

  gcp-mockgcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Builds Google's pinned Config Connector mocks and runs every test that
      # needs them, each against a freshly started harness.
      - run: python3 scripts/run-mockgcp-tests.py

  azure-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/azurite" azurite@3.35.0
      - name: Start Azurite with OAuth
        run: |
          cd "$RUNNER_TEMP/azurite"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 1 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"
          node_modules/.bin/azurite-blob --blobHost 127.0.0.1 --blobPort 10000 --oauth basic --cert cert.pem --key key.pem --inMemoryPersistence --skipApiVersionCheck > azurite.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sk -o /dev/null https://127.0.0.1:10000/ && exit 0
            sleep 1
          done
          cat azurite.log
          exit 1
      - run: go test -count=1 -run Azurite ./providers/azure
        env:
          STEWARD_AZURITE_BLOB_URL: https://127.0.0.1:10000

  azure-apim-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the pinned community APIM emulator
        run: |
          git -C "$RUNNER_TEMP" init apim-emulator
          cd "$RUNNER_TEMP/apim-emulator"
          git remote add origin https://github.com/calvinchengx/azure-apim-emulator.git
          git fetch --depth 1 origin a1aafcf2d9743967684d9458a3371dcc86e09ef6
          git checkout -q FETCH_HEAD
          go build -o "$RUNNER_TEMP/apim-emulator-bin" ./cmd/azure-apim-emulator
      - name: Start the emulator
        run: |
          "$RUNNER_TEMP/apim-emulator-bin" --disable-auth --disable-tls --addr 127.0.0.1:18085 --data-dir '' --location westus --default-service steward-test > "$RUNNER_TEMP/apim.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:18085/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/apim.log"
          exit 1
      - run: go test -count=1 -run '^TestAPIMIndependentEmulator$' ./providers/azure
        env:
          STEWARD_APIM_EMULATOR_URL: http://127.0.0.1:18085

  azure-test-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch Microsoft's pinned Test Proxy
        run: |
          cd "$RUNNER_TEMP"
          curl -sfL -o test-proxy.tar.gz https://github.com/Azure/azure-sdk-tools/releases/download/Azure.Sdk.Tools.TestProxy_1.0.0-dev.20260521.2/test-proxy-standalone-linux-x64.tar.gz
          echo "ea0aa71e50fc279e511ba245d3457a9e9c8b5cce60bd58080b3e6ff48bb4cbcd  test-proxy.tar.gz" | sha256sum -c -
          mkdir -p test-proxy && tar -xzf test-proxy.tar.gz -C test-proxy
          chmod +x test-proxy/Azure.Sdk.Tools.TestProxy
      - run: go test -count=1 -run 'TestDataProtection' ./providers/azure
        env:
          STEWARD_AZURE_TEST_PROXY: ${{ runner.temp }}/test-proxy/Azure.Sdk.Tools.TestProxy
